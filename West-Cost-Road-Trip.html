  function firstProblem(chain) {
    if (!chain || !chain.errors || !chain.errors.length) return 'No reason was recorded.';
    var e = chain.errors[0];
    return 'Commit ' + TP.verify.shortId(e.commitId) + ': ' + e.problem + '.';
  }

  function when(timestamp) {
    if (!timestamp) return 'no timestamp';
    var d = new Date(timestamp);
    if (isNaN(d.getTime())) return timestamp;
    return d.toLocaleString();
  }

  // ---- Details, with a comparison against the current version ----

  function inspect(commitId) {
    selected = commitId;
    TP.ui.shell.renderActive();
  }

  function detailCard(commitId, history) {
    var commit = TP.history.find(history, commitId);
    var card = r().el('div', { class: 'card' }, [
      r().el('div', { class: 'card__head' }, [
        r().el('h2', { text: 'Commit ' + TP.verify.shortId(commitId) }),
        r().el('span', { class: 'flex gap ml-auto' }, [
          r().button('Close', function () { selected = null; TP.ui.shell.renderActive(); }, { class: 'btn btn--ghost btn--sm' }),
        ]),
      ]),
    ]);

    if (!commit) {
      r().append(card, r().el('p', { class: 'subtle', text: 'That commit is not in this document.' }));
      return card;
    }

    var payloadCheck = TP.verify.payload(history, commitId);
    r().append(card, r().el('div', { class: payloadCheck.ok ? 'info' : 'info info--danger' }, [
      r().el('strong', { text: payloadCheck.ok ? 'This version can be rebuilt exactly.' : 'This version cannot be rebuilt.' }),
      r().el('div', { text: payloadCheck.ok
        ? 'Its contents hash to the same value they were committed with.'
        : (payloadCheck.errors || []).map(function (e) { return e.problem; }).join(' ') }),
    ]));

    r().append(card, r().el('dl', { class: 'kv' }, [
      r().el('dt', { text: 'Message' }), r().el('dd', { text: commit.message || 'Edit' }),
      r().el('dt', { text: 'When' }), r().el('dd', { text: when(commit.timestamp) }),
      r().el('dt', { text: 'Who' }), r().el('dd', { text: authorOf(commit) }),
      r().el('dt', { text: 'Parents' }), r().el('dd', { text: (commit.parents || []).map(TP.verify.shortId).join(', ') || 'none — this is where the document begins' }),
      r().el('dt', { text: 'Contents' }), r().el('dd', { text: commit.payloadHash }),
    ]));

    // What changed between this version and the one at head. Ordering comes from ancestry
    // (PAT-INV-08), so "before" and "after" are facts rather than guesses about clocks.
    var headPayload = TP.history.headPayload(history);
    var here = TP.history.reconstruct(history, commitId);
    if (headPayload && here && commitId !== history.head) {
      // A is the version being viewed and B is the head. A past commit is an ancestor of head, so
      // the ordinary case is B_NEWER — "the head has this and the viewed version does not" — and
      // the diff below runs here → head, which is the same direction.
      var order = TP.history.compare(history, commitId, history, history.head);
      var diff = TP.patch.diff(here, headPayload);
      var heading = order === TP.history.B_NEWER
        ? 'Everything that happened since this version'
        : order === TP.history.A_NEWER
          ? 'Everything this version has that the current one does not'
          : order === TP.history.IDENTICAL
            ? 'This is the current version'
            : 'These versions are on different lines of history';
      r().append(card, r().el('h3', { class: 'mt', text: heading }));
      if (!diff.length) {
        r().append(card, r().el('p', { class: 'subtle', text: 'The trip itself is the same.' }));
      } else {
        r().append(card, r().el('p', { class: 'subtle', text: TP.format.plural(diff.length, 'change') + ' to the trip.' }));
        r().append(card, r().el('ul', { class: 'sublist' }, diff.slice(0, 60).map(function (op) {
          return r().el('li', { text: describeOp(op) });
        })));
        if (diff.length > 60) {
          r().append(card, r().el('p', { class: 'subtle', text: '…and ' + (diff.length - 60) + ' more.' }));
        }
      }
    }

    r().append(card, r().el('div', { class: 'flex gap mt' }, [
      r().button('Export this version', function () { exportVersion(commitId); }, { class: 'btn' }),
      commitId === history.head ? null : r().button('Revert to this version', function () { revert(commitId); }, { class: 'btn btn--danger' }),
    ]));

    return card;
  }

  // A patch path is an array of segments, so this is a rendering choice and nothing else —
  // an unsafe segment could never have got this far (REQ-405's rejection happens on apply).
  function describeOp(op) {
    var where = (op.path || []).map(function (s) { return typeof s === 'number' ? '[' + s + ']' : s; }).join('.');
    if (op.op === 'add') return 'added ' + where;
    if (op.op === 'remove') return 'removed ' + where;
    return 'changed ' + where;
  }

  // Reverting is a FORWARD commit (REQ-311): the version you left is still there to come back
  // to. This is the only reason "revert" is safe to offer at all.
  function revert(commitId) {
    var history = TP.store.history();
    var commit = TP.history.find(history, commitId);
    if (!commit) return null;
    return TP.ui.modal.confirm({
      title: 'Go back to this version?',
      body: r().el('div', {}, [
        r().el('p', { text: 'The trip goes back to how it was at “' + (commit.message || 'Edit') + '” (' + when(commit.timestamp) + ').' }),
        r().el('p', { class: 'subtle', text: 'This is recorded as a new commit, not as a deletion — everything since then is still in the history and can be returned to.' }),
      ]),
      confirmLabel: 'Go back',
    }).then(function (yes) {
      if (!yes) return null;
      var res = TP.store.revertTo(commitId, 'Revert to ' + TP.verify.shortId(commitId));
      if (res && res.ok) {
        TP.ui.toast.ok('Reverted. The previous state is still in the history.');
        TP.ui.shell.reflectMode();
        TP.ui.shell.renderAll();
      } else {
        TP.ui.toast.error((res && res.reason) || 'The revert could not be recorded.');
      }
      return res;
    });
  }

  // Export a container whose head is the chosen commit. The file carries the whole history,
  // so exporting an older version is a view of the document rather than a different document.
  function exportVersion(commitId) {
    var history = TP.store.history();
    var payload = TP.history.reconstruct(history, commitId);
    if (!payload) {
      TP.ui.toast.error('That version could not be rebuilt, so nothing was exported.');
      return null;
    }
    var container = TP.container.create(payload, TP.store.buildInfo(), {
      keyframeInterval: history.keyframeInterval,
      head: commitId,
      commits: history.commits,
    });
    var result = TP.io.export.artifact(container);
    if (!result.ok) {
      TP.ui.modal.notice({
        title: 'This version was not exported',
        body: r().el('div', { class: 'info info--danger', text: result.reason }),
      });
      return null;
    }
    return TP.io.export.deliver(result).then(function (delivered) {
      if (delivered.aborted) return null;
      if (delivered.ok) TP.ui.toast.ok('Saved ' + delivered.filename + ' — it opens at this version.');
      else TP.ui.toast.warn(delivered.reason || 'The file could not be saved.');
      return delivered;
    });
  }

  return {
    render: render,
    inspect: inspect,
    revert: revert,
    exportVersion: exportVersion,
    storageKind: storageKind,
    when: when,
    selected: function () { return selected; },
  };
})();

/* ------------------------------ src/ui/reconcile.js ------------------------------ */
// Reconciliation and import decisions (specs/04-versioning.md §5, specs/06 §2).
//
// Both of the dialogs in this file exist because a program cannot make the choice honestly:
// when two lines of history have diverged, or when a file's content would replace what is on
// screen, the user is the only one who knows which version they meant. Neither dialog has a
// default that discards anything.

TP.ui.reconcile = (function () {
  'use strict';

  var R = null;
  function r() { R = R || TP.ui.render; return R; }

  // ---- Two copies of the same document that have both moved on ----

  function applyDivergence(plan) {
    var options = TP.merge.optionsFor(plan);
    var base = plan.base ? TP.history.find(TP.store.history(), plan.base) : null;

    var radios = [];
    var body = [
      r().el('div', { class: 'info info--warn' }, [
        r().el('strong', { text: 'This file and the copy in this browser have both changed.' }),
        r().el('div', { text: 'Neither is a later version of the other — they are two lines of history. ' +
          'Whichever you choose, the other is left alone on disk or in storage; nothing is deleted.' }),
      ]),
      base ? r().el('p', { class: 'subtle', text: 'They last agreed at ' + TP.verify.shortId(plan.base) + ' — “' + (base.message || 'Edit') + '”, ' + TP.ui.history.when(base.timestamp) + '.' }) : null,
      r().el('div', { class: 'field' }, options.map(function (o) {
        var radio = r().el('input', { type: 'radio', name: 'reconcile', value: o.id, checked: o.id === options[0].id });
        radios.push(radio);
        return r().el('label', { class: 'flex gap items-start mb-sm' }, [
          radio,
          r().el('span', {}, [r().el('strong', { text: o.label }), r().el('div', { class: 'subtle', text: o.hint })]),
        ]);
      })),
    ];

    // The dialog resolves with the ACTION, not the form (modal.open), so the selection has to be
    // read off the radios when it is answered. Capturing `options[0].id` before opening it — which
    // is what this did — made the first option the only one that could ever be applied: choosing
    // "Take the file" and pressing the button silently kept this browser's copy instead.
    function chosenId() {
      for (var i = 0; i < radios.length; i++) if (radios[i].checked) return radios[i].value;
      return options.length ? options[0].id : null;
    }

    return TP.ui.modal.open({
      title: 'Two versions of this document',
      dismissible: false,
      body: body,
      defaultAction: 'apply',
      actions: [
        { id: 'apply', label: 'Use this choice' },
        { id: 'readonly', label: 'Open read-only' },
      ],
    }).then(function (id) {
      if (id === 'apply') {
        var chosen = chosenId();
        applyChoice(plan, chosen);
        return { ok: true, choice: chosen };
      }
      return { ok: true, choice: 'read-only', readOnly: true };
    });
  }

  function applyChoice(plan, choiceId) {
    if (choiceId === 'take-file') {
      // The file becomes the new head, recorded as a merge commit with the local work as the
      // second parent — so the local line is still reachable rather than abandoned.
      var localHead = TP.store.head();
      var result = TP.history.merge(TP.store.history(), TP.store.payload(), [localHead], {
        docId: TP.store.docIdOf(TP.store.container()),
        author: { name: 'You', email: '' },
        timestamp: new Date().toISOString(),
        message: 'Merge: took the file, kept this browser’s history',
      });
      if (result && result.history) {
        TP.store.container().history = result.history;
        TP.store.save();
        TP.ui.toast.ok('The file’s version is now current. Your other line is still in the history.');
      }
      return;
    }
    // keep-local: nothing changes. Saying so out loud is the point.
    TP.ui.toast.info('This browser’s version stays as it is. The file is untouched; export to write a new one.');
    void plan;
  }

  // ---- Import ----

  function acceptImport(result) {
    if (!result || !result.ok) {
      TP.ui.toast.error((result && result.reason) || 'That file could not be read.');
      return Promise.resolve(null);
    }
    if (result.format === 'artifact') return acceptDocument(result);
    return acceptData(result);
  }

  // A planner document opens as itself. It is not merged into the trip on screen: two trips
  // are two documents, and one of them is about to be replaced on screen — the file on disk
  // is untouched either way.
  function acceptDocument(result) {
    var chain = TP.verify.chain(result.container.history);
    var payloadCheck = TP.verify.payload(result.container.history);

    var body = [
      r().el('p', { text: TP.io.import.describe(result) }),
      r().el('dl', { class: 'kv' }, [
        r().el('dt', { text: 'Document' }), r().el('dd', { text: TP.store.docIdOf(result.container) || 'none recorded' }),
        r().el('dt', { text: 'Format' }), r().el('dd', { text: String(result.container.format) }),
        r().el('dt', { text: 'Made with' }), r().el('dd', { text: (result.container.build && result.container.build.appVersion) || 'unknown' }),
      ]),
      chain.ok
        ? r().el('div', { class: 'info', text: 'Its chain is intact' + (payloadCheck.ok ? ' and its contents rebuild exactly.' : ', though its contents could not be rebuilt.') })
        : r().el('div', { class: 'info info--danger', text: 'Its history does not hold together: ' +
          ((chain.errors[0] && TP.verify.shortId(chain.errors[0].commitId) + ' ' + chain.errors[0].problem) || 'no reason recorded') +
          '. It will be opened read-only, and nothing will be written to your storage.' }),
    ];

    var incompatible = result.container.format && !TP.container.isReadableFormat(result.container.format);
    if (incompatible) {
      body.push(r().el('div', { class: 'info info--warn', text:
        'This file was made by a newer version of the planner (format ' + result.container.format +
        ', and this app reads up to ' + TP.container.FORMAT + '). It will be opened read-only so ' +
        'that opening it cannot quietly strip out something you cannot see.' }));
    }

    var current = TP.store.docIdOf(TP.store.container());
    if (current && current === TP.store.docIdOf(result.container)) {
      body.push(r().el('p', { class: 'subtle', text: 'This is the same document you have open. Opening it again replaces what is on screen with the file’s version.' }));
    } else {
      body.push(r().el('p', { class: 'subtle', text: 'Opening it replaces what is on screen. The document you have now is not lost — it is still in this browser and in whatever file you exported.' }));
    }

    return TP.ui.modal.open({
      title: 'Open this document?',
      body: body,
      defaultAction: 'open',
      actions: [{ id: 'cancel', label: 'Cancel' }, { id: 'open', label: 'Open it' }],
    }).then(function (id) {
      if (id !== 'open') return null;
      var readOnly = !chain.ok || incompatible;
      var storage = readOnly
        ? TP.storage.create('null')
        : TP.store.storage();
      // A file opened over a running page, so the swap also re-arms the store's interactivity:
      // `init` alone would leave Export disabled from here on (see `TP.store.openDocument`).
      TP.store.openDocument(result.container, storage, { readOnly: readOnly });
      if (!readOnly && storage && storage.available()) {
        TP.registry.register(storage, {
          docId: TP.store.docIdOf(result.container),
          title: TP.model.tripTitle(TP.container.payloadTrip(result.container)),
          updatedAt: new Date().toISOString(),
        });
      }
      var plan = readOnly ? { action: TP.merge.IDENTICAL } : TP.store.reconcileLocal();
      TP.ui.shell.reflectMode();
      TP.ui.shell.renderAll();
      if (plan.action === TP.merge.DIVERGED) return applyDivergence(plan).then(function () { return id; });

      if (readOnly) {
        TP.ui.toast.warn('Opened read-only. Export to get a copy you can edit.');
      } else {
        TP.ui.toast.ok('Opened ' + TP.model.tripTitle(TP.store.trip()) + '.');
      }
      return id;
    });
  }

  // Trip data and calendars carry a trip, not a document. The default is a NEW document
  // (REQ-616): a file someone sent you is its own trip, and dropping it into the document you
  // have open would attach it to a history it never belonged to. Replacing or adding are both
  // offered, and both are things the user asks for rather than things that happen.
  function acceptData(result) {
    var trip = result.trip;
    var days = (trip.days || []).length;
    var items = countItems(trip);

    var body = [
      r().el('p', { text: TP.io.import.describe(result) }),
      r().el('dl', { class: 'kv' }, [
        r().el('dt', { text: 'Dates' }), r().el('dd', { text: (trip.startDate || 'unstated') + ' → ' + (trip.endDate || 'unstated') }),
        r().el('dt', { text: 'Days' }), r().el('dd', { text: String(days) }),
        r().el('dt', { text: 'Items' }), r().el('dd', { text: String(items) }),
      ]),
    ];

    if (result.losses && result.losses.length) {
      body.push(r().el('div', { class: 'info', text: 'This format cannot carry: ' +
        result.losses.map(function (l) { return l.field; }).join(', ') +
        '. What it did carry arrives in full.' }));
    }
    if (result.blocked && result.blocked.length) {
      body.push(r().el('div', { class: 'info info--warn', text: result.blocked.length +
        ' entr' + (result.blocked.length === 1 ? 'y was' : 'ies were') + ' left out because ' +
        (result.blocked.length === 1 ? 'it has' : 'they have') + ' no date: ' +
        result.blocked.map(function (b) { return b.title || b.id; }).join(', ') + '.' }));
    }

    body.push(r().el('p', { class: 'subtle', text: 'Opening it on its own leaves the trip you have exactly as it is, and gives the imported one a history of its own.' }));

    return TP.ui.modal.open({
      title: 'What should happen to this trip?',
      body: body,
      defaultAction: 'new-document',
      actions: [
        { id: 'cancel', label: 'Cancel' },
        { id: 'new-document', label: 'Open it on its own' },
        { id: 'add', label: 'Add it to this trip' },
        { id: 'replace', label: 'Replace this trip', danger: true },
      ],
    }).then(function (id) {
      if (id === 'cancel' || !id) return null;
      if (id === 'new-document') return openAsNewDocument(trip);
      if (id === 'replace') return replaceTrip(trip);
      return addTrip(trip);
    });
  }

  function openAsNewDocument(trip) {
    TP.store.newDocument();
    TP.store.replaceTrip('Import ' + (trip.title || 'a trip'), trip);
    var res = TP.store.commit('Import ' + (trip.title || 'a trip'));
    TP.ui.tripList.render();
    TP.ui.shell.renderSidebarFoot();
    TP.ui.shell.reflectMode();
    TP.ui.shell.renderAll();
    TP.ui.toast.ok(res && res.ok
      ? 'Opened as its own document. Export it to make a file that carries it.'
      : 'Opened as its own document.');
    return 'new-document';
  }

  function replaceTrip(incoming) {
    var current = TP.store.trip();
    return TP.ui.modal.confirm({
      title: 'Replace the trip on screen?',
      body: r().el('div', {}, [
        r().el('p', { text: '“' + TP.model.tripTitle(current) + '” is replaced by “' + TP.model.tripTitle(incoming) + '”.' }),
        r().el('p', { class: 'subtle', text: 'The replacement is recorded as a commit, so History can put the old trip back. It is not deleted.' }),
      ]),
      confirmLabel: 'Replace it',
      danger: true,
    }).then(function (yes) {
      if (!yes) return null;
      TP.store.replaceTrip('Replace with ' + (incoming.title || 'imported trip'), incoming);
      TP.store.commit('Import ' + (incoming.title || 'a trip'));
      TP.ui.shell.renderSidebarFoot();
      TP.ui.shell.reflectMode();
      TP.ui.shell.renderAll();
      TP.ui.toast.ok('Replaced. History has the previous trip if you want it back.');
      return 'replace';
    });
  }

  // Adding means: days that already exist in the range gain the incoming items; days outside
  // it are appended. Nothing already on screen is removed, and nothing is overwritten.
  function addTrip(incoming) {
    var before = countItems(TP.store.trip());
    TP.store.edit('Add an imported ' + (incoming.title || 'trip'), function (trip) {
      var byDate = Object.create(null);
      (trip.days || []).forEach(function (d) { if (d.date) byDate[d.date] = d; });

      (incoming.days || []).forEach(function (day) {
        var target = day.date ? byDate[day.date] : null;
        if (!target) {
          var copy = TP.model.clone(day);
          copy.id = TP.uid();
          (copy.items || []).forEach(function (i) { i.id = TP.uid(); });
          trip.days = trip.days || [];
          trip.days.push(copy);
          if (day.date) byDate[day.date] = copy;
          return;
        }
        // An existing day keeps its own words; only the incoming items are added, and each
        // gets a fresh id so it can be undone and removed on its own.
        (day.items || []).forEach(function (item) {
          var copy = TP.model.clone(item);
          copy.id = TP.uid();
          target.items.push(copy);
        });
      });

      if (!trip.startDate || (incoming.startDate && incoming.startDate < trip.startDate)) trip.startDate = incoming.startDate || trip.startDate;
      if (!trip.endDate || (incoming.endDate && incoming.endDate > trip.endDate)) trip.endDate = incoming.endDate || trip.endDate;

      (trip.days || []).sort(function (a, b) { return String(a.date || '').localeCompare(String(b.date || '')); });
    });
    TP.store.commit('Import ' + (incoming.title || 'a trip'));

    var added = countItems(TP.store.trip()) - before;
    TP.ui.shell.reflectMode();
    TP.ui.shell.renderAll();
    TP.ui.toast.ok(added > 0
      ? 'Added ' + TP.format.plural(added, 'item') + ' to this trip.'
      : 'Nothing new to add — this trip already has all of it.');
    return 'add';
  }

  function countItems(trip) {
    return (trip.days || []).reduce(function (n, d) { return n + (d.items || []).length; }, 0);
  }

  return {
    applyDivergence: applyDivergence,
    applyChoice: applyChoice,
    acceptImport: acceptImport,
    acceptDocument: acceptDocument,
    acceptData: acceptData,
    openAsNewDocument: openAsNewDocument,
    replaceTrip: replaceTrip,
    addTrip: addTrip,
    countItems: countItems,
  };
})();

/* ------------------------------ src/ui/settings-view.js ------------------------------ */
// Settings: identity, storage, the documents this browser has seen, and what this
// environment can and cannot do (specs/07-ui.md §9, specs/08-environment.md).
//
// Everything here is about the SHELL rather than the trip, which is why none of it is a commit:
// changing your name does not change the document's content, so writing it into the history
// would put a line in the log that says nothing happened.

TP.ui.settingsView = (function () {
  'use strict';

  var R = null;
  function r() { R = R || TP.ui.render; return R; }

  function render(root) {
    // This view APPENDS, and it is called directly on the panel by two handlers below as well as
    // through `shell.renderActive` (which clears first). Without this the panel gains a second copy
    // of every card, drawn below the first.
    r().clear(root);
    r().append(root, tripCard());
    r().append(root, identityCard());
    // The AI connection card belongs to the AI subsystem, which owns whether it exists at all:
    // under `file://` this returns the explanatory callout instead (REQ-604, REQ-605).
    if (TP.ui.aiPanel && TP.ui.aiPanel.settingsCard) r().append(root, TP.ui.aiPanel.settingsCard());
    r().append(root, storageCard());
    r().append(root, compactionCard());
    r().append(root, documentsCard());
    r().append(root, environmentCard());
    r().append(root, migrationCard());
  }

  // ---- The document itself ----

  function tripCard() {
    var container = TP.store.container();
    var history = TP.store.history();
    var build = container.build || {};
    var chain = TP.verify.chain(history);

    return r().el('div', { class: 'card' }, [
      r().el('div', { class: 'card__head' }, [r().el('h2', { text: 'This document' })]),
      r().el('dl', { class: 'kv' }, [
        r().el('dt', { text: 'Identity' }),
        r().el('dd', { text: TP.store.docIdOf(container) || 'none yet — the first commit assigns one' }),
        r().el('dt', { text: 'Format' }),
        r().el('dd', { text: String(container.format || TP.container.FORMAT) + (TP.container.isReadableFormat(container.format) ? '' : ' — newer than this app reads') }),
        r().el('dt', { text: 'History' }),
        r().el('dd', { text: chain.ok ? TP.verify.label(chain) : 'does not hold together' }),
        r().el('dt', { text: 'Made with' }),
        r().el('dd', { text: (build.appVersion || 'unknown version') + (build.generatedAt ? ' on ' + TP.dates.fmtDate(String(build.generatedAt).slice(0, 10)) : '') }),
        r().el('dt', { text: 'App hash' }),
        r().el('dd', { text: build.appHash || 'not recorded' }),
      ]),
      TP.store.isReadOnly()
        ? r().el('div', { class: 'info info--warn mt', text: 'This document is open read-only. Nothing you do here is written to it, and nothing is written to this browser.' })
        : null,
    ]);
  }

  // ---- Who the commits are by ----

  function identityCard() {
    var settings = TP.store.readSettings();
    var author = settings.author || { name: '', email: '' };

    var name = r().el('input', { class: 'input', type: 'text', value: author.name || '', attrs: { placeholder: 'Your name' } });
    var email = r().el('input', { class: 'input', type: 'text', value: author.email || '', attrs: { placeholder: 'you@example.com' } });
    var saved = r().el('span', { class: 'subtle' });

    function save() {
      TP.store.writeSettings({ author: { name: name.value.trim() || 'You', email: email.value.trim() } });
      saved.textContent = 'Saved. Commits from now on carry this name.';
      TP.ui.toast.ok('Saved.');
    }
    name.addEventListener('change', save);
    email.addEventListener('change', save);

    return r().el('div', { class: 'card' }, [
      r().el('div', { class: 'card__head' }, [
        r().el('h2', { text: 'Commits are by' }),
        saved,
      ]),
      r().el('p', { class: 'subtle', text: 'This is written beside each commit you make. It stays in this browser and travels with the document when you export — a shared file shows who changed what.' }),
      r().el('div', { class: 'row' }, [
        r().el('div', { class: 'field' }, [r().el('label', { text: 'Name' }), name]),
        r().el('div', { class: 'field' }, [r().el('label', { text: 'Email (optional)' }), email]),
      ]),
    ]);
  }

  // ---- Where it is kept ----

  function storageCard() {
    var storage = TP.store.storage();
    var status = TP.store.saveStatus();
    var bytes = storage && storage.bytesUsed ? storage.bytesUsed() : 0;
    var docId = TP.store.docIdOf(TP.store.container());
    var docBytes = storage && docId && storage.available() ? TP.registry.bytesFor(storage, docId) : 0;

    return r().el('div', { class: 'card' }, [
      r().el('div', { class: 'card__head' }, [
        r().el('h2', { text: 'Where this document is kept' }),
        storage && storage.available()
          ? r().button('Clear local copies…', function () { clearLocal(); }, { class: 'btn btn--ghost btn--sm' })
          : null,
      ]),
      r().el('div', { class: storage && storage.available() ? 'info' : 'info info--warn', text:
        storage && storage.describe ? storage.describe() : 'Nothing can be saved locally, so every change lives only on screen until you export.' }),
      r().el('dl', { class: 'kv' }, [
        r().el('dt', { text: 'Kept in' }), r().el('dd', { text: kindLabel(storage) }),
        r().el('dt', { text: 'This document' }), r().el('dd', { text: TP.format.fmtNumber(docBytes) + ' bytes' }),
        r().el('dt', { text: 'Everything here' }), r().el('dd', { text: TP.format.fmtNumber(bytes) + ' bytes' }),
        r().el('dt', { text: 'Last autosave' }), r().el('dd', { text: status.lastSavedAt ? TP.ui.history.when(status.lastSavedAt) : 'nothing saved yet' }),
      ]),
      status.error
        ? r().el('div', { class: 'info info--danger mt', text: status.error })
        : null,
      r().el('p', { class: 'subtle mt mb0', text:
        'What is stored here is a copy of the document, kept so you can carry on after a reload. The file you export is the document; deleting this copy never changes that file. No amount of local storage trouble is ever resolved by discarding your work — when space runs out the app says so rather than throwing something away.' }),
    ]);
  }

  function kindLabel(storage) {
    if (!storage) return 'nowhere';
    if (storage.downgraded) return 'this tab only (the browser blocked lasting storage)';
    var kind = storage.kind ? storage.kind() : 'unknown';
    if (kind === 'localstorage') return 'this browser';
    if (kind === 'memory') return 'this tab only';
    return 'nowhere — read-only';
  }

  // ---- Compaction (REQ-318, REQ-319, PAT-INV-05) ----
  //
  // The quota message in the storage adapter tells the person to "compact its history in Settings", and
  // this is that action, in the card under the sentence that promised it.
  //
  // WHAT IT DOES. Every commit stores its content one of three ways: a full copy, a list of changes
  // against its parent, or nothing at all (it inherits). Compaction re-decides which, replaying the
  // history from the start, and leaves everything else alone: the ids, the parents, the authors, the
  // timestamps and the head are all untouched. That is possible only because the commit hash never
  // covers the storage representation (REQ-302) — if it did, rewriting the representation would rewrite
  // the history, and this card could not exist.
  //
  // WHAT IT DOES NOT DO. It does not delete history. Removing commits the head cannot reach is a
  // different act, it loses something, and it is offered separately — only when such commits exist,
  // named by id and message, behind its own confirmation. PAT-INV-05: no code path deletes commits
  // without explicit informed user confirmation.
  function compactionCard() {
    if (TP.store.isReadOnly()) return null;
    var commits = TP.store.commits() || [];
    // One commit has nothing to rewrite: the root is a keyframe and stays one. Offering an action that
    // cannot change anything would be a button that teaches the wrong thing about the app.
    if (commits.length < 2) return null;

    return r().el('div', { class: 'card' }, [
      r().el('div', { class: 'card__head' }, [
        r().el('h2', { text: 'History' }),
        r().el('span', { class: 'subtle', text: TP.format.plural(commits.length, 'commit') }),
        r().button('Compact…', function () { plan(); }, { class: 'btn btn--ghost btn--sm' }),
      ]),
      r().el('p', { class: 'subtle mb0', text:
        'Compacting rewrites how each commit is STORED — a full copy, a list of changes, or an inherited one — ' +
        'and changes nothing else. Every commit keeps its id and its place, so no part of your history is lost ' +
        'and every version stays openable. It is worth doing when this browser runs short of space.' }),
    ]);
  }

  // The dialog. The numbers come from the store, which gets them from the same function the action
  // itself will call, so what is promised here is what happens.
  function plan() {
    var dry = TP.store.planCompaction();
    var orphans = dry.unreachable || [];
    var worthwhile = dry.saved > 0;
    var dirty = TP.store.isDirty();

    var facts = r().el('dl', { class: 'kv' }, [
      r().el('dt', { text: 'Commits' }), r().el('dd', { text: String(TP.store.commits().length) + ' — all kept' }),
      r().el('dt', { text: 'Stored history now' }), r().el('dd', { text: TP.format.fmtNumber(dry.before) + ' bytes' }),
      r().el('dt', { text: 'After compacting' }), r().el('dd', { text: TP.format.fmtNumber(dry.after) + ' bytes' }),
      r().el('dt', { text: 'Saved' }), r().el('dd', { text: worthwhile ? TP.format.fmtNumber(dry.saved) + ' bytes' : 'nothing — it is already as small as this makes it' }),
      r().el('dt', { text: 'Full copies kept' }), r().el('dd', { text: dry.keyframesBefore + ' now, ' + dry.keyframesAfter + ' after' }),
    ]);

    // `body` is a LIST of nodes, which is what `modal.open` takes (`src/ui/modal.js` appends
    // `s.body` through `render.append`, which handles an array). So it is filled with `push` and
    // never with `r().append`: `append` calls `appendChild` on its parent, and an array has none —
    // which threw `parent.appendChild is not a function` from this function the moment there was a
    // dirty working copy or an unreachable commit to report, i.e. in both of the cases this dialog
    // exists for. It went unnoticed because a history with neither never reaches those lines.
    var body = [
      r().el('p', { text: 'Compaction replays this document’s history and re-decides how each commit is stored. ' +
        'The commits themselves are not touched: same ids, same order, same authors, same messages.' }),
      facts,
    ];

    if (dirty) {
      // The working copy holds edits that are not committed yet. Compaction does not touch them (the
      // store carries them across), but a person about to press a button about their history deserves
      // to know that the thing they can see and the thing being rewritten are not the same thing.
      body.push(r().el('div', { class: 'info info--warn' }, [
        r().el('div', { text: 'You have changes that are not committed yet. They are left exactly as they are — compaction only looks at what is already in the history.' }),
      ]));
    }

    if (orphans.length) {
      // The same question asked the other way, because the dialog is making two offers and a person
      // comparing them needs both numbers. `dry` is a plan that KEEPS the unreachable commits (what
      // the default action does), so on a history whose reachable part is already stored as compactly
      // as it goes, `saved` is 0 and the facts above say "nothing" — of a screen whose other button
      // offers to discard a thousand bytes. Both figures come from `TP.history.compact` through
      // `planCompaction`, so neither can drift from what pressing the button actually does.
      var without = TP.store.planCompaction({ removeOrphans: true });
      var extra = without.saved - dry.saved;
      var warning = [
        r().el('strong', { text: TP.format.plural(orphans.length, 'commit') + ' this document can no longer reach.' }),
        r().el('div', { text: 'These were left behind by a merge or a revert. Nothing points at them, so nothing here shows them — but they are still in the file, and they are still readable if anything ever changes its mind. Compacting KEEPS them unless you say otherwise.' }),
      ];
      if (extra > 0) {
        warning.push(r().el('div', { text: 'Discarding them as well would save a further ' + TP.format.fmtNumber(extra) + ' bytes.' }));
      }
      body.push(r().el('div', { class: 'info info--warn' }, warning));
      var list = r().el('ul', { class: 'sublist' });
      orphans.slice(0, 8).forEach(function (id) {
        var c = commitById(id);
        r().append(list, r().el('li', { text: TP.verify.shortId(id) + ' · ' + TP.ui.history.when(c && c.timestamp) + ' · ' + ((c && c.message) || 'no message') }));
      });
      if (orphans.length > 8) r().append(list, r().el('li', { class: 'subtle', text: 'and ' + (orphans.length - 8) + ' more' }));
      body.push(list);
    }

    var actions = [{ id: 'cancel', label: 'Leave it alone' }];
    if (worthwhile) {
      actions.push({ id: 'compact', label: 'Compact', run: function (settle) { apply(false, settle, dry); } });
    }
    if (orphans.length) {
      actions.push({
        id: 'compact-drop', label: worthwhile ? 'Compact and discard ' + TP.format.plural(orphans.length, 'unreachable commit') : 'Discard ' + TP.format.plural(orphans.length, 'unreachable commit'),
        danger: true,
        run: function (settle) { confirmDiscard(settle, orphans, dry); },
      });
    }

    if (!worthwhile && !orphans.length) {
      // Nothing to offer. Saying so is better than a disabled button with no explanation.
      body.push(r().el('p', { class: 'subtle mb0', text: 'There is nothing to gain right now: this history is already stored as compactly as this app knows how.' }));
    }

    return TP.ui.modal.open({
      title: 'Compact this history?',
      body: body,
      defaultAction: 'cancel',
      actions: actions,
    });
  }

  function commitById(id) {
    var list = TP.store.commits() || [];
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  // Discarding unreachable commits is the one destructive option, so it gets the second question — the
  // same two-step `clearLocal` uses for deleting a local copy. A danger action that fires on one click
  // is a danger action that will fire by accident.
  function confirmDiscard(settle, orphans, dry) {
    TP.ui.modal.confirm({
      title: 'Discard them for good?',
      body: r().el('div', {}, [
        r().el('p', { text: 'This removes ' + TP.format.plural(orphans.length, 'commit') + ' from this document. ' +
          'Nothing can reach them, so nothing will look different — and that is exactly why this is worth reading twice.' }),
        r().el('p', { text: 'They are not recoverable from this app afterwards. If any of them is work you might want back, ' +
          'export the document first: the file carries the whole history, reachable or not.' }),
        r().el('p', { class: 'subtle', text: 'The other ' + TP.format.plural((TP.store.commits().length - orphans.length), 'commit') + ' — everything this document actually shows — are kept.' + (dry.saved > 0 ? ' Compacting also saves ' + TP.format.fmtNumber(dry.saved) + ' bytes by itself.' : '') }),
      ]),
      confirmLabel: 'Discard them',
      danger: true,
    }).then(function (yes) {
      // No settle on "no", matching `confirmDelete` above: opening this dialog already closed the one
      // underneath it, so there is nothing left to settle — and asking again should be a fresh question,
      // not a resumed one.
      if (!yes) return;
      apply(true, settle, dry);
    });
  }

  function apply(removeOrphans, settle, dry) {
    var result = TP.store.compactHistory({ removeOrphans: removeOrphans });
    if (!result.ok) {
      TP.ui.toast.error(result.reason);
      settle(null);
      return;
    }
    TP.store.save({ silent: true });
    var report = result.report;
    var bits = ['History compacted — ' + TP.format.plural((TP.store.commits() || []).length, 'commit') + ' kept.'];
    if (report.saved > 0) bits.push(TP.format.fmtNumber(report.saved) + ' bytes saved.');
    else bits.push('It was already as small as this makes it.');
    if (removeOrphans) bits.push(TP.format.plural(report.removedOrphans, 'unreachable commit') + ' discarded.');
    else if (report.keptOrphans) bits.push(TP.format.plural(report.keptOrphans, 'unreachable commit') + ' kept.');
    TP.ui.toast.ok(bits.join(' '));
    settle(null);
    TP.ui.shell.renderActive();
  }

  function clearLocal() {
    var storage = TP.store.storage();
    var docId = TP.store.docIdOf(TP.store.container());
    if (!storage || !docId) return null;
    var bytes = TP.registry.bytesFor(storage, docId);
    var otherDocs = TP.registry.load(storage).docs.length - 1;

    return TP.ui.modal.open({
      title: 'Delete the local copies?',
      body: [
        r().el('div', { class: 'info info--danger' }, [
          r().el('strong', { text: 'This deletes work, and it cannot be undone.' }),
          r().el('div', { text: 'The copy of this document kept in this browser is removed — ' +
            TP.format.fmtNumber(bytes) + ' bytes' + (otherDocs > 0 ? ', and the ' + TP.format.plural(otherDocs, 'other document') + ' listed here are untouched' : '') + '.' }),
        ]),
        r().el('p', { text: 'The file you exported is not affected. If you have not exported since your last change, that change exists only here and will be gone.' }),
        r().el('p', { class: 'subtle', text: 'If you would rather keep it, export first — then this removes only the spare copy.' }),
      ],
      defaultAction: 'cancel',
      actions: [
        { id: 'cancel', label: 'Keep it' },
        { id: 'export-first', label: 'Export first' },
        { id: 'delete', label: 'Delete the copy', danger: true, run: function (settle) {
          confirmDelete(settle, storage, docId);
        } },
      ],
    });
  }

  function confirmDelete(settle, storage, docId) {
    TP.ui.modal.confirm({
      title: 'Last check',
      body: r().el('div', {}, [
        r().el('p', { text: 'Delete this browser’s copy of “' + TP.model.tripTitle(TP.store.trip()) + '”?' }),
        r().el('p', { class: 'subtle', text: 'Its commits are removed from this browser. The document on disk is not touched.' }),
      ]),
      confirmLabel: 'Delete it',
      danger: true,
    }).then(function (yes) {
      if (!yes) return;
      TP.registry.forget(storage, docId);
      TP.registry.removeEntry(storage, docId);
      TP.ui.tripList.render();
      TP.ui.shell.renderSidebarFoot();
      TP.ui.toast.info('The local copy is gone. Open the file to work on this document again.');
      settle(null);
      TP.ui.shell.renderActive();
    });
  }

  // ---- The documents this browser has seen ----

  function documentsCard() {
    var storage = TP.store.storage();
    var rows = storage && storage.available() ? TP.registry.load(storage).docs : [];
    var currentDoc = TP.store.docIdOf(TP.store.container());

    var card = r().el('div', { class: 'card' }, [
      r().el('div', { class: 'card__head' }, [
        r().el('h2', { text: 'Documents this browser has seen' }),
        r().el('span', { class: 'subtle', text: rows.length ? TP.format.plural(rows.length, 'document') : 'none yet' }),
      ]),
      r().el('p', { class: 'subtle', text: 'This list is a convenience, not a library. It is rebuilt from the files you open, and clearing it never deletes a document — the file you hold is the document.' }),
    ]);

    if (!rows.length) {
      r().append(card, r().el('p', { class: 'subtle mb0', text: 'No documents have been opened here yet. Use Import to open one.' }));
      return card;
    }

    rows.slice().sort(function (a, b) { return String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')); })
      .forEach(function (doc) {
        var bytes = TP.registry.bytesFor(storage, doc.docId);
        var held = TP.registry.hasLocal(storage, doc.docId);
        r().append(card, r().el('div', { class: 'cl-item' }, [
          r().el('div', { class: 'flex-1' }, [
            r().el('div', {}, [
              r().el('strong', { text: doc.title || 'Untitled trip' }),
              doc.docId === currentDoc ? r().el('span', { class: 'badge badge--done', text: 'open' }) : null,
              held ? null : r().el('span', { class: 'badge badge--optional', text: 'no copy here' }),
            ]),
            r().el('div', { class: 'subtle', text: (doc.updatedAt ? 'last opened ' + TP.ui.history.when(doc.updatedAt) : 'not opened since') + ' · ' + (held ? TP.format.fmtNumber(bytes) + ' bytes' : 'nothing stored in this browser') }),
          ]),
          r().el('span', { class: 'flex gap' }, [
            doc.docId === currentDoc ? null : r().button('Open', function () { TP.ui.tripList.openLocal(doc.docId); }, { class: 'btn btn--ghost btn--sm' }),
            r().button('Forget this entry', function () { forgetEntry(doc); }, { class: 'btn btn--ghost btn--sm' }),
          ]),
        ]));
      });

    return card;
  }

  function forgetEntry(doc) {
    return TP.ui.modal.open({
      title: 'Forget this document?',
      body: [
        r().el('p', { text: '“' + (doc.title || 'Untitled trip') + '” is removed from this list, along with the copy of it kept in this browser.' }),
        r().el('p', { class: 'subtle', text: 'The document itself is the file you have. It is not deleted, and you can open it again at any time.' }),
      ],
      defaultAction: 'forget',
      actions: [{ id: 'cancel', label: 'Cancel' }, { id: 'forget', label: 'Forget it', danger: true }],
    }).then(function (id) {
      if (id !== 'forget') return null;
      var storage = TP.store.storage();
      var isCurrent = doc.docId === TP.store.docIdOf(TP.store.container());
      TP.registry.forget(storage, doc.docId);
      TP.registry.removeEntry(storage, doc.docId);
      TP.ui.tripList.render();
      TP.ui.toast.info('Forgotten. The file is untouched.');
      if (isCurrent) TP.ui.shell.renderActive();
      else render(TP.ui.render.byId('panel-settings'));
      return id;
    });
  }

  // ---- What this environment can do ----

  function environmentCard() {
    var env = TP.environment;
    var rows = [
      ['Your itinerary, budget, bookings and checklists', true, ''],
      ['Import from a file', true, ''],
      ['Export a document you can open anywhere', true, ''],
      ['History, revert, and reopening from this browser', true, env.isFile ? 'the browser may decline to keep copies for a file on disk' : ''],
      ['Save back over the file you opened', env.canSaveInPlace, env.canSaveInPlace ? '' : 'the browser offers no in-place save here'],
      ['Keeping a list of the documents you have opened', env.isFile ? false : true, env.isFile ? 'some browsers keep no lasting storage for a file on disk' : ''],
      ['Reaching an AI service', env.aiEnabled, env.aiEnabled ? '' : 'a file on disk has no web identity, so it cannot be given a key safely'],
    ];

    return r().el('div', { class: 'card' }, [
      r().el('div', { class: 'card__head' }, [
        r().el('h2', { text: 'What works here' }),
        r().el('span', { class: 'badge badge--optional', text: env.isFile ? 'opened from a file' : 'opened from a web address' }),
      ]),
      r().el('table', { class: 'data compact' }, [
        r().el('tbody', {}, rows.map(function (row) {
          return r().el('tr', {}, [
            r().el('td', { text: row[0] }),
            r().el('td', { text: row[1] ? 'yes' : 'no' }),
            r().el('td', { class: 'subtle', text: row[2] || '' }),
          ]);
        })),
      ]),
      r().el('p', { class: 'subtle mb0', text: 'The only thing an address changes is the AI tab. Everything else about the planner is the same in both places, which is the point of a document that is also the program.' }),
    ]);
  }

  // ---- Older trips ----

  function migrationCard() {
    var env = TP.environment;
    if (env.isFile) {
      return r().el('div', { class: 'card' }, [
        r().el('div', { class: 'card__head' }, [r().el('h2', { text: 'Trips from the earlier version' })]),
        r().el('p', { class: 'subtle mb0', text: 'The earlier version of this planner kept trips in a browser database. Browsers do not give a file opened from disk access to that database, so the import cannot be offered here. Open this same planner from a web address and it appears.' }),
      ]);
    }
    if (!TP.registry.idbAvailable()) return null;

    var result = r().el('div', { class: 'mt' });

    return r().el('div', { class: 'card' }, [
      r().el('div', { class: 'card__head' }, [r().el('h2', { text: 'Trips from the earlier version' })]),
      r().el('p', { class: 'subtle', text: 'If you used the earlier version of this planner in this browser, its trips can be brought forward. Each becomes its own document with its own history, and the older data is left exactly where it is.' }),
      r().el('div', { class: 'mt' }, [
        r().button('Look for older trips', function () {
          result.textContent = 'Looking…';
          Promise.resolve(TP.registry.migrateFromIndexedDB(TP.store.storage())).then(function (res) {
            R.mount(result, [r().el('div', { class: res.ok ? 'info' : 'info info--warn', text: res.message || 'Nothing was changed.' })]);
            if (res.ok && res.imported) {
              TP.ui.tripList.render();
              render(TP.ui.render.byId('panel-settings'));
            }
          });
        }, { class: 'btn' }),
      ]),
      result,
    ]);
  }

  return {
    render: render,
    identityCard: identityCard,
    storageCard: storageCard,
    documentsCard: documentsCard,
    environmentCard: environmentCard,
    migrationCard: migrationCard,
    forgetEntry: forgetEntry,
    clearLocal: clearLocal,
  };
})();

/* ------------------------------ src/ui/ai-panel.js ------------------------------ */
// The AI Planner tab, and the connection card it owns in Settings
// (specs/07-ui.md §3, §4.2, §4.3).
//
// Three guards stand between a `file://` open and a network request, and this file carries two of
// them: the tab is hidden by the shell's tab filter, this panel would render an explanation if it
// were somehow reached anyway, and `TP.ai.transport` refuses below both (REQ-708). The repetition
// is the point — each one covers a way the others can be bypassed.

TP.ui = TP.ui || {};

TP.ui.aiPanel = (function () {
  'use strict';

  var R = null;
  function r() { R = R || TP.ui.render; return R; }

  var transcripts = Object.create(null);   // docId -> [{role, content, kind}]
  var running = false;

  // ---- The panel ----

  function render(root) {
    if (!TP.ai.transport.available()) {
      r().append(root, unavailableCard());
      return;
    }
    var docId = TP.store.docIdOf(TP.store.container()) || 'unsaved';
    seed(docId);

    var cfg = TP.ai.transport.config();
    var busy = running;

    var planBtn = r().button(busy ? 'Planning…' : 'Plan this trip', function () { start(null); },
      { class: 'btn btn--primary', disabled: busy });
    var sendBtn = r().button('Send', function () { send(); }, { class: 'btn btn--primary', disabled: busy });
    var input = r().el('textarea', {
      class: 'input',
      attrs: { placeholder: 'Ask the agent to plan, adjust, or research something…', rows: '2' },
      disabled: busy,
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); sendBtn.click(); }
    });

    function send() {
      var text = String(input.value || '').trim();
      if (!text || running) return;
      input.value = '';
      start(text);
    }

    var host = r().el('div', { class: 'ai__transcript', id: 'ai-transcript' });

    r().append(root, r().el('div', { class: 'ai' }, [
      r().el('div', { class: 'ai__head' }, [
        planBtn,
        r().button('View itinerary', function () { TP.ui.shell.setTab('itinerary'); }, { class: 'btn' }),
        r().el('span', { class: 'subtle ml-auto', text: TP.ai.transport.modeLabel(cfg) }),
      ]),
      r().el('div', { class: 'ai__note' }, [
        r().el('span', { class: 'subtle', text: 'Everything the agent writes lands in your trip, and the whole run becomes one commit you can undo or revert.' }),
      ]),
      host,
      r().el('div', { class: 'ai__composer' }, [input, sendBtn]),
    ]));

    renderTranscript(host, docId);
  }

  // Defence in depth (§4.3): if a stale tab state or a future bug reaches this panel, it explains
  // rather than offering a composer that cannot work.
  function unavailableCard() {
    return r().el('div', { class: 'card' }, [
      r().el('div', { class: 'card__head' }, [r().el('h2', { text: 'AI planning' })]),
      callout(),
    ]);
  }

  // REQ-605, verbatim. The three things this copy does on purpose: it names the browser behaviour,
  // it gives the security reason, and it says what is NOT lost — the third is what stops a user
  // concluding the app is a broken version of the one they read about.
  function callout() {
    return r().el('div', { class: 'info info--warn' }, [
      r().el('strong', { text: 'AI planning needs a web address.' }),
      r().el('div', { text: 'This planner is running from a file on your disk, where the browser gives it no web identity — so it cannot reach an AI service, and it will not store a service key somewhere any other local file could read it.' }),
      r().el('div', { text: 'Open the same planner from http(s):// instead and the AI tab appears. Everything else — your itinerary, budget, bookings, checklists, history, import and export — works exactly as it does here, from the file on your disk.' }),
    ]);
  }

  // ---- The transcript ----

  function seed(docId) {
    if (transcripts[docId]) return;
    transcripts[docId] = [];
    var convos = TP.ai.agent.conversationsFor(docId);
    if (!convos.length) return;
    var last = convos[convos.length - 1];
    transcripts[docId] = (last.messages || [])
      .filter(function (m) { return m.role === 'user' || m.role === 'assistant' || m.role === 'system'; })
      .map(function (m) { return { role: m.role, content: m.content, kind: m.role === 'system' ? 'system' : undefined }; });
  }

  function transcriptOf(docId) {
    if (!transcripts[docId]) transcripts[docId] = [];
    return transcripts[docId];
  }

  function push(docId, entry) {
    transcriptOf(docId).push(entry);
    var host = r().byId('ai-transcript');
    if (host) renderTranscript(host, docId);
  }

  function renderTranscript(host, docId) {
    if (!host) return;
    var rows = transcriptOf(docId);
    if (!rows.length) {
      r().mount(host, [r().el('div', { class: 'empty' }, [
        r().el('p', { text: 'Ask the agent to plan this trip, or press “Plan this trip”. It researches with web search where that is available in the current mode, then writes items straight into your itinerary.' }),
      ])]);
      return;
    }
    r().mount(host, rows.map(messageNode));
    host.scrollTop = host.scrollHeight;
  }

  function messageNode(m) {
    if (m.kind === 'tool' || m.role === 'tool') {
      return r().el('div', { class: 'toolline', text: m.content });
    }
    if (m.kind === 'system' || m.role === 'system') {
      return r().el('div', { class: 'toolline toolline--note', text: m.content });
    }
    if (m.role === 'user') {
      return r().el('div', { class: 'msg msg--user' }, [
        r().el('div', { class: 'msg__role', text: 'You' }),
        r().el('div', { class: 'bubble', text: m.content }),
      ]);
    }
    // Assistant text is markdown, and it becomes NODES — never a string that turns into markup.
    return r().el('div', { class: 'msg msg--assistant' }, [
      r().el('div', { class: 'msg__role', text: 'Agent' }),
      r().el('div', { class: 'bubble' }, [r().markdown(m.content || '')]),
    ]);
  }

  // ---- Running ----

  function start(instruction) {
    if (running) return null;
    var cfg = TP.ai.transport.config();
    var docId = TP.store.docIdOf(TP.store.container()) || 'unsaved';

    if (!cfg.mock && cfg.isCloud && !cfg.apiKey) {
      TP.ui.toast.warn('Add an Ollama Cloud API key in Settings first.');
      TP.ui.shell.setTab('settings');
      return null;
    }

    running = true;
    var text = instruction || 'Plan this trip: research with web search where it helps, then write a day-by-day itinerary into the app.';
    push(docId, { role: 'user', content: text });
    TP.ui.shell.renderActive();

    // WebGPU downloads the model on first use, which takes minutes. Streaming progress into the
    // transcript is the difference between "slow" and "hung".
    var warm = (cfg.isWebGPU && !cfg.mock)
      ? warmUp(docId)
      : Promise.resolve();

    return warm.then(function (ready) {
      if (ready === false) return null;
      return TP.ai.agent.runAgent(text, {
        onMessage: function (m) {
          if (!m.content) return;
          push(docId, { role: m.role, content: m.content, kind: m.role === 'system' ? 'system' : undefined });
        },
        onTool: function (t) { push(docId, { role: 'tool', kind: 'tool', content: t.label }); },
        onCitations: function (urls) {
          push(docId, { role: 'tool', kind: 'tool', content: 'Sources: ' + urls.slice(0, 8).join('  ') });
        },
        onError: function (err) {
          TP.ui.toast.error(TP.ai.transport.describeError(err));
          push(docId, { role: 'tool', kind: 'tool', content: 'Stopped: ' + TP.ai.transport.describeError(err) });
        },
        onDone: function (summary) {
          if (summary.changed) {
            TP.ui.toast.ok('Done. The trip has the agent’s changes, in one commit you can undo.');
            TP.ui.shell.renderAll();
            TP.ui.shell.setTab('itinerary');
          } else {
            TP.ui.toast.info('The agent finished without changing the trip.');
          }
        },
      });
    }).then(function (result) {
      running = false;
      TP.ui.shell.renderActive();
      void warm;
      return result;
    }, function (e) {
      running = false;
      TP.ui.toast.error('The agent stopped unexpectedly: ' + ((e && e.message) || e));
      TP.ui.shell.renderActive();
      return null;
    });
  }

  function warmUp(docId) {
    if (TP.ai.webgpu.isReady()) return Promise.resolve(true);
    push(docId, { role: 'tool', kind: 'tool', content: 'Downloading the model (one time)…' });
    var last = null;
    return TP.ai.webgpu.warmUp({
      onProgress: function (p) {
        var pct = (p && typeof p.progress === 'number') ? Math.round(p.progress * 100) + '%' : '';
        // Progress arrives many times a second; only announce it when the number moves.
        if (pct === last) return;
        last = pct;
        push(docId, { role: 'tool', kind: 'tool', content: ('Loading the model… ' + (pct || (p && p.text) || '')).trim() });
      },
    }).then(function (res) {
      if (res.ok) {
        push(docId, { role: 'tool', kind: 'tool', content: 'Model ready.' });
        return true;
      }
      TP.ui.toast.error(TP.ai.transport.describeError(res.error));
      push(docId, { role: 'tool', kind: 'tool', content: 'Stopped: ' + TP.ai.transport.describeError(res.error) });
      return false;
    });
  }

  // ---- The Settings card ----

  // REQ-604: under `file://` the connection card, Test connection and the CORS proxy are all
  // absent, and the explanatory callout stands in their place. Rendering one INSTEAD of the other
  // is the same guarantee the display toggle gave, with one less piece of state to get wrong.
  function settingsCard() {
    if (!TP.ai.transport.available()) {
      return r().el('div', { class: 'card', id: 'ai-connection' }, [
        r().el('div', { class: 'card__head' }, [r().el('h2', { text: 'AI planning' })]),
        callout(),
      ]);
    }
    return connectionCard();
  }

  function connectionCard() {
    var s = TP.ai.transport.storedSettings();
    var DEFAULTS = TP.ai.transport.DEFAULTS;
    var MODELS = TP.ai.transport.WEBGPU_MODELS;

    var mode = r().el('select', { class: 'input', id: 'set-mode' }, [
      r().el('option', { value: 'webgpu', text: 'In this browser (WebGPU — no key, no chat leaves the machine)' }),
      r().el('option', { value: 'cloud', text: 'Ollama Cloud (API key, web search available)' }),
      r().el('option', { value: 'local', text: 'Local Ollama (no key, no web search)' }),
    ]);
    mode.value = s.mode;

    var webgpuModel = r().el('select', { class: 'input', id: 'set-webgpu-model' },
      MODELS.map(function (m) {
        return r().el('option', { value: m.id, text: m.label + ' — ' + m.size + ' · tools: ' + m.tools });
      }));
    webgpuModel.value = (s.webgpu && s.webgpu.model) || DEFAULTS.webgpu.model;

    var cloudBase = r().el('input', { class: 'input', type: 'text', value: s.cloud.baseUrl });
    var apiKey = r().el('input', { class: 'input', type: 'password', value: s.cloud.apiKey, attrs: { autocomplete: 'off', placeholder: 'ollama.com API key' } });
    var keyToggle = r().button('Show', function () {
      var shown = apiKey.type === 'text';
      apiKey.type = shown ? 'password' : 'text';
      keyToggle.textContent = shown ? 'Show' : 'Hide';
    }, { class: 'btn btn--sm' });
    var keyClear = r().button('Clear', function () { apiKey.value = ''; }, { class: 'btn btn--sm btn--danger' });

    var localBase = r().el('input', { class: 'input', type: 'text', value: s.local.baseUrl });
    var proxy = r().el('input', { class: 'input', type: 'text', value: s.proxyUrl, attrs: { placeholder: 'http://localhost:8080/' } });
    var model = r().el('input', { class: 'input', type: 'text', value: s.model });
    var numCtx = r().el('input', { class: 'input', type: 'number', value: String(s.numCtx), attrs: { min: '4096', step: '1024' } });
    var maxIter = r().el('input', { class: 'input', type: 'number', value: String(s.maxIterations), attrs: { min: '1', max: '40' } });
    var mock = r().el('input', { type: 'checkbox', checked: !!s.mock });

    var webgpuBlock = r().el('div', {}, [
      r().el('div', { class: 'field' }, [r().el('label', { text: 'WebGPU model' }), webgpuModel]),
      r().el('p', { class: 'subtle', text: 'Downloads from the model CDN on first use, one time, and is cached after. Needs WebGPU: Chrome/Edge 113+, Safari 17+, or Firefox with dom.computepainter.enabled. Hermes-3 3B has by far the best tool-calling for the agent loop; the smallest models can only plan from what they already know.' }),
    ]);

    var cloudBlock = r().el('div', {}, [
      r().el('div', { class: 'field' }, [r().el('label', { text: 'Cloud base URL' }), cloudBase]),
      r().el('div', { class: 'field' }, [
        r().el('label', { text: 'API key' }),
        r().el('div', { class: 'flex gap' }, [apiKey, keyToggle, keyClear]),
        r().el('p', { class: 'subtle mb0', text: 'Create a key at ollama.com/settings/keys. It is kept in this browser only, and it is never written into a document — a key inside a file you might send someone would be a key given away. Note that a key stored here is readable by anything else served from this address.' }),
      ]),
    ]);

    var localBlock = r().el('div', {}, [
      r().el('div', { class: 'field' }, [r().el('label', { text: 'Local base URL' }), localBase]),
      r().el('div', { class: 'info', text: 'Browsers block this by default. Start Ollama with OLLAMA_ORIGINS=* OLLAMA_HOST=0.0.0.0 ollama serve to allow it. Local Ollama has no web-search endpoint, so the agent plans from its own knowledge.' }),
    ]);

    function reflectMode() {
      r().show(webgpuBlock, mode.value === 'webgpu');
      r().show(cloudBlock, mode.value === 'cloud');
      r().show(localBlock, mode.value === 'local');
    }
    mode.addEventListener('change', reflectMode);
    reflectMode();

    var testBtn = r().button('Test connection', function () { test(testBtn); }, { class: 'btn' });

    function collect() {
      return {
        mode: mode.value,
        webgpu: { model: webgpuModel.value || DEFAULTS.webgpu.model },
        cloud: { apiKey: String(apiKey.value || '').trim(), baseUrl: String(cloudBase.value || '').trim() || DEFAULTS.cloud.baseUrl },
        local: { baseUrl: String(localBase.value || '').trim() || DEFAULTS.local.baseUrl },
        proxyUrl: String(proxy.value || '').trim(),
        model: String(model.value || '').trim() || DEFAULTS.model,
        numCtx: clampInt(numCtx.value, 4096, 200000, DEFAULTS.numCtx),
        maxIterations: clampInt(maxIter.value, 1, 40, DEFAULTS.maxIterations),
        mock: !!mock.checked,
      };
    }

    return r().el('div', { class: 'card', id: 'ai-connection' }, [
      r().el('div', { class: 'card__head' }, [
        r().el('h2', { text: 'AI planning' }),
        r().el('span', { class: 'subtle', text: TP.ai.transport.modeLabel() }),
      ]),
      r().el('div', { class: 'field' }, [r().el('label', { text: 'Mode' }), mode]),
      webgpuBlock,
      cloudBlock,
      localBlock,
      r().el('div', { class: 'field' }, [
        r().el('label', {}, [r().el('span', { text: 'CORS proxy URL ' }), r().el('span', { class: 'subtle', text: '(optional)' })]),
        proxy,
        r().el('p', { class: 'subtle mb0', text: 'If cloud or local calls are blocked by the browser, prefix every request with this address — a local cors-anywhere, or your own relay. The declared policy admits the shipped endpoints only, so a custom address here may be blocked by it.' }),
      ]),
      r().el('div', { class: 'row' }, [
        r().el('div', { class: 'field' }, [r().el('label', { text: 'Model' }), model]),
        r().el('div', { class: 'field' }, [r().el('label', { text: 'Context window' }), numCtx]),
        r().el('div', { class: 'field' }, [r().el('label', { text: 'Most agent turns' }), maxIter]),
      ]),
      r().el('label', { class: 'flex gap' }, [
        mock,
        r().el('span', { text: 'Mock transport — scripted answers, no network and no spend' }),
      ]),
      r().el('hr'),
      r().el('div', { class: 'flex gap' }, [
        r().button('Save settings', function () {
          TP.ai.transport.saveSettings(collect());
          TP.ui.toast.ok('Saved. These live in this browser only.');
          TP.ui.shell.renderActive();
        }, { class: 'btn btn--primary' }),
        testBtn,
        r().button('Reset to defaults', function () {
          TP.ui.modal.confirm({
            title: 'Reset the AI settings?',
            body: r().el('p', { text: 'Mode, endpoints, key and model go back to their defaults. Your trips are not affected.' }),
            confirmLabel: 'Reset them',
          }).then(function (yes) {
            if (!yes) return;
            TP.ai.transport.resetSettings();
            TP.ui.toast.info('Settings reset.');
            TP.ui.shell.renderActive();
          });
        }, { class: 'btn btn--danger' }),
      ]),
      r().el('p', { class: 'subtle mt mb0', text: 'A service key is stored in this browser and never in a document. Conversations with the agent are kept locally too, and never travel inside the file.' }),
    ]);
  }

  function test(btn) {
    btn.disabled = true;
    btn.textContent = 'Testing…';
    TP.ai.transport.testConnection().then(function (res) {
      btn.disabled = false;
      btn.textContent = 'Test connection';
      if (res.ok) TP.ui.toast.ok('Answered by ' + TP.ai.transport.modeLabel() + '.');
      else TP.ui.modal.notice({
        title: 'The connection test failed',
        body: r().el('div', { class: 'info info--danger', text: TP.ai.transport.describeError(res.error) }),
      });
    }, function (e) {
      btn.disabled = false;
      btn.textContent = 'Test connection';
      TP.ui.toast.error('The test failed: ' + ((e && e.message) || e));
    });
  }

  function clampInt(v, min, max, fallback) {
    var n = parseInt(v, 10);
    if (isNaN(n)) return fallback;
    return Math.min(max, Math.max(min, n));
  }

  return {
    render: render,
    settingsCard: settingsCard,
    callout: callout,
    unavailableCard: unavailableCard,
    isRunning: function () { return running; },
  };
})();

/* ------------------------------ src/ui/toast.js ------------------------------ */
// Toasts: the app's one channel for "something happened" (specs/07-ui.md §8).

TP.ui.toast = (function () {
  'use strict';

  var DEFAULTS = { ok: 3200, info: 4200, warn: 6000, error: 9000 };

  function host() {
    return TP.ui.render.byId('toasts');
  }

  function show(message, kind, options) {
    var hostEl = host();
    if (!hostEl) return null;
    var opts = options || {};
    var text = message == null ? '' : String(message);
    var node = TP.ui.render.el('div', {
      class: ['toast', kind && kind !== 'info' ? 'toast--' + kind : ''],
      attrs: { role: kind === 'error' ? 'alert' : 'status' },
      text: text,
    });
    if (opts.action && opts.action.label && typeof opts.action.run === 'function') {
      node.appendChild(TP.ui.render.el('div', { class: 'toast__action mt' }, [
        TP.ui.render.button(opts.action.label, function () {
          dismiss(node);
          opts.action.run();
        }, { class: 'btn btn--sm' }),
      ]));
    }
    hostEl.appendChild(node);
    var ms = opts.ms != null ? opts.ms : (DEFAULTS[kind] || DEFAULTS.info);
    if (ms > 0) setTimeout(function () { dismiss(node); }, ms);
    return node;
  }

  function dismiss(node) {
    if (node && node.parentNode) node.parentNode.removeChild(node);
  }

  function clear() {
    var hostEl = host();
    if (hostEl) TP.ui.render.clear(hostEl);
  }

  return {
    show: show,
    ok: function (m, o) { return show(m, 'ok', o); },
    info: function (m, o) { return show(m, 'info', o); },
    warn: function (m, o) { return show(m, 'warn', o); },
    error: function (m, o) { return show(m, 'error', o); },
    dismiss: dismiss,
    clear: clear,
  };
})();

/* ------------------------------ src/ui/modal.js ------------------------------ */
// Modals: the app's one channel for "decide something" (specs/07-ui.md §8).
//
// Every modal returns a promise for the id of the action chosen, or null if it was dismissed.
// A caller therefore cannot forget to handle "the user closed it" — there is no path where a
// destructive act proceeds because a dialog vanished.

TP.ui.modal = (function () {
  'use strict';

  var current = null;

  function host() { return TP.ui.render.byId('modal-host'); }

  function open(spec) {
    var s = spec || {};
    var hostEl = host();
    if (!hostEl) return Promise.resolve(null);

    close(null);

    return new Promise(function (resolve) {
      var settled = false;

      function settle(id) {
        if (settled) return;
        settled = true;
        close(id);
        resolve(id);
      }

      var body = TP.ui.render.el('div', { class: 'modal__body' });
      TP.ui.render.append(body, s.body);

      var actions = TP.ui.render.el('div', { class: 'modal__actions' });
      (s.actions || [{ id: 'close', label: 'Close' }]).forEach(function (a) {
        // An action may supply `run(settle)` when it needs to validate before the dialog
        // closes. Returning without calling settle keeps the dialog open.
        var handler = a.run
          ? function () { a.run(settle); }
          : function () { settle(a.id); };
        actions.appendChild(TP.ui.render.button(a.label, handler, {
          class: a.danger ? 'btn btn--danger' : (a.id === (s.defaultAction || '') ? 'btn btn--primary' : 'btn'),
        }));
      });

      var box = TP.ui.render.el('div', {
        class: 'modal',
        attrs: { role: 'dialog', 'aria-modal': 'true', 'aria-label': s.title || 'Dialog' },
      }, [
        s.title ? TP.ui.render.el('h3', { text: s.title }) : null,
        body,
        actions,
      ]);

      var onKey = function (e) {
        if (e.key === 'Escape' && s.dismissible !== false) { settle(null); }
      };
      var onBackdrop = function (e) {
        if (e.target === hostEl && s.dismissible !== false) settle(null);
      };

      TP.ui.render.mount(hostEl, box);
      hostEl.removeAttribute('hidden');
      hostEl.addEventListener('click', onBackdrop);
      document.addEventListener('keydown', onKey);

      current = {
        settle: settle,
        cleanup: function () {
          document.removeEventListener('keydown', onKey);
          hostEl.removeEventListener('click', onBackdrop);
        },
      };

      var focusable = box.querySelector('button, input, select, textarea, a[href]');
      if (focusable) focusable.focus();
    });
  }

  function close() {
    var hostEl = host();
    if (current && current.cleanup) current.cleanup();
    current = null;
    if (hostEl) {
      TP.ui.render.clear(hostEl);
      hostEl.setAttribute('hidden', '');
    }
  }

  // A confirmation. The default action is deliberately the safe one, and `danger` styles the
  // affirmative button so a destructive click is never the visually quiet one.
  function confirm(spec) {
    var s = spec || {};
    return open({
      title: s.title || 'Are you sure?',
      body: s.body,
      defaultAction: 'cancel',
      dismissible: s.dismissible !== false,
      actions: [
        { id: 'cancel', label: s.cancelLabel || 'Cancel' },
        { id: 'confirm', label: s.confirmLabel || 'Confirm', danger: !!s.danger },
      ],
    }).then(function (id) { return id === 'confirm'; });
  }

  // Information with one way out. Used for disclosures the user must actually read — the
  // lossiness ledger, an integrity failure, a read-only explanation.
  function notice(spec) {
    var s = spec || {};
    return open({
      title: s.title || 'Notice',
      body: s.body,
      defaultAction: 'ok',
      dismissible: s.dismissible !== false,
      actions: [{ id: 'ok', label: s.okLabel || 'OK' }],
    });
  }

  // A prompt for one string. Returns null when dismissed, so "empty" and "cancelled" stay
  // distinguishable — a blank commit message is not the same as not committing.
  function prompt(spec) {
    var s = spec || {};
    var input = TP.ui.render.el('input', {
      class: 'input', type: 'text', value: s.value || '',
      attrs: { placeholder: s.placeholder || '', 'aria-label': s.title || 'Value' },
    });
    var area = s.multiline
      ? TP.ui.render.el('textarea', { class: 'input', value: s.value || '', attrs: { rows: s.rows || 5 } })
      : input;
    var control = s.multiline ? area : input;

    var error = TP.ui.render.el('div', { class: 'subtle mt' });

    var promise = open({
      title: s.title || 'Enter a value',
      body: [s.body || null, TP.ui.render.el('div', { class: 'field' }, control), error],
      defaultAction: 'ok',
      dismissible: true,
      actions: [
        { id: 'cancel', label: 'Cancel' },
        {
          id: 'ok',
          label: s.okLabel || 'OK',
          run: function (settle) {
            var value = String(control.value == null ? '' : control.value);
            // Validation happens with the dialog still open, so a rejected value is a
            // correction the user can make rather than a dialog that vanished.
            if (s.required && !value.trim()) {
              error.textContent = s.requiredMessage || 'A value is needed here.';
              control.focus();
              return;
            }
            settle('ok');
          },
        },
      ],
    });

    return promise.then(function (id) {
      if (id !== 'ok') return null;
      return String(control.value == null ? '' : control.value);
    });
  }

  function isOpen() { return !!current; }

  return {
    open: open,
    close: close,
    confirm: confirm,
    notice: notice,
    prompt: prompt,
    isOpen: isOpen,
  };
})();

/* ------------------------------ src/ai/transport.js ------------------------------ */
// The AI transport dispatcher (specs/07-ui.md §4.4, REQ-708).
//
// This module is the gate. `TP.environment.aiEnabled` is false under `file://`, and every entry
// point below returns a refusal BEFORE touching a transport — so no code path reaches `fetch` or
// the CDN `import()`, even if a UI guard is bypassed by a stale tab state or a future bug.
//
// The UI guards (the hidden tab, the hidden connection card) exist for the user. This one exists
// for the invariant, and it is the only one that has to hold.

TP.ai = TP.ai || {};

TP.ai.transport = (function () {
  'use strict';

  // Models curated from web-llm's prebuiltAppConfig. All download from the MLC CDN on first use.
  // `tools` records how reliably each one calls functions in the agent loop.
  //
  // Note: web-llm's TVM runtime hard-requires maxStorageBuffersPerShaderStage >= 10 regardless of
  // model size. Older Intel Macs and some integrated GPUs report 8 and cannot run any of these.
  var WEBGPU_MODELS = [
    { id: 'Qwen2.5-0.5B-Instruct-q4f16_1-MLC', label: 'Qwen2.5 0.5B', size: '~944 MB VRAM', tools: 'weak' },
    { id: 'Qwen2.5-1.5B-Instruct-q4f16_1-MLC', label: 'Qwen2.5 1.5B', size: '~1.6 GB VRAM', tools: 'partial' },
    { id: 'Llama-3.2-1B-Instruct-q4f16_1-MLC', label: 'Llama 3.2 1B', size: '~879 MB VRAM', tools: 'weak' },
    { id: 'Hermes-3-Llama-3.2-3B-q4f16_1-MLC', label: 'Hermes-3 3B', size: '~2.3 GB VRAM', tools: 'first-class' },
    { id: 'Qwen2.5-3B-Instruct-q4f16_1-MLC', label: 'Qwen2.5 3B', size: '~2.5 GB VRAM', tools: 'partial' },
  ];

  var DEFAULT_WEBGPU_MODEL = 'Qwen2.5-0.5B-Instruct-q4f16_1-MLC';

  var DEFAULTS = {
    mode: 'webgpu',                                  // 'webgpu' | 'cloud' | 'local'
    cloud: { apiKey: '', baseUrl: 'https://ollama.com' },
    local: { baseUrl: 'http://localhost:11434' },
    webgpu: { model: DEFAULT_WEBGPU_MODEL },
    proxyUrl: '',                                    // optional CORS proxy prefix on every AI call
    model: 'qwen2.5:7b',                             // must be tool-capable for the agent loop
    numCtx: 32000,
    maxIterations: 12,
    mock: false,
  };

  // The reason the AI is absent, in one place, so no two surfaces explain it differently.
  var FILE_REASON = 'AI planning needs a web address. This planner is running from a file on your disk, ' +
    'where the browser gives it no web identity — so it cannot reach an AI service, and it will not ' +
    'store a service key somewhere any other local file could read it.';

  function available() {
    return !!(TP.environment && TP.environment.aiEnabled);
  }

  function refusal() {
    return { ok: false, error: { kind: 'unavailable', status: 0, message: FILE_REASON } };
  }

  // ---- Settings ----
  //
  // Per-user state, kept in this browser and deliberately outside the container (REQ-211): a key
  // is not a property of a portable document, and a document that carried one would hand it to
  // everyone it was sent to.

  function storedSettings() {
    var all = TP.store && TP.store.readSettings ? TP.store.readSettings() : {};
    return mergeSettings(DEFAULTS, all.ai || {});
  }

  function saveSettings(next) {
    var merged = mergeSettings(DEFAULTS, next || {});
    if (TP.store && TP.store.writeSettings) TP.store.writeSettings({ ai: merged });
    return merged;
  }

  function resetSettings() {
    if (TP.store && TP.store.writeSettings) TP.store.writeSettings({ ai: clone(DEFAULTS) });
    return clone(DEFAULTS);
  }

  // Resolved, read-only view the transports use.
  function config() {
    var s = storedSettings();
    var isCloud = s.mode === 'cloud';
    var isLocal = s.mode === 'local';
    var isWebGPU = s.mode === 'webgpu';
    var base = String((isCloud ? s.cloud.baseUrl : s.local.baseUrl) || '').replace(/\/+$/, '');
    return {
      mode: s.mode,
      baseUrl: base,
      proxyUrl: String(s.proxyUrl || '').trim(),
      apiKey: isCloud ? String(s.cloud.apiKey || '').trim() : '',
      model: s.model,
      webgpuModel: (s.webgpu && s.webgpu.model) || DEFAULT_WEBGPU_MODEL,
      numCtx: s.numCtx,
      maxIterations: s.maxIterations,
      mock: !!s.mock,
      isCloud: isCloud,
      isLocal: isLocal,
      isWebGPU: isWebGPU,
    };
  }

  function mergeSettings(base, over) {
    var out = clone(base);
    Object.keys(over || {}).forEach(function (k) {
      var o = over[k];
      if (o && typeof o === 'object' && !Array.isArray(o) &&
          base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) {
        out[k] = mergeSettings(base[k], o);
      } else if (o !== undefined) {
        out[k] = o;
      }
    });
    return out;
  }

  // A deep copy that keeps the fields it does not understand, because the settings object it copies
  // contains scalars.
  //
  // The guard on the first line is the whole of it, and its absence was a live defect: `Object.keys`
  // accepts a STRING, and `Object.keys('webgpu')` is `['0','1',…]`, so `clone('webgpu')` recursed into
  // `'w'`, then `'w'[0]`, which is `'w'` again — a stack overflow, not a wrong answer. Since `DEFAULTS`
  // is mostly strings and `storedSettings()` clones it on every read, the entire AI configuration path
  // threw `RangeError: Maximum call stack size exceeded` the moment the AI was enabled. Under `file://`
  // nothing calls it (the panel is not offered at all, REQ-604), which is why it survived that far: the
  // one environment where the AI never runs is the one where this could not be seen.
