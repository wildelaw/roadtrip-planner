          r().el('div', { class: 'field' }, [r().el('label', { text: 'Confirmation' }), fields.confirmation]),
        ]),
        r().el('div', { class: 'field' }, [r().el('label', { text: 'Link' }), fields.link]),
        r().el('div', { class: 'field' }, [r().el('label', { text: 'Notes' }), fields.notes]),
      ],
      defaultAction: 'save',
      actions: [
        { id: 'cancel', label: 'Cancel' },
        { id: 'delete', label: 'Delete', danger: true },
        { id: 'save', label: 'Save' },
      ],
    }).then(function (id) {
      if (id === 'cancel' || !id) return null;
      if (id === 'delete') return removeItem(dayId, itemId);
      var duration = fields.durationMin.value.trim() === '' ? null : Number(fields.durationMin.value);
      if (duration != null && !isFinite(duration)) duration = null;
      TP.store.edit('Edit item', function (t) {
        var target = TP.model.findItem(t, dayId, itemId);
        if (!target) return;
        target.time = fields.time.value.trim() || null;
        // The raw string the file carried is a second spelling of the SAME wire slot (ledger:
        // `item.timeRaw`), so clearing the time clears it too. Leaving it behind would put the value
        // the person just deleted back on the wire: the exporter writes the raw when there is no
        // parsed time beside it, and the time would come back on the next import.
        if (!target.time) delete target.timeRaw;
        target.title = fields.title.value;
        target.type = fields.type.value;
        target.location = fields.location.value;
        target.cost = fields.cost.value.trim() === '' ? null : fields.cost.value.trim();
        target.durationMin = duration;
        target.confirmation = fields.confirmation.value;
        target.link = fields.link.value.trim();
        target.notes = fields.notes.value;
      });
      TP.ui.shell.renderAll();
      return itemId;
    });
  }

  function addItem(dayId) {
    var item = {
      id: TP.uid(),
      time: null,
      title: '',
      type: 'activity',
      location: '',
      cost: null,
      durationMin: null,
      confirmation: '',
      link: '',
      notes: '',
      flags: {},
    };
    TP.store.edit('Add an item', function (trip) {
      var day = TP.model.findDay(trip, dayId);
      if (day) day.items.push(item);
    });
    TP.ui.shell.renderAll();
    return editItem(dayId, item.id);
  }

  // A pasted list becomes items: one per line, "9:30 Breakfast" keeping its time.
  function pasteList(dayId) {
    return TP.ui.modal.prompt({
      title: 'Paste a list',
      body: r().el('p', { class: 'subtle', text: 'One item per line. A line that starts with a time keeps it.' }),
      multiline: true,
      rows: 8,
      placeholder: '9:30 Breakfast at the diner\n11:00 Lighthouse',
      okLabel: 'Add them',
    }).then(function (text) {
      if (!text || !text.trim()) return null;
      var lines = text.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
      TP.store.edit('Paste a list', function (trip) {
        var day = TP.model.findDay(trip, dayId);
        if (!day) return;
        lines.forEach(function (line) {
          var m = /^(\d{1,2}:\d{2})\s+(.*)$/.exec(line);
          day.items.push({
            id: TP.uid(),
            time: m ? m[1] : null,
            title: m ? m[2] : line,
            type: 'activity',
            location: '',
            cost: null,
            durationMin: null,
            confirmation: '',
            link: '',
            notes: '',
            flags: {},
          });
        });
      });
      TP.ui.shell.renderAll();
      TP.ui.toast.ok(lines.length + (lines.length === 1 ? ' item added.' : ' items added.'));
      return lines.length;
    });
  }

  function moveItem(dayId, itemId, delta) {
    TP.store.edit('Reorder items', function (trip) {
      var day = TP.model.findDay(trip, dayId);
      if (!day) return;
      var i = day.items.findIndex(function (x) { return x.id === itemId; });
      var j = i + delta;
      if (i === -1 || j < 0 || j >= day.items.length) return;
      var tmp = day.items[i];
      day.items[i] = day.items[j];
      day.items[j] = tmp;
    });
    TP.ui.shell.renderAll();
  }

  function removeItem(dayId, itemId) {
    TP.store.edit('Remove an item', function (trip) {
      var day = TP.model.findDay(trip, dayId);
      if (!day) return;
      day.items = day.items.filter(function (x) { return x.id !== itemId; });
    });
    TP.ui.shell.renderAll();
    TP.ui.toast.info('Item removed. Undo puts it back.');
  }

  function moveDay(dayId, delta) {
    TP.store.edit('Reorder days', function (trip) {
      var days = trip.days || [];
      var i = days.findIndex(function (d) { return d.id === dayId; });
      var j = i + delta;
      if (i === -1 || j < 0 || j >= days.length) return;
      var tmp = days[i];
      days[i] = days[j];
      days[j] = tmp;
    });
    TP.ui.shell.renderAll();
  }

  function addDay() {
    TP.store.edit('Add a day', function (trip) {
      var last = (trip.days || [])[trip.days.length - 1];
      var date = last && last.date ? TP.dates.toISO(TP.dates.addDays(TP.dates.parseISO(last.date), 1)) : TP.dates.todayISO();
      trip.days = trip.days || [];
      trip.days.push({ id: TP.uid(), date: date, title: '', stay: '', drive: '', chargeStops: '', nacs: '', summary: '', dining: [], tips: [], items: [] });
      if (!trip.endDate || date > trip.endDate) trip.endDate = date;
    });
    TP.ui.shell.renderAll();
  }

  function removeDay(dayId) {
    var trip = TP.store.trip();
    var day = TP.model.findDay(trip, dayId);
    if (!day) return;
    var items = (day.items || []).length;

    var go = items
      ? TP.ui.modal.confirm({
        title: 'Remove this day?',
        body: r().el('p', { text: 'This day has ' + TP.format.plural(items, 'item') + ' in it, and they go with it. Undo will not bring them back — the removal is recorded as a commit, and History can revert it.' }),
        confirmLabel: 'Remove the day and its items',
        danger: true,
      })
      : Promise.resolve(true);

    return go.then(function (yes) {
      if (!yes) return null;
      TP.store.edit('Remove a day', function (t) {
        t.days = t.days.filter(function (d) { return d.id !== dayId; });
      });
      TP.ui.shell.renderAll();
      return dayId;
    });
  }

  // ---- Keeping days and dates in step ----

  // Called when the trip's dates change. Days are added for new dates. Days that fall outside
  // the range are only removed after asking, and only when they hold something.
  function resync() {
    var trip = TP.store.trip();
    if (!trip.startDate || !trip.endDate) return;

    var wanted = TP.dates.expandDays(trip.startDate, trip.endDate).map(function (d) { return d.date; });
    if (!wanted.length) return;
    var have = (trip.days || []).map(function (d) { return d.date; });
    var missing = wanted.filter(function (d) { return have.indexOf(d) === -1; });

    var outside = (trip.days || []).filter(function (d) {
      return d.date && wanted.indexOf(d.date) === -1;
    });
    var outsideWithItems = outside.filter(function (d) { return (d.items || []).length > 0; });
    var outsideEmpty = outside.filter(function (d) { return !(d.items || []).length; });

    function apply(removeIds) {
      TP.store.edit('Match days to the trip dates', function (t) {
        removeIds.forEach(function (id) {
          t.days = t.days.filter(function (d) { return d.id !== id; });
        });
        missing.forEach(function (date) {
          t.days.push({ id: 'day-' + date, date: date, title: '', stay: '', drive: '', chargeStops: '', nacs: '', summary: '', dining: [], tips: [], items: [] });
        });
        t.days.sort(function (a, b) { return String(a.date || '').localeCompare(String(b.date || '')); });
      });
      TP.ui.shell.renderAll();
    }

    var emptyIds = outsideEmpty.map(function (d) { return d.id; });

    if (!outsideWithItems.length) { apply(emptyIds); return Promise.resolve(); }

    return TP.ui.modal.confirm({
      title: 'Days outside the new dates',
      body: r().el('div', {}, [
        r().el('p', { text: outsideWithItems.length + (outsideWithItems.length === 1
          ? ' day falls outside the trip\'s dates and has things planned on it: '
          : ' days fall outside the trip\'s dates and have things planned on them: ') +
          outsideWithItems.map(function (d) { return TP.dates.fmtDate(d.date); }).join(', ') + '.' }),
        r().el('p', { class: 'subtle', text: 'Keeping them leaves the itinerary intact. Removing them takes their items with them.' }),
      ]),
      confirmLabel: 'Remove them',
      cancelLabel: 'Keep them',
      danger: true,
    }).then(function (remove) {
      apply(remove ? emptyIds.concat(outsideWithItems.map(function (d) { return d.id; })) : emptyIds);
    });
  }

  return {
    render: render,
    editDay: editDay,
    editItem: editItem,
    addItem: addItem,
    addDay: addDay,
    removeDay: removeDay,
    removeItem: removeItem,
    moveItem: moveItem,
    moveDay: moveDay,
    pasteList: pasteList,
    resync: resync,
    alertsCard: alertsCard,
    addAlert: addAlert,
    removeAlert: removeAlert,
  };
})();

/* ------------------------------ src/ui/checklists.js ------------------------------ */
// Checklists: collapsible category groups with per-item done state (specs/03 §2.4).
//
// The canonical model stores {id, category, items:[{id, text, done}]}. The trip-data.json wire
// format has no place for `done`, so it is dropped on export — disclosed in the export dialog
// rather than silently forgotten (the ledger's one D on the checklist side).

TP.ui.checklists = (function () {
  'use strict';

  var R = null;
  function r() { R = R || TP.ui.render; return R; }

  function render(root) {
    var trip = TP.store.trip();
    var lists = trip.checklists || [];
    var done = 0;
    var total = 0;
    lists.forEach(function (c) {
      (c.items || []).forEach(function (i) { total++; if (i.done) done++; });
    });

    r().append(root, r().el('div', { class: 'card' }, [
      r().el('div', { class: 'card__head' }, [
        r().el('h2', { text: 'Checklists' }),
        r().el('span', { class: 'subtle', text: total ? done + ' of ' + total + ' done' : 'Nothing here yet' }),
      ]),
      r().el('p', { class: 'subtle mb0', text:
        'Grouped lists — packing, documents, shopping. Whether an item is ticked is kept in this ' +
        'planner, and is the one thing the plain-JSON export cannot carry.' }),
    ]));

    if (!lists.length) {
      r().append(root, r().el('div', { class: 'empty' }, [
        r().el('h2', { text: 'No checklists yet' }),
        r().el('p', { text: 'Add a category, then add items to it.' }),
        r().button('Add a checklist', function () { addList(); }, { class: 'btn btn--primary' }),
      ]));
      return;
    }

    lists.forEach(function (list) { r().append(root, listCard(list)); });
  }

  function listCard(list) {
    var items = list.items || [];
    var doneCount = items.filter(function (i) { return i.done; }).length;

    var card = r().el('div', { class: 'card' }, [
      r().el('div', { class: 'card__head' }, [
        r().el('h2', { text: list.category || 'Untitled list' }),
        r().el('span', { class: 'subtle', text: items.length ? doneCount + '/' + items.length : 'empty' }),
        r().el('span', { class: 'flex gap ml-auto' }, [
          r().button('Rename', function () { renameList(list.id); }, { class: 'btn btn--ghost btn--sm' }),
          r().button('Delete', function () { removeList(list.id); }, { class: 'btn btn--ghost btn--sm' }),
        ]),
      ]),
    ]);

    if (!items.length) {
      r().append(card, r().el('p', { class: 'subtle', text: 'No items in this list yet.' }));
    } else {
      items.forEach(function (item) {
        r().append(card, r().el('div', { class: 'cl-item' }, [
          (function () {
            var box = r().el('input', { type: 'checkbox', checked: !!item.done, attrs: { 'aria-label': item.text || 'Item' } });
            box.addEventListener('change', function () { toggleItem(list.id, item.id, box.checked); });
            return box;
          })(),
          r().el('span', { class: ['cl-text', item.done ? 'cl-text--done' : ''], text: item.text || '' }),
          r().el('span', { class: 'flex gap' }, [
            r().button('✎', function () { editItem(list.id, item.id); }, { class: 'btn btn--ghost btn--sm', attrs: { 'aria-label': 'Edit this item' } }),
            r().button('✕', function () { removeItem(list.id, item.id); }, { class: 'btn btn--ghost btn--sm', attrs: { 'aria-label': 'Remove this item' } }),
          ]),
        ]));
      });
    }

    r().append(card, r().el('div', { class: 'mt' }, [
      r().button('+ Add an item', function () { addItem(list.id); }, { class: 'btn btn--sm' }),
    ]));

    return card;
  }

  // ---- Mutations ----

  function applyEdit(mutate) {
    TP.store.edit('Change a checklist', mutate);
    TP.ui.shell.renderAll();
  }

  function addList() {
    return TP.ui.modal.prompt({
      title: 'New checklist',
      body: r().el('p', { class: 'subtle', text: 'A name for the list — "Packing", "Documents", "Before we leave".' }),
      required: true,
      okLabel: 'Add it',
      placeholder: 'Packing',
    }).then(function (name) {
      if (!name) return null;
      applyEdit(function (trip) {
        trip.checklists = trip.checklists || [];
        trip.checklists.push({ id: TP.uid(), category: name.trim(), items: [] });
      });
      return name;
    });
  }

  function renameList(listId) {
    var trip = TP.store.trip();
    var list = TP.model.findIn(trip.checklists, listId);
    if (!list) return null;
    return TP.ui.modal.prompt({
      title: 'Rename checklist',
      value: list.category || '',
      required: true,
      okLabel: 'Rename',
    }).then(function (name) {
      if (!name) return null;
      applyEdit(function (t) {
        var target = TP.model.findIn(t.checklists, listId);
        if (target) target.category = name.trim();
      });
      return name;
    });
  }

  function removeList(listId) {
    var trip = TP.store.trip();
    var list = TP.model.findIn(trip.checklists, listId);
    if (!list) return null;
    var items = (list.items || []).length;
    var go = items
      ? TP.ui.modal.confirm({
        title: 'Delete this checklist?',
        body: r().el('p', { text: 'It has ' + TP.format.plural(items, 'item') + '. They go with it, and History can put the whole list back.' }),
        confirmLabel: 'Delete it',
        danger: true,
      })
      : Promise.resolve(true);
    return go.then(function (yes) {
      if (!yes) return null;
      applyEdit(function (t) {
        t.checklists = (t.checklists || []).filter(function (c) { return c.id !== listId; });
      });
      return listId;
    });
  }

  function addItem(listId) {
    return TP.ui.modal.prompt({
      title: 'New item',
      required: true,
      okLabel: 'Add it',
      placeholder: 'Passport',
    }).then(function (text) {
      if (!text) return null;
      applyEdit(function (t) {
        var list = TP.model.findIn(t.checklists, listId);
        if (!list) return;
        list.items = list.items || [];
        list.items.push({ id: TP.uid(), text: text.trim(), done: false });
      });
      return text;
    });
  }

  function editItem(listId, itemId) {
    var trip = TP.store.trip();
    var list = TP.model.findIn(trip.checklists, listId);
    if (!list) return null;
    var item = TP.model.findIn(list.items, itemId);
    if (!item) return null;
    return TP.ui.modal.prompt({
      title: 'Edit item',
      value: item.text || '',
      required: true,
      okLabel: 'Save',
    }).then(function (text) {
      if (!text) return null;
      applyEdit(function (t) {
        var l = TP.model.findIn(t.checklists, listId);
        var i = l ? TP.model.findIn(l.items, itemId) : null;
        if (i) i.text = text.trim();
      });
      return text;
    });
  }

  function toggleItem(listId, itemId, done) {
    applyEdit(function (t) {
      var list = TP.model.findIn(t.checklists, listId);
      var item = list ? TP.model.findIn(list.items, itemId) : null;
      if (item) item.done = !!done;
    });
  }

  function removeItem(listId, itemId) {
    applyEdit(function (t) {
      var list = TP.model.findIn(t.checklists, listId);
      if (!list) return;
      list.items = (list.items || []).filter(function (i) { return i.id !== itemId; });
    });
  }

  return {
    render: render,
    addList: addList,
    renameList: renameList,
    removeList: removeList,
    addItem: addItem,
    editItem: editItem,
    toggleItem: toggleItem,
    removeItem: removeItem,
  };
})();

/* ------------------------------ src/ui/lodging.js ------------------------------ */
// Lodging: where you sleep each night (specs/03 §2.4).
//
// Nights and the days a stay covers are DERIVED from check-in and check-out, never stored
// (03-data-model.md §2.3): a stored `nights` beside a pair of dates is two truths, and the
// first merge would have to guess which one to believe.

TP.ui.lodging = (function () {
  'use strict';

  var R = null;
  function r() { R = R || TP.ui.render; return R; }

  function nightsOf(stay) {
    if (!stay.checkIn || !stay.checkOut) return null;
    var n = TP.dates.daysBetween(stay.checkIn, stay.checkOut);
    return n > 0 ? n : 0;
  }

  function render(root) {
    var trip = TP.store.trip();
    var stays = (trip.lodging || []).slice().sort(function (a, b) {
      return String(a.checkIn || '').localeCompare(String(b.checkIn || ''));
    });

    var nights = stays.reduce(function (sum, s) { var n = nightsOf(s); return sum + (n == null ? 0 : n); }, 0);
    var uncounted = stays.filter(function (s) { return nightsOf(s) == null; }).length;
    var gaps = uncoveredNights(trip, stays);

    var intro = r().el('div', {}, [
      r().el('p', { class: 'subtle', text: nights
        ? nights + (nights === 1 ? ' night' : ' nights') + ' covered by ' + TP.format.plural(stays.length, 'stay') + '.'
        : 'Where you are sleeping each night. Check-in and check-out are what the app counts from.' }),
      uncounted
        ? r().el('div', { class: 'info info--warn', text: uncounted +
          (uncounted === 1 ? ' stay has no check-in or check-out yet, so it counts for no nights.' : ' stays have no check-in or check-out yet, so they count for no nights.') })
        : null,
      gaps.length
        ? r().el('div', { class: 'info', text: 'No stay is recorded for: ' + gaps.map(TP.dates.fmtDate).join(', ') + '.' })
        : null,
    ]);

    var card = TP.ui.tripEditor.collectionCard({
      trip: trip,
      key: 'lodging',
      title: 'Lodging',
      editLabel: 'Change lodging',
      empty: 'No stays yet. Add the first place you sleep.',
      blank: function () {
        return { id: TP.uid(), location: '', checkIn: trip.startDate || null, checkOut: null, area: '', notes: '', confirmation: '' };
      },
      columns: [
        { key: 'location', label: 'Place', placeholder: 'Hotel, campsite, a friend\'s couch' },
        { key: 'checkIn', label: 'Check in', type: 'date' },
        { key: 'checkOut', label: 'Check out', type: 'date' },
        { label: 'Nights', derive: function (row) { var n = nightsOf(row); return n == null ? '' : String(n); } },
        { key: 'area', label: 'Area' },
        { key: 'confirmation', label: 'Confirmation' },
        { key: 'notes', label: 'Notes' },
      ],
    });

    r().append(root, r().el('div', { class: 'card' }, [intro]));
    r().append(root, card.card);
  }

  // Which trip days have no bed attached. Not an error — a question worth asking out loud.
  function uncoveredNights(trip, stays) {
    var days = (trip.days || []).map(function (d) { return d.date; }).filter(Boolean);
    if (!days.length) return [];
    var covered = Object.create(null);
    stays.forEach(function (s) {
      if (!s.checkIn || !s.checkOut) return;
      days.forEach(function (date) {
        if (date >= s.checkIn && date < s.checkOut) covered[date] = true;
      });
    });
    // The last day is a travelling-out day, not a night, so it is not required to have a bed.
    return days.slice(0, -1).filter(function (d) { return !covered[d]; });
  }

  return {
    render: render,
    nightsOf: nightsOf,
    uncoveredNights: uncoveredNights,
  };
})();

/* ------------------------------ src/ui/bookings.js ------------------------------ */
// Bookings and the things that must happen before leaving (specs/03 §2.4).
//
// `done` on a reservation or a pre-trip action is a fact about the user's progress, not about
// the trip, and neither export format has a place for it — the ledger records that as a D and
// the export dialog says so. It is kept here because losing your ticks on every reload would
// be worse than the disclosure.

TP.ui.bookings = (function () {
  'use strict';

  var R = null;
  function r() { R = R || TP.ui.render; return R; }

  var PRIORITY = ['high', 'med', 'low'];

  function render(root) {
    var trip = TP.store.trip();
    var today = TP.dates.todayISO();

    r().append(root, r().el('div', { class: 'card' }, [
      r().el('div', { class: 'card__head' }, [r().el('h2', { text: 'Bookings and tasks' })]),
      r().el('p', { class: 'subtle mb0', text:
        'What needs booking, what you can just turn up to, what to do before you leave, and who ' +
        'to call. Ticks are kept in this planner; neither export format carries them.' }),
    ]));

    r().append(root, reservationsCard(trip, today));
    r().append(root, r().el('div', { class: 'card' }, [overdueBanner(trip, today)]));
    r().append(root, noResCard(trip));
    r().append(root, actionsCard(trip));
    r().append(root, contactsCard(trip));
  }

  function overdueBanner(trip, today) {
    var overdue = (trip.reservations || []).filter(function (res) {
      return !res.done && res.bookBy && res.bookBy < today;
    });
    if (!overdue.length) {
      return r().el('p', { class: 'subtle mb0', text: 'Nothing is past its booking deadline.' });
    }
    return r().el('div', { class: 'info info--danger', text:
      overdue.length + (overdue.length === 1 ? ' booking is past its deadline: ' : ' bookings are past their deadline: ') +
      overdue.map(function (res) { return res.what || 'untitled'; }).join(', ') + '.' });
  }

  // ---- Reservations ----

  function reservationsCard(trip, today) {
    var rows = (trip.reservations || []).slice().sort(function (a, b) {
      return String(a.bookBy || '9999').localeCompare(String(b.bookBy || '9999'));
    });

    var card = r().el('div', { class: 'card' }, [
      r().el('div', { class: 'card__head' }, [
        r().el('h2', { text: 'Reservations' }),
        r().el('span', { class: 'subtle', text: rows.length ? TP.format.plural(rows.length, 'thing', 'things') + ' to book' : 'Nothing yet' }),
      ]),
    ]);

    if (!rows.length) {
      r().append(card, r().el('p', { class: 'subtle', text: 'Anything that needs booking in advance: add what it is and by when.' }));
    } else {
      r().append(card, r().el('table', { class: 'data compact' }, [
        r().el('thead', {}, r().el('tr', {}, [
          r().el('th', { attrs: { 'aria-label': 'Booked' } }),
          r().el('th', { text: 'What' }),
          r().el('th', { text: 'When' }),
          r().el('th', { text: 'Book by' }),
          r().el('th', { text: 'Cost' }),
          r().el('th', { text: 'How' }),
          r().el('th', { attrs: { 'aria-label': 'Actions' } }),
        ])),
        r().el('tbody', {}, rows.map(function (res) { return reservationRow(res, today); })),
      ]));
    }

    r().append(card, r().el('div', { class: 'mt' }, [
      r().button('+ Add a reservation', function () { addRow('reservations'); }, { class: 'btn btn--primary btn--sm' }),
    ]));
    return card;
  }

  function reservationRow(res, today) {
    var overdue = res.bookBy && res.bookBy < today && !res.done;
    return r().el('tr', {}, [
      r().el('td', {}, [doneBox('reservations', res)]),
      r().el('td', {}, [
        r().el('strong', { text: res.what || 'Untitled' }),
        res.priority ? r().el('span', { class: 'badge badge--' + (res.priority || 'med'), text: res.priority }) : null,
      ]),
      r().el('td', { class: 'subtle', text: res.when ? TP.dates.fmtDate(res.when) : '—' }),
      r().el('td', { class: overdue ? 'overdue' : 'subtle', text: (res.bookBy ? TP.dates.fmtDate(res.bookBy) : '—') + (overdue ? ' ⚠' : '') }),
      r().el('td', { class: 'subtle', text: res.cost == null || res.cost === '' ? '—' : String(res.cost) }),
      r().el('td', {}, [linkCell(res.howToBook)]),
      actionsCell('reservations', res),
    ]);
  }

  // ---- No reservation needed ----

  function noResCard(trip) {
    var rows = trip.noReservationNeeded || [];
    var card = r().el('div', { class: 'card' }, [
      r().el('div', { class: 'card__head' }, [
        r().el('h2', { text: 'No reservation needed' }),
        r().el('span', { class: 'subtle', text: rows.length ? String(rows.length) : 'Nothing yet' }),
      ]),
    ]);
    if (!rows.length) {
      r().append(card, r().el('p', { class: 'subtle', text: 'Things you can just turn up to. Recording them stops you re-checking later.' }));
    } else {
      r().append(card, r().el('table', { class: 'data compact' }, [
        r().el('thead', {}, r().el('tr', {}, [r().el('th', { text: 'What' }), r().el('th', { text: 'Notes' }), r().el('th', { attrs: { 'aria-label': 'Actions' } })])),
        r().el('tbody', {}, rows.map(function (row) {
          return r().el('tr', {}, [
            r().el('td', { text: row.what || 'Untitled' }),
            r().el('td', { class: 'subtle', text: row.notes || '' }),
            actionsCell('noReservationNeeded', row),
          ]);
        })),
      ]));
    }
    r().append(card, r().el('div', { class: 'mt' }, [
      r().button('+ Add', function () { addRow('noReservationNeeded'); }, { class: 'btn btn--primary btn--sm' }),
    ]));
    return card;
  }

  // ---- Pre-trip actions ----

  function actionsCard(trip) {
    var rows = trip.preTripActions || [];
    var done = rows.filter(function (a) { return a.done; }).length;
    var card = r().el('div', { class: 'card' }, [
      r().el('div', { class: 'card__head' }, [
        r().el('h2', { text: 'Before you leave' }),
        r().el('span', { class: 'subtle', text: rows.length ? done + ' of ' + rows.length + ' done' : 'Nothing yet' }),
      ]),
    ]);
    if (!rows.length) {
      r().append(card, r().el('p', { class: 'subtle', text: 'Documents, vaccinations, a spare key, someone to water the plants.' }));
    } else {
      r().append(card, r().el('table', { class: 'data compact' }, [
        r().el('thead', {}, r().el('tr', {}, [
          r().el('th', { attrs: { 'aria-label': 'Done' } }),
          r().el('th', { text: 'Task' }),
          r().el('th', { text: 'Category' }),
          r().el('th', { text: 'Priority' }),
          r().el('th', { attrs: { 'aria-label': 'Actions' } }),
        ])),
        r().el('tbody', {}, rows.map(function (row) {
          return r().el('tr', {}, [
            r().el('td', {}, [doneBox('preTripActions', row)]),
            r().el('td', {}, [r().el('span', { class: row.done ? 'cl-text--done' : '', text: row.text || '' })]),
            r().el('td', { class: 'subtle', text: row.category || '—' }),
            r().el('td', {}, [row.priority ? r().el('span', { class: 'badge badge--' + row.priority, text: row.priority }) : r().el('span', { class: 'subtle', text: '—' })]),
            actionsCell('preTripActions', row),
          ]);
        })),
      ]));
    }
    r().append(card, r().el('div', { class: 'mt' }, [
      r().button('+ Add a task', function () { addRow('preTripActions'); }, { class: 'btn btn--primary btn--sm' }),
    ]));
    return card;
  }

  // ---- Contacts ----

  function contactsCard(trip) {
    var rows = trip.contacts || [];
    var card = r().el('div', { class: 'card' }, [
      r().el('div', { class: 'card__head' }, [
        r().el('h2', { text: 'Contacts' }),
        r().el('span', { class: 'subtle', text: rows.length ? String(rows.length) : 'Nothing yet' }),
      ]),
    ]);
    if (!rows.length) {
      r().append(card, r().el('p', { class: 'subtle', text: 'Who to call, and what for. A phone number written down beats a search when you need it.' }));
    } else {
      r().append(card, r().el('table', { class: 'data compact' }, [
        r().el('thead', {}, r().el('tr', {}, [r().el('th', { text: 'For' }), r().el('th', { text: 'How' }), r().el('th', { attrs: { 'aria-label': 'Actions' } })])),
        r().el('tbody', {}, rows.map(function (row) {
          return r().el('tr', {}, [
            r().el('td', { text: row.what || '' }),
            r().el('td', {}, [linkCell(row.how)]),
            actionsCell('contacts', row),
          ]);
        })),
      ]));
    }
    r().append(card, r().el('div', { class: 'mt' }, [
      r().button('+ Add a contact', function () { addRow('contacts'); }, { class: 'btn btn--primary btn--sm' }),
    ]));
    return card;
  }

  // ---- Shared cells ----

  function doneBox(key, row) {
    var box = r().el('input', { type: 'checkbox', checked: !!row.done, attrs: { 'aria-label': 'Done' } });
    box.addEventListener('change', function () {
      TP.store.edit('Tick something off', function (trip) {
        var target = TP.model.findIn(trip[key], row.id);
        if (target) target.done = box.checked;
      });
      TP.ui.shell.renderActive();
    });
    return box;
  }

  // A phone number is not a link; a URL is, and only if its scheme is allowed (REQ-704).
  function linkCell(value) {
    var raw = value == null ? '' : String(value);
    if (!raw) return r().el('span', { class: 'subtle', text: '—' });
    var target = TP.format.linkifyTarget(raw);
    if (!target) return r().el('span', { class: 'subtle', text: raw });
    return r().el('a', { href: target, attrs: { rel: 'noopener noreferrer', target: '_blank' }, text: raw });
  }

  function actionsCell(key, row) {
    return r().el('td', {}, [
      r().button('Edit', function () { editRow(key, row.id); }, { class: 'btn btn--ghost btn--sm' }),
      r().button('Delete', function () { deleteRow(key, row.id); }, { class: 'btn btn--ghost btn--sm' }),
    ]);
  }

  // ---- Row editing ----

  var SPECS = {
    reservations: {
      title: 'reservation',
      label: 'what',
      fields: [
        { key: 'what', label: 'What', required: true, placeholder: 'Alcatraz ferry' },
        { key: 'when', label: 'When', type: 'date' },
        { key: 'bookBy', label: 'Book by', type: 'date' },
        { key: 'cost', label: 'Cost', placeholder: 'est. $80' },
        { key: 'howToBook', label: 'How to book', placeholder: 'URL or instructions' },
        { key: 'priority', label: 'Priority', type: 'select', options: PRIORITY },
        { key: 'done', label: 'Booked', type: 'checkbox' },
      ],
      blank: function () { return { id: TP.uid(), what: '', priority: 'med', done: false }; },
    },
    noReservationNeeded: {
      title: 'entry',
      label: 'what',
      fields: [
        { key: 'what', label: 'What', required: true, placeholder: 'Walk the Golden Gate Bridge' },
        { key: 'notes', label: 'Notes', type: 'textarea' },
      ],
      blank: function () { return { id: TP.uid(), what: '' }; },
    },
    preTripActions: {
      title: 'task',
      label: 'text',
      fields: [
        { key: 'text', label: 'Task', required: true, placeholder: 'Renew the passport' },
        { key: 'category', label: 'Category', placeholder: 'documents' },
        { key: 'priority', label: 'Priority', type: 'select', options: PRIORITY },
        { key: 'done', label: 'Done', type: 'checkbox' },
      ],
      blank: function () { return { id: TP.uid(), text: '', priority: 'low', done: false }; },
    },
    contacts: {
      title: 'contact',
      label: 'what',
      fields: [
        { key: 'what', label: 'For', required: true, placeholder: 'Hotel concierge' },
        { key: 'how', label: 'How', placeholder: 'phone or URL' },
      ],
      blank: function () { return { id: TP.uid(), what: '' }; },
    },
  };

  function addRow(key) {
    return editRow(key, null);
  }

  function editRow(key, id) {
    var spec = SPECS[key];
    if (!spec) return null;
    var trip = TP.store.trip();
    var existing = id ? TP.model.findIn(trip[key], id) : spec.blank();
    if (!existing) return null;

    var controls = {};
    var error = r().el('div', { class: 'subtle mt' });

    var body = spec.fields.map(function (f) {
      var current = existing[f.key];
      var control;
      if (f.type === 'textarea') {
        control = r().el('textarea', { class: 'input', attrs: { rows: '3' } });
        control.value = current == null ? '' : String(current);
      } else if (f.type === 'select') {
        control = r().el('select', { class: 'input' }, (f.options || []).map(function (o) {
          return r().el('option', { value: o, text: o, selected: String(current || '') === o });
        }));
      } else if (f.type === 'checkbox') {
        control = r().el('input', { type: 'checkbox', checked: !!current });
      } else {
        control = r().el('input', {
          class: 'input',
          type: f.type === 'date' ? 'date' : 'text',
          value: current == null ? '' : String(current),
          attrs: f.placeholder ? { placeholder: f.placeholder } : null,
        });
      }
      controls[f.key] = control;
      return r().el('div', { class: 'field' }, [r().el('label', { text: f.label }), control]);
    });

    return TP.ui.modal.open({
      title: (id ? 'Edit ' : 'Add ') + spec.title,
      body: body.concat([error]),
      defaultAction: 'save',
      actions: (id ? [{ id: 'cancel', label: 'Cancel' }, { id: 'delete', label: 'Delete', danger: true }] : [{ id: 'cancel', label: 'Cancel' }])
        .concat([{
          id: 'save',
          label: 'Save',
          run: function (settle) {
            var values = {};
            spec.fields.forEach(function (f) {
              var c = controls[f.key];
              if (f.type === 'checkbox') { values[f.key] = !!c.checked; return; }
              var v = (c.value || '').trim();
              // An empty text field means "no value", not the empty string: the difference
              // between a cost of "" and no cost at all matters to the budget roll-up.
              values[f.key] = (v === '' && f.type !== 'date') ? null : v;
            });
            if (spec.fields.some(function (f) { return f.required && !controls[f.key].value.trim(); })) {
              error.textContent = 'The ' + spec.label + ' is needed.';
              return;
            }
            TP.store.edit(id ? 'Edit a ' + spec.title : 'Add a ' + spec.title, function (t) {
              if (id) {
                var target = TP.model.findIn(t[key], id);
                if (!target) return;
                for (var k in values) {
                  if (!Object.prototype.hasOwnProperty.call(values, k)) continue;
                  if (values[k] === null) delete target[k];
                  else target[k] = values[k];
                }
              } else {
                if (!Array.isArray(t[key])) t[key] = [];
                var row = { id: existing.id };
                for (var k2 in values) {
                  if (Object.prototype.hasOwnProperty.call(values, k2) && values[k2] !== null) row[k2] = values[k2];
                }
                t[key].push(row);
              }
            });
            settle('save');
            TP.ui.shell.renderActive();
          },
        }]),
    }).then(function (chosen) {
      if (chosen === 'delete') return deleteRow(key, id);
      return chosen;
    });
  }

  function deleteRow(key, id) {
    var item = TP.model.findIn(TP.store.trip()[key], id);
    var what = item ? (item.what || item.text || item.location || 'this entry') : 'this entry';
    return TP.ui.modal.confirm({
      title: 'Delete it?',
      body: r().el('p', { text: '“' + what + '” will be removed. History keeps it, so a revert can bring it back.' }),
      confirmLabel: 'Delete',
      danger: true,
    }).then(function (yes) {
      if (!yes) return null;
      TP.store.edit('Delete an entry', function (t) {
        t[key] = (t[key] || []).filter(function (x) { return x.id !== id; });
      });
      TP.ui.shell.renderActive();
      return id;
    });
  }

  return {
    render: render,
    addRow: addRow,
    editRow: editRow,
    deleteRow: deleteRow,
    SPECS: SPECS,
  };
})();

/* ------------------------------ src/ui/places.js ------------------------------ */
// Places: the bucket list, and a library of locations with their activities
// (specs/03 §2.4).
//
// The bridge worth having: an activity on a location can be dropped onto a day, which creates
// an itinerary item. That is the moment a plan becomes a schedule, and it is the reason
// locations are stored rather than merely noted.

TP.ui.places = (function () {
  'use strict';

  var R = null;
  function r() { R = R || TP.ui.render; return R; }

  function render(root) {
    var trip = TP.store.trip();

    r().append(root, r().el('div', { class: 'card' }, [
      r().el('div', { class: 'card__head' }, [r().el('h2', { text: 'Places' })]),
      r().el('p', { class: 'subtle mb0', text:
        'The bucket list is what you hope to do. Locations are the places you have looked into, ' +
        'with the things worth doing there — and anything on a location can be dropped onto a day.' }),
    ]));

    r().append(root, bucketCard(trip));
    r().append(root, locationsCard(trip));
  }

  // ---- Bucket list ----

  function bucketCard(trip) {
    var rows = trip.bucketList || [];
    var card = r().el('div', { class: 'card' }, [
      r().el('div', { class: 'card__head' }, [
        r().el('h2', { text: 'Bucket list' }),
        r().el('span', { class: 'subtle', text: rows.length ? TP.format.plural(rows.length, 'idea') : 'Nothing yet' }),
      ]),
    ]);

    if (!rows.length) {
      r().append(card, r().el('p', { class: 'subtle', text: 'Anything you would like to do, whether or not it fits the dates yet.' }));
    } else {
      r().append(card, r().el('div', { class: 'chips' }, rows.map(function (b) {
        return r().el('span', { class: 'chip' }, [
          b.name || 'Untitled',
          b.dateLabel || b.date
            ? r().el('span', { class: 'subtle', text: '· ' + (b.dateLabel || TP.dates.fmtDate(b.date)) })
            : null,
          r().button('+ day', function () { addToDay(trip, { title: b.name, kind: 'activity' }); }, {
            class: 'btn--ghost', attrs: { title: 'Add this to a day', 'aria-label': 'Add this to a day' },
          }),
          r().button('Edit', function () { editBucket(b.id); }, { class: 'btn--ghost' }),
          r().button('×', function () { removeBucket(b.id); }, { class: 'btn--ghost', attrs: { 'aria-label': 'Remove this idea' } }),
        ]);
      })));
    }

    r().append(card, r().el('div', { class: 'mt' }, [
      r().button('+ Add an idea', function () { editBucket(null); }, { class: 'btn btn--primary btn--sm' }),
    ]));
    return card;
  }

  function editBucket(id) {
    var existing = id ? TP.model.findIn(TP.store.trip().bucketList, id) : { name: '', date: null, dateLabel: '' };
    var fields = {
      name: r().el('input', { class: 'input', type: 'text', value: existing.name || '', attrs: { placeholder: 'See the northern lights' } }),
      date: r().el('input', { class: 'input', type: 'date', value: existing.date || '' }),
      dateLabel: r().el('input', { class: 'input', type: 'text', value: existing.dateLabel || '', attrs: { placeholder: 'Someday, or "next autumn"' } }),
    };
    var error = r().el('div', { class: 'subtle mt' });

    return TP.ui.modal.open({
      title: id ? 'Edit idea' : 'Add an idea',
      body: [
        r().el('div', { class: 'field' }, [r().el('label', { text: 'What' }), fields.name]),
        r().el('div', { class: 'row' }, [
          r().el('div', { class: 'field' }, [r().el('label', { text: 'Around a date' }), fields.date]),
          r().el('div', { class: 'field' }, [r().el('label', { text: 'Or in words' }), fields.dateLabel]),
        ]),
        error,
      ],
      defaultAction: 'save',
      actions: (id ? [{ id: 'cancel', label: 'Cancel' }, { id: 'delete', label: 'Delete', danger: true }] : [{ id: 'cancel', label: 'Cancel' }])
        .concat([{
          id: 'save',
          label: 'Save',
          run: function (settle) {
            if (!fields.name.value.trim()) { error.textContent = 'Something to do is needed.'; return; }
            TP.store.edit(id ? 'Edit an idea' : 'Add an idea', function (trip) {
              var row = id ? TP.model.findIn(trip.bucketList, id) : null;
              if (!row) {
                row = { id: TP.uid() };
                trip.bucketList = trip.bucketList || [];
                trip.bucketList.push(row);
              }
              row.name = fields.name.value.trim();
              if (fields.date.value) row.date = fields.date.value; else delete row.date;
              if (fields.dateLabel.value.trim()) row.dateLabel = fields.dateLabel.value.trim(); else delete row.dateLabel;
            });
            settle('save');
            TP.ui.shell.renderActive();
          },
        }]),
    }).then(function (chosen) {
      if (chosen === 'delete') return removeBucket(id);
      return chosen;
    });
  }

  function removeBucket(id) {
    TP.store.edit('Remove an idea', function (trip) {
      trip.bucketList = (trip.bucketList || []).filter(function (b) { return b.id !== id; });
    });
    TP.ui.shell.renderActive();
    return id;
  }

  // ---- Locations ----

  function locationsCard(trip) {
    var rows = trip.locations || [];
    var card = r().el('div', { class: 'card' }, [
      r().el('div', { class: 'card__head' }, [
        r().el('h2', { text: 'Locations' }),
        r().el('span', { class: 'subtle', text: rows.length ? TP.format.plural(rows.length, 'place') : 'Nothing yet' }),
      ]),
    ]);

    if (!rows.length) {
      r().append(card, r().el('p', { class: 'subtle', text: 'A place you have looked into: where you might stay, what to eat, what to do.' }));
    } else {
      rows.forEach(function (loc) {
        r().append(card, locationBlock(trip, loc));
      });
    }

    r().append(card, r().el('div', { class: 'mt' }, [
      r().button('+ Add a location', function () { editLocation(null); }, { class: 'btn btn--primary btn--sm' }),
    ]));
    return card;
  }

  function locationBlock(trip, loc) {
    var activities = loc.activities || [];
    var block = r().el('div', { class: 'sect-sep' }, [
      r().el('div', { class: 'card__head mb0' }, [
        r().el('h2', { text: (loc.icon ? loc.icon + ' ' : '') + (loc.name || 'Untitled place') }),
        r().el('span', { class: 'flex gap ml-auto' }, [
          r().button('Edit', function () { editLocation(loc.id); }, { class: 'btn btn--ghost btn--sm' }),
          r().button('Delete', function () { removeLocation(loc.id); }, { class: 'btn btn--ghost btn--sm' }),
        ]),
      ]),
      loc.summary ? r().el('p', { class: 'subtle', text: loc.summary }) : null,
      loc.lodging ? r().el('div', { class: 'subtle', text: 'Staying: ' + loc.lodging }) : null,
      (loc.charging || []).length ? r().el('div', { class: 'subtle', text: 'Charging: ' + loc.charging.join(', ') }) : null,
      (loc.dining || []).length ? r().el('div', { class: 'subtle', text: 'Eating: ' + loc.dining.join(', ') }) : null,
    ]);

    if (activities.length) {
      var list = r().el('div', { class: 'loc__activities' });
      activities.forEach(function (act) {
        r().append(list, r().el('div', { class: 'loc__act' }, [
          r().el('span', { class: 'loc__act-type', text: act.type || 'activity' }),
          r().el('span', { class: 'flex-1' }, [
            r().el('strong', { text: act.name || '' }),
            act.desc ? r().el('div', { class: 'subtle', text: act.desc }) : null,
          ]),
          r().button('+ day', function () { addToDay(trip, { title: act.name, notes: act.desc || '', location: loc.name }); }, {
            class: 'btn btn--sm', attrs: { title: 'Add this to a day' },
          }),
        ]));
      });
      r().append(block, list);
    }

    return block;
  }

  function editLocation(id) {
    var trip = TP.store.trip();
    var existing = id ? TP.model.findIn(trip.locations, id) : {
      id: TP.uid(), name: '', icon: '', summary: '', lodging: '', charging: [], dining: [], activities: [],
    };
    var fields = {
      name: r().el('input', { class: 'input', type: 'text', value: existing.name || '', attrs: { placeholder: 'Osaka' } }),
      icon: r().el('input', { class: 'input', type: 'text', value: existing.icon || '', attrs: { placeholder: '📍' } }),
      summary: r().el('textarea', { class: 'input', attrs: { rows: '2' } }),
      lodging: r().el('input', { class: 'input', type: 'text', value: existing.lodging || '' }),
      charging: r().el('input', { class: 'input', type: 'text', value: (existing.charging || []).join(', '), attrs: { placeholder: 'Separate with commas' } }),
      dining: r().el('input', { class: 'input', type: 'text', value: (existing.dining || []).join(', '), attrs: { placeholder: 'Separate with commas' } }),
      activities: r().el('textarea', { class: 'input', attrs: { rows: '5', placeholder: 'Name | type | description — one per line' } }),
    };
    fields.summary.value = existing.summary || '';
    // Activities are edited as lines rather than as a sub-form: it keeps a nested list from
    // needing a nested dialog, and the format is the one the old app already wrote.
    fields.activities.value = (existing.activities || []).map(function (a) {
      return [a.name || '', a.type || '', a.desc || ''].join(' | ');
    }).join('\n');

    var error = r().el('div', { class: 'subtle mt' });

    return TP.ui.modal.open({
      title: id ? 'Edit location' : 'Add a location',
      body: [
        r().el('div', { class: 'row' }, [
          r().el('div', { class: 'field' }, [r().el('label', { text: 'Name' }), fields.name]),
          r().el('div', { class: 'field' }, [r().el('label', { text: 'Icon' }), fields.icon]),
        ]),
        r().el('div', { class: 'field' }, [r().el('label', { text: 'Summary' }), fields.summary]),
        r().el('div', { class: 'field' }, [r().el('label', { text: 'Where you might stay' }), fields.lodging]),
        r().el('div', { class: 'row' }, [
          r().el('div', { class: 'field' }, [r().el('label', { text: 'Charging' }), fields.charging]),
          r().el('div', { class: 'field' }, [r().el('label', { text: 'Eating' }), fields.dining]),
        ]),
        r().el('div', { class: 'field' }, [r().el('label', { text: 'Things to do' }), fields.activities]),
        error,
      ],
      defaultAction: 'save',
      actions: (id ? [{ id: 'cancel', label: 'Cancel' }, { id: 'delete', label: 'Delete', danger: true }] : [{ id: 'cancel', label: 'Cancel' }])
        .concat([{
          id: 'save',
          label: 'Save',
          run: function (settle) {
            if (!fields.name.value.trim()) { error.textContent = 'A name is needed.'; return; }
            var activities = fields.activities.value.split('\n').map(function (line) {
              var parts = line.split('|').map(function (s) { return s.trim(); });
              if (!parts[0]) return null;
              var act = { name: parts[0] };
              if (parts[1]) act.type = parts[1];
              if (parts[2]) act.desc = parts[2];
              return act;
            }).filter(Boolean);

            TP.store.edit(id ? 'Edit a location' : 'Add a location', function (t) {
              var row = id ? TP.model.findIn(t.locations, id) : null;
              if (!row) {
                row = { id: existing.id };
                t.locations = t.locations || [];
                t.locations.push(row);
              }
              row.name = fields.name.value.trim();
              if (fields.icon.value.trim()) row.icon = fields.icon.value.trim(); else delete row.icon;
              if (fields.summary.value.trim()) row.summary = fields.summary.value; else delete row.summary;
              if (fields.lodging.value.trim()) row.lodging = fields.lodging.value.trim(); else delete row.lodging;
              row.charging = splitList(fields.charging.value);
              row.dining = splitList(fields.dining.value);
              row.activities = activities;
            });
            settle('save');
            TP.ui.shell.renderActive();
          },
        }]),
    }).then(function (chosen) {
      if (chosen === 'delete') return removeLocation(id);
      return chosen;
    });
  }

  function splitList(text) {
    return String(text || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
  }

  function removeLocation(id) {
    var loc = TP.model.findIn(TP.store.trip().locations, id);
    return TP.ui.modal.confirm({
      title: 'Delete this location?',
      body: r().el('p', { text: '“' + ((loc && loc.name) || 'This place') + '” and its list of things to do will be removed. History can put it back.' }),
      confirmLabel: 'Delete',
      danger: true,
    }).then(function (yes) {
      if (!yes) return null;
      TP.store.edit('Delete a location', function (trip) {
        trip.locations = (trip.locations || []).filter(function (l) { return l.id !== id; });
      });
      TP.ui.shell.renderActive();
      return id;
    });
  }

  // ---- The bridge: a place's idea becomes an itinerary item ----

  function addToDay(trip, spec) {
    var days = trip.days || [];
    if (!days.length) {
      TP.ui.toast.warn('This trip has no days yet. Set its dates first.');
      return Promise.resolve(null);
    }

    var select = r().el('select', { class: 'input' }, days.map(function (d, i) {
      return r().el('option', {
        value: d.id,
        text: 'Day ' + (i + 1) + ' — ' + TP.dates.fmtDate(d.date) + (d.title ? ' · ' + d.title : ''),
      });
    }));
    var time = r().el('input', { class: 'input', type: 'text', attrs: { placeholder: 'HH:MM (optional)' } });

    return TP.ui.modal.open({
      title: 'Add to a day',
      body: [
        r().el('p', { class: 'subtle', text: spec.title || '' }),
        r().el('div', { class: 'field' }, [r().el('label', { text: 'Which day' }), select]),
        r().el('div', { class: 'field' }, [r().el('label', { text: 'Time' }), time]),
      ],
      defaultAction: 'add',
      actions: [{ id: 'cancel', label: 'Cancel' }, { id: 'add', label: 'Add it' }],
    }).then(function (id) {
      if (id !== 'add') return null;
      TP.store.edit('Add a place to a day', function (t) {
        var day = TP.model.findDay(t, select.value);
        if (!day) return;
        day.items = day.items || [];
        day.items.push({
          id: TP.uid(),
          time: time.value.trim() || null,
          title: spec.title || 'Untitled',
          type: spec.kind || 'activity',
          location: spec.location || '',
          cost: null,
          durationMin: null,
          confirmation: '',
          link: '',
          notes: spec.notes || '',
          flags: {},
        });
      });
      TP.ui.shell.renderActive();
      TP.ui.toast.ok('Added to the itinerary.');
      return select.value;
    });
  }

  return {
    render: render,
    editBucket: editBucket,
    removeBucket: removeBucket,
    editLocation: editLocation,
    removeLocation: removeLocation,
    addToDay: addToDay,
  };
})();

// Charging (specs/03 §2.4).
//
// This tab exists only for a trip with a vehicle, which is also what makes it EV mode: the tab
// list is a filter over `TP.model.isEv(trip)`, not a separate setting to keep in step
// (REQ-603's existing mechanism, specs/07-ui.md §5).

TP.ui.charging = (function () {
  'use strict';

  var R = null;
  function r() { R = R || TP.ui.render; return R; }

  var SEVERITY = ['danger', 'warn', 'info'];

  function render(root) {
    var trip = TP.store.trip();

    if (!TP.model.isEv(trip)) {
      r().append(root, r().el('div', { class: 'empty' }, [
        r().el('h2', { text: 'This is not an electric-vehicle trip' }),
        r().el('p', { text: 'Give the trip a vehicle in the itinerary header and this tab fills up.' }),
        r().button('Open the itinerary', function () { TP.ui.shell.setTab('itinerary'); }, { class: 'btn' }),
      ]));
      return;
    }

    r().append(root, vehicleCard(trip));
    r().append(root, networksCard(trip));
    r().append(root, thresholdsCard(trip));
    r().append(root, dayPlanCard(trip));
  }

  function vehicleCard(trip) {
    var v = trip.vehicle || {};
    var rows = [
      ['Model', v.model],
      ['Convention', v.chargingConvention],
      ['Battery', v.batteryKWh == null ? null : v.batteryKWh + ' kWh'],
      ['Full range', v.fullRangeMiles == null ? null : v.fullRangeMiles + ' mi'],
      ['Usable range', v.usableRangeMiles == null ? null : v.usableRangeMiles + ' mi'],
      ['Efficiency', v.efficiencyMilesPerKWh == null ? null : v.efficiencyMilesPerKWh + ' mi/kWh'],
    ].filter(function (row) { return row[1] != null && row[1] !== ''; });

    var inputs = {};
    ['batteryKWh', 'fullRangeMiles', 'usableRangeMiles', 'efficiencyMilesPerKWh', 'chargingConvention'].forEach(function (key) {
      inputs[key] = r().el('input', {
        class: 'input',
        type: key === 'chargingConvention' ? 'text' : 'number',
        value: v[key] == null ? '' : v[key],
        attrs: { step: 'any' },
      });
      inputs[key].addEventListener('change', function () {
        var raw = inputs[key].value;
        TP.store.edit('Change the vehicle', function (t) {
          if (!t.vehicle) t.vehicle = { model: '' };
          if (raw === '') delete t.vehicle[key];
          else t.vehicle[key] = key === 'chargingConvention' ? raw : Number(raw);
        });
        TP.ui.shell.renderActive();
      });
    });

    var card = r().el('div', { class: 'card' }, [
      r().el('div', { class: 'card__head' }, [
        r().el('h2', { text: '🔋 ' + (v.model || 'Vehicle') }),
        r().el('span', { class: 'subtle', text: 'These numbers drive the range notes below' }),
      ]),
    ]);

    if (rows.length) {
      r().append(card, r().el('dl', { class: 'kv' }, rows.reduce(function (acc, row) {
        acc.push(r().el('dt', { text: row[0] }), r().el('dd', { text: String(row[1]) }));
        return acc;
      }, [])));
    }

    r().append(card, r().el('div', { class: 'row mt' }, [
      r().el('div', { class: 'field' }, [r().el('label', { text: 'Battery (kWh)' }), inputs.batteryKWh]),
      r().el('div', { class: 'field' }, [r().el('label', { text: 'Full range (mi)' }), inputs.fullRangeMiles]),
    ]));
    r().append(card, r().el('div', { class: 'row' }, [
      r().el('div', { class: 'field' }, [r().el('label', { text: 'Usable range (mi)' }), inputs.usableRangeMiles]),
      r().el('div', { class: 'field' }, [r().el('label', { text: 'Efficiency (mi/kWh)' }), inputs.efficiencyMilesPerKWh]),
    ]));
    r().append(card, r().el('div', { class: 'field' }, [
      r().el('label', { text: 'Plug convention' }),
      inputs.chargingConvention,
      r().el('div', { class: 'subtle', text: 'NACS, CCS, or whatever the car takes. This is a note to yourself.' }),
    ]));

    return card;
  }

  function networksCard(trip) {
    return TP.ui.tripEditor.collectionCard({
      trip: trip,
      key: 'chargingNetworks',
      title: 'Charging networks',
      editLabel: 'Change charging networks',
      empty: 'Networks you expect to use, and where. Note which ones need an adapter.',
      blank: function () { return { id: TP.uid(), name: '', location: '', network: '', adapter: '' }; },
      columns: [
        { key: 'name', label: 'Name', placeholder: 'Supercharger — Barstow' },
        { key: 'location', label: 'Where' },
        { key: 'network', label: 'Network', placeholder: 'Tesla, Electrify America' },
        { key: 'adapter', label: 'Adapter needed', type: 'checkbox' },
        { key: 'notes', label: 'Notes' },
      ],
    }).card;
  }

  function thresholdsCard(trip) {
    var days = trip.days || [];
    return TP.ui.tripEditor.collectionCard({
      trip: trip,
      key: 'minSocThresholds',
      title: 'Minimum charge to keep',
      editLabel: 'Change charge thresholds',
      empty: 'Legs where you do not want to go below a certain charge — long climbs, gaps between chargers.',
      blank: function () { return { id: TP.uid(), day: days[0] ? days[0].date : '', leg: '', minSoc: 20, reason: '', severity: 'warn' }; },
      columns: [
        {
          key: 'day', label: 'Day', type: 'select',
          options: days.map(function (d, i) { return { value: d.date, label: 'Day ' + (i + 1) + ' — ' + TP.dates.fmtDate(d.date) }; }),
        },
        { key: 'leg', label: 'Leg', placeholder: 'Barstow → Needles' },
        { key: 'minSoc', label: 'Min %', type: 'number' },
        { key: 'reason', label: 'Why' },
        { key: 'severity', label: 'Seriousness', type: 'select', options: SEVERITY },
      ],
    }).card;
  }

  // The plan, day by day: the charge stops and the thresholds that apply to that date.
  function dayPlanCard(trip) {
    var days = (trip.days || []).filter(function (d) {
      var hasCharge = (d.items || []).some(function (i) { return i.flags && i.flags.charge; });
      var hasThreshold = (trip.minSocThresholds || []).some(function (t) { return t.day === d.date; });
      return hasCharge || hasThreshold;
    });

    var card = r().el('div', { class: 'card' }, [
      r().el('div', { class: 'card__head' }, [
        r().el('h2', { text: 'Day by day' }),
        r().el('span', { class: 'subtle', text: days.length ? TP.format.plural(days.length, 'day') + ' with charging' : 'Nothing to plan' }),
      ]),
    ]);

    if (!days.length) {
      r().append(card, r().el('p', { class: 'subtle mb0', text:
        'No day has a charge stop or a minimum-charge rule yet. Mark an itinerary item as a charge ' +
        'stop, or add a threshold above, and it appears here.' }));
      return card;
    }

    days.forEach(function (day) {
      // The day's number is its position in the TRIP, not in this filtered list: the threshold
      // editor above numbers days that way, and a trip whose only charge stop is on day 4 was
      // labelled "Day 1" here beside its own date.
      var dayNumber = (trip.days || []).indexOf(day) + 1;
      var stops = (day.items || []).filter(function (i) { return i.flags && i.flags.charge; });
      var thresholds = (trip.minSocThresholds || []).filter(function (t) { return t.day === day.date; });
      r().append(card, r().el('div', { class: 'sect-sep' }, [
        r().el('div', { class: 'flex flex--between' }, [
          r().el('strong', { text: 'Day ' + (dayNumber || '?') + ' — ' + TP.dates.fmtDate(day.date) }),
          day.drive ? r().el('span', { class: 'subtle', text: day.drive }) : null,
        ]),
        stops.length
          ? r().el('div', { class: 'item__meta', text: '⚡ ' + stops.map(function (s) {
            return (s.title || 'Charge stop') + (s.flags && s.flags.minSoc ? ' (min ' + s.flags.minSoc + '%)' : '');
          }).join(' · ') })
          : null,
        thresholds.map(function (t) {
          var cls = t.severity === 'danger' ? 'high' : t.severity === 'warn' ? 'med' : 'low';
          return r().el('div', { class: 'item__meta' }, [
            r().el('span', { class: 'badge badge--' + cls, text: String(t.minSoc == null ? '?' : t.minSoc) + '%' }),
            ' ' + (t.leg || '') + (t.reason ? ' — ' + t.reason : ''),
          ]);
        }),
      ]));
    });

    return card;
  }

  return {
    render: render,
    SEVERITY: SEVERITY,
  };
})();

/* ------------------------------ src/ui/budget.js ------------------------------ */
// Budget: estimates as the plan, expenses as what actually happened (specs/03 §2.3).
//
// The roll-up is recomputed on every render from `budgetEstimates`. It is never stored: a
// stored total beside the lines it sums is two truths, and the first merge would have to
// arbitrate between them (03-data-model.md §2.3).

TP.ui.budget = (function () {
  'use strict';

  var R = null;
  function r() { R = R || TP.ui.render; return R; }

  function render(root) {
    var trip = TP.store.trip();
    var estimates = trip.budgetEstimates || [];
    var expenses = trip.expenses || [];
    var currency = trip.currency || 'USD';

    var rollup = TP.model.rollupBudget(estimates);
    var spent = TP.model.expenseTotal(expenses);
    var required = estimates.reduce(function (sum, e) {
      return sum + (e.optional ? 0 : (TP.format.parseCost(e.cost) || 0));
    }, 0);
    var optional = rollup.total - required;

    r().append(root, summaryCard(currency, rollup.total, required, optional, spent, estimates.length, expenses.length));
    r().append(root, barsCard(rollup, currency, spent));
    r().append(root, estimatesCard(trip, currency));
    r().append(root, expensesCard(trip, currency));
  }

  function summaryCard(currency, total, required, optional, spent, lineCount, expenseCount) {
    return r().el('div', { class: 'card' }, [
      r().el('div', { class: 'card__head' }, [
        r().el('h2', { text: 'Budget' }),
        r().el('span', { class: 'subtle', text: lineCount ? TP.format.plural(lineCount, 'line item') : 'No estimates yet' }),
      ]),
      r().el('div', { class: 'row' }, [
        stat('Planned', TP.format.fmtMoney(total, currency), lineCount + ' line items'),
        stat('Must spend', TP.format.fmtMoney(required, currency), 'excluding optional'),
        stat('Optional', TP.format.fmtMoney(optional, currency), optional ? 'if the money is there' : 'none marked optional'),
        stat('Spent', TP.format.fmtMoney(spent, currency), expenseCount ? TP.format.plural(expenseCount, 'expense') : 'nothing recorded'),
      ]),
      spent > total && total > 0
        ? r().el('div', { class: 'info info--danger mt', text: 'Spending is ' + TP.format.fmtMoney(spent - total, currency) + ' past the plan.' })
        : null,
    ]);
  }

  function stat(label, value, note) {
    return r().el('div', {}, [
      r().el('div', { class: 'subtle', text: label }),
      r().el('div', { class: 'stat', text: value }),
      r().el('div', { class: 'subtle', text: note || '' }),
    ]);
  }

  function barsCard(rollup, currency, spent) {
    var card = r().el('div', { class: 'card' }, [r().el('div', { class: 'card__head' }, [r().el('h2', { text: 'Where it goes' })])]);
    if (!rollup.categories.length) {
      r().append(card, r().el('p', { class: 'subtle mb0', text: 'Add line items with a category and the split appears here.' }));
      return card;
    }
    var max = rollup.categories.reduce(function (m, c) { return Math.max(m, c.amount); }, 0) || 1;
    rollup.categories.forEach(function (cat) {
      r().append(card, r().el('div', { class: 'mb' }, [
        r().el('div', { class: 'flex flex--between' }, [
          r().el('span', { text: cat.name }),
          r().el('span', { class: 'subtle', text: TP.format.fmtMoney(cat.amount, currency) }),
        ]),
        r().el('div', { class: 'bar' }, [
          r().el('div', {
            class: ['bar__fill', cat.amount > max ? 'bar__fill--over' : ''],
            // The one width that cannot be a class. It is set through the CSSOM rather than as a
            // `style` attribute, because the artifact's hash-pinned policy blocks the attribute
            // and does not cover the CSSOM (see ui/render.js).
            style: { width: Math.max(2, Math.round((cat.amount / max) * 100)) + '%' },
          }),
        ]),
      ]));
    });
    if (spent > 0) {
      r().append(card, r().el('p', { class: 'subtle mb0', text: 'Bars show the plan. Recorded spending is ' + TP.format.fmtMoney(spent, currency) + ' in total.' }));
    }
    return card;
  }

  function estimatesCard(trip, currency) {
    var rows = trip.budgetEstimates || [];
    var card = r().el('div', { class: 'card' }, [
      r().el('div', { class: 'card__head' }, [
        r().el('h2', { text: 'Estimated costs' }),
        r().el('span', { class: 'subtle', text: rows.length ? TP.format.plural(rows.length, 'line item') : 'Nothing yet' }),
      ]),
    ]);

    if (!rows.length) {
      r().append(card, r().el('p', { class: 'subtle', text: 'What you expect to spend, grouped by category. A range like “$450–600” is fine — the low end is counted.' }));
    } else {
      var total = TP.model.rollupBudget(rows).total;
      r().append(card, r().el('table', { class: 'data compact' }, [
        r().el('thead', {}, r().el('tr', {}, [
          r().el('th', { text: 'Category' }), r().el('th', { text: 'Item' }), r().el('th', { text: 'Cost' }),
          r().el('th', { text: 'Optional' }), r().el('th', { attrs: { 'aria-label': 'Actions' } }),
        ])),
        r().el('tbody', {}, rows.map(function (row) { return estimateRow(row); }).concat([
          r().el('tr', {}, [
            r().el('th', { text: 'Total' }),
            r().el('td', {}),
            r().el('th', { text: TP.format.fmtMoney(total, currency) }),
            r().el('td', {}),
            r().el('td', {}),
          ]),
        ])),
      ]));
    }

    r().append(card, r().el('div', { class: 'mt' }, [
      r().button('+ Add a line item', function () { editEstimate(null); }, { class: 'btn btn--primary btn--sm' }),
    ]));
    return card;
  }

  function estimateRow(row) {
    return r().el('tr', {}, [
      r().el('td', {}, [cellInput('budgetEstimates', row.id, 'category', row.category, 'text')]),
      r().el('td', {}, [cellInput('budgetEstimates', row.id, 'item', row.item, 'text')]),
      r().el('td', {}, [cellInput('budgetEstimates', row.id, 'cost', row.cost, 'text')]),
      r().el('td', {}, [cellCheck('budgetEstimates', row.id, 'optional', row.optional)]),
      r().el('td', {}, [
        r().button('✕', function () { removeRow('budgetEstimates', row.id); }, { class: 'btn btn--ghost btn--sm', attrs: { 'aria-label': 'Remove this line' } }),
      ]),
    ]);
  }

  function expensesCard(trip, currency) {
    var rows = trip.expenses || [];
    var card = r().el('div', { class: 'card' }, [
      r().el('div', { class: 'card__head' }, [
        r().el('h2', { text: 'What you actually spent' }),
        r().el('span', { class: 'subtle', text: rows.length ? TP.format.fmtMoney(TP.model.expenseTotal(rows), currency) : 'Nothing recorded' }),
      ]),
    ]);

    if (!rows.length) {
      r().append(card, r().el('p', { class: 'subtle', text: 'Record spending as it happens and the plan above stops being a guess.' }));
    } else {
      var sorted = rows.slice().sort(function (a, b) { return String(b.date || '').localeCompare(String(a.date || '')); });
      r().append(card, r().el('table', { class: 'data compact' }, [
        r().el('thead', {}, r().el('tr', {}, [
          r().el('th', { text: 'Date' }), r().el('th', { text: 'Item' }), r().el('th', { text: 'Category' }),
          r().el('th', { text: 'Amount' }), r().el('th', { attrs: { 'aria-label': 'Actions' } }),
        ])),
        r().el('tbody', {}, sorted.map(function (row) {
          return r().el('tr', {}, [
            r().el('td', {}, [cellInput('expenses', row.id, 'date', row.date, 'date')]),
            r().el('td', {}, [cellInput('expenses', row.id, 'item', row.item, 'text')]),
            r().el('td', {}, [cellInput('expenses', row.id, 'category', row.category, 'text')]),
            r().el('td', {}, [cellInput('expenses', row.id, 'amount', row.amount, 'number')]),
            r().el('td', {}, [
              r().button('✕', function () { removeRow('expenses', row.id); }, { class: 'btn btn--ghost btn--sm', attrs: { 'aria-label': 'Remove this expense' } }),
            ]),
          ]);
        })),
      ]));
    }

    r().append(card, r().el('div', { class: 'mt' }, [
      r().button('+ Record spending', function () { editExpense(null); }, { class: 'btn btn--primary btn--sm' }),
    ]));
    return card;
  }

  // ---- Cells ----

  function cellInput(key, rowId, field, value, type) {
    var input = r().el('input', {
      class: 'input',
      type: type === 'date' ? 'date' : type === 'number' ? 'number' : 'text',
      value: value == null ? '' : String(value),
      attrs: type === 'number' ? { step: 'any' } : null,
    });
    input.addEventListener('change', function () {
      setField(key, rowId, field, type === 'number'
        ? (input.value === '' ? null : Number(input.value))
        : (input.value === '' ? null : input.value));
    });
    return input;
  }

  function cellCheck(key, rowId, field, value) {
    var box = r().el('input', { type: 'checkbox', checked: !!value, attrs: { 'aria-label': field } });
    box.addEventListener('change', function () { setField(key, rowId, field, box.checked); });
    return box;
  }

  function setField(key, rowId, field, value) {
    TP.store.edit('Change the budget', function (trip) {
      var row = TP.model.findIn(trip[key], rowId);
      if (!row) return;
      if (value === null) delete row[field];
      else row[field] = value;
    });
    TP.ui.shell.renderActive();
  }

  function removeRow(key, rowId) {
    TP.store.edit('Remove a budget line', function (trip) {
      trip[key] = (trip[key] || []).filter(function (x) { return x.id !== rowId; });
    });
    TP.ui.shell.renderActive();
  }

  // ---- Dialogs ----

  function editEstimate(id) {
    var existing = id ? TP.model.findIn(TP.store.trip().budgetEstimates, id) : { category: '', item: '', cost: '', optional: false };
    var fields = {
      category: r().el('input', { class: 'input', type: 'text', value: existing.category || '', attrs: { placeholder: 'Lodging' } }),
      item: r().el('input', { class: 'input', type: 'text', value: existing.item || '', attrs: { placeholder: 'Hotel in Barstow, 2 nights' } }),
      cost: r().el('input', { class: 'input', type: 'text', value: existing.cost == null ? '' : String(existing.cost), attrs: { placeholder: 'est. $450–600' } }),
      optional: r().el('input', { type: 'checkbox', checked: !!existing.optional }),
    };
    var error = r().el('div', { class: 'subtle mt' });

    return TP.ui.modal.open({
      title: 'Add a line item',
      body: [
        r().el('div', { class: 'field' }, [r().el('label', { text: 'Category' }), fields.category]),
        r().el('div', { class: 'field' }, [r().el('label', { text: 'Item' }), fields.item]),
        r().el('div', { class: 'row' }, [
          r().el('div', { class: 'field' }, [r().el('label', { text: 'Cost' }), fields.cost]),
          r().el('div', { class: 'field' }, [
            r().el('label', { text: 'Optional' }),
            r().el('label', { class: 'flex gap' }, [fields.optional, r().el('span', { text: 'Only if the money is there' })]),
          ]),
        ]),
        error,
      ],
      defaultAction: 'save',
      actions: [{ id: 'cancel', label: 'Cancel' }, {
        id: 'save',
        label: 'Add it',
        run: function (settle) {
          if (!fields.item.value.trim()) { error.textContent = 'Say what the line is for.'; return; }
          TP.store.edit('Add a budget line', function (trip) {
            trip.budgetEstimates = trip.budgetEstimates || [];
            var row = {
              id: TP.uid(),
              category: fields.category.value.trim() || 'General',
              item: fields.item.value.trim(),
              optional: !!fields.optional.checked,
            };
            // Cost is optional, so a blank one OMITS the key. Writing `null` instead put a null in a
            // field the wire types as `stringOrNumber`, and the exported trip-data.json was then
            // refused by this app's own validator — an absent field is not a null field (ADR-0018),
            // which is why `setField` above deletes the key for the same case.
            var cost = fields.cost.value.trim();
            if (cost) row.cost = cost;
            trip.budgetEstimates.push(row);
          });
          settle('save');
          TP.ui.shell.renderActive();
        },
      }],
    });
  }

  function editExpense(id) {
    var existing = id ? TP.model.findIn(TP.store.trip().expenses, id) : { date: TP.dates.todayISO(), item: '', category: '', amount: null };
    var fields = {
      date: r().el('input', { class: 'input', type: 'date', value: existing.date || TP.dates.todayISO() }),
      item: r().el('input', { class: 'input', type: 'text', value: existing.item || '' }),
      category: r().el('input', { class: 'input', type: 'text', value: existing.category || '', attrs: { placeholder: 'General' } }),
      amount: r().el('input', { class: 'input', type: 'number', value: existing.amount == null ? '' : existing.amount, attrs: { step: 'any' } }),
    };
    var error = r().el('div', { class: 'subtle mt' });

    return TP.ui.modal.open({
      title: 'Record spending',
      body: [
        r().el('div', { class: 'row' }, [
          r().el('div', { class: 'field' }, [r().el('label', { text: 'When' }), fields.date]),
          r().el('div', { class: 'field' }, [r().el('label', { text: 'Amount' }), fields.amount]),
        ]),
        r().el('div', { class: 'field' }, [r().el('label', { text: 'Item' }), fields.item]),
        r().el('div', { class: 'field' }, [
          r().el('label', { text: 'Category' }), fields.category,
          r().el('div', { class: 'subtle', text: 'Left blank, this is recorded as General — the same default the export uses.' }),
        ]),
        error,
      ],
      defaultAction: 'save',
      actions: [{ id: 'cancel', label: 'Cancel' }, {
        id: 'save',
        label: 'Record it',
        run: function (settle) {
          var amount = fields.amount.value === '' ? null : Number(fields.amount.value);
          if (amount == null || !isFinite(amount)) { error.textContent = 'An amount is needed.'; return; }
          TP.store.edit('Record spending', function (trip) {
            trip.expenses = trip.expenses || [];
            trip.expenses.push({
              id: TP.uid(),
              date: fields.date.value || TP.dates.todayISO(),
              item: fields.item.value.trim(),
              category: fields.category.value.trim() || 'General',
              amount: amount,
            });
          });
          settle('save');
          TP.ui.shell.renderActive();
        },
      }],
    });
  }

  return {
    render: render,
    editEstimate: editEstimate,
    editExpense: editExpense,
    setField: setField,
    removeRow: removeRow,
  };
})();

/* ------------------------------ src/ui/history.js ------------------------------ */
// History: the document's commits, and what can honestly be said about them
// (specs/04-versioning.md §6, REQ-319, REQ-320).
//
// The label this view shows is "chain intact", never "verified". The chain check proves that
// the stored fields hash to the ids they claim and that every parent is present. It does not
// prove the history is what someone originally wrote, and saying "verified" would claim it
// does.

TP.ui.history = (function () {
  'use strict';

  var R = null;
  function r() { R = R || TP.ui.render; return R; }

  var selected = null;

  function render(root) {
    var history = TP.store.history();
    var commits = history.commits || [];
    var chain = TP.verify.chain(history);

    r().append(root, r().el('div', { class: 'card' }, [
      r().el('div', { class: 'card__head' }, [
        r().el('h2', { text: 'History' }),
        r().el('span', { class: 'flex gap' }, [
          r().button('Back to the trip', function () { TP.ui.shell.closeHistory(); }, { class: 'btn btn--sm' }),
        ]),
      ]),
      r().el('div', { class: chain.ok ? 'info' : 'info info--danger' }, [
        r().el('strong', { text: chain.ok ? 'This document’s ' + TP.verify.label(chain) + '.' : 'This document’s history does not hold together.' }),
        chain.ok
          ? r().el('div', { text:
            'Every commit hashes to the id it claims, and every parent it names is present. ' +
            'That is what this check proves, and it is all it proves.' })
          : r().el('div', { text: firstProblem(chain) + ' The document is open read-only, and nothing here can change it.' }),
      ]),
      r().el('dl', { class: 'kv' }, [
        r().el('dt', { text: 'Commits' }), r().el('dd', { text: String(commits.length) }),
        r().el('dt', { text: 'At head' }), r().el('dd', { text: history.head ? TP.verify.shortId(history.head) : 'nothing committed yet' }),
        r().el('dt', { text: 'Keyframe every' }), r().el('dd', { text: TP.format.plural(history.keyframeInterval || TP.history.KEYFRAME_INTERVAL, 'commit') }),
        r().el('dt', { text: 'Keyframes' }), r().el('dd', { text: TP.format.plural(TP.history.countKeyframes(history), 'keyframe') }),
      ]),
    ]));

    if (!commits.length) {
      r().append(root, r().el('div', { class: 'empty' }, [
        r().el('h2', { text: 'Nothing is committed yet' }),
        r().el('p', { text: 'The first change you make creates the document’s first commit.' }),
      ]));
      return;
    }

    r().append(root, commitList(commits, history));
    if (selected) r().append(root, detailCard(selected, history));
  }

  function commitList(commits, history) {
    var ordered = commits.slice().sort(function (a, b) {
      return String(b.timestamp || '').localeCompare(String(a.timestamp || ''));
    });

    var card = r().el('div', { class: 'card' }, [
      r().el('div', { class: 'card__head' }, [
        r().el('h2', { text: 'Commits' }),
        r().el('span', { class: 'subtle', text: 'Newest first' }),
      ]),
    ]);

    ordered.forEach(function (commit) {
      var isHead = commit.id === history.head;
      var distance = TP.history.distanceSinceKeyframe(history, commit.id);
      var isKeyframe = distance != null && distance === 0;
      var row = r().el('div', { class: 'cl-item items-start' }, [
        r().el('div', { class: 'flex-1' }, [
          r().el('div', {}, [
            r().el('strong', { text: commit.message || 'Edit' }),
            isHead ? r().el('span', { class: 'badge badge--done', text: 'current' }) : null,
            isKeyframe ? r().el('span', { class: 'badge badge--optional', text: 'keyframe' }) : null,
            (commit.parents || []).length > 1 ? r().el('span', { class: 'badge badge--med', text: 'merge' }) : null,
          ]),
          r().el('div', { class: 'subtle', text: when(commit.timestamp) + ' · ' + authorOf(commit) + ' · ' + TP.verify.shortId(commit.id) }),
          r().el('div', { class: 'subtle', text: storageKind(commit) }),
        ]),
        r().el('span', { class: 'flex gap' }, [
          r().button('Details', function () { inspect(commit.id); }, { class: 'btn btn--ghost btn--sm' }),
          isHead ? null : r().button('Revert to this', function () { revert(commit.id); }, { class: 'btn btn--ghost btn--sm' }),
        ]),
      ]);
      r().append(card, row);
    });

    return card;
  }

  function storageKind(commit) {
    var bits = [];
    if (commit.snapshot) bits.push('holds a full copy');
    if (commit.delta) bits.push(TP.format.plural((commit.delta || []).length, 'change'));
    if (!commit.snapshot && !commit.delta) bits.push('inherits its parent’s content');
    bits.push((commit.parents || []).length === 0 ? 'no parent' : TP.format.plural((commit.parents || []).length, 'parent'));
    return bits.join(' · ');
  }

  function authorOf(commit) {
    var a = commit.author;
    if (!a) return 'unknown';
    return a.name || a.email || 'unknown';
  }

  // The chain check reports a list of problems; the first one is the one worth naming, because
  // a single altered commit usually produces several complaints downstream of it.
