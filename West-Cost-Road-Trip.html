<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- 1. Policy first: it must precede every script it governs (REQ-105). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-JsWGJlpmk5ug2FXki6K2ZCVVVtkCnMeZSEgZ0SyBTH8='; style-src 'sha256-i0iBML5rby1eGUC4yr+xylutfN2RfJoNd337v5gGsdk='; img-src data:; connect-src https://ollama.com http://localhost:11434 https://esm.run https://cdn.jsdelivr.net https://huggingface.co https://raw.githubusercontent.com; form-action 'none'; base-uri 'none'; frame-ancestors 'none';">

  <title>Trip Planner — New trip</title>
  <meta name="app-version" content="0.2.0">
  <meta name="app-hash" content="sha256-JsWGJlpmk5ug2FXki6K2ZCVVVtkCnMeZSEgZ0SyBTH8=">

  <!-- 2. The stylesheet, inlined. styles/main.css stays the authored source (REQ-610, REQ-113). -->
  <style>:root {
  --bg: #f6f7f9;
  --panel: #ffffff;
  --border: #e3e6ea;
  --text: #1f2430;
  --muted: #6b7280;
  --primary: #2563eb;
  --primary-hover: #1d4ed8;
  --danger: #dc2626;
  --ok: #059669;
  --warn: #b45309;
  --chip: #eef2ff;
  --chip-text: #3730a3;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  color: var(--text);
  background: var(--bg);
}

.app { display: grid; grid-template-columns: 280px 1fr; height: 100vh; height: 100dvh; }

/* Sidebar */
.sidebar {
  display: flex; flex-direction: column;
  background: var(--panel); border-right: 1px solid var(--border);
  min-height: 0;
}
.sidebar__head { padding: 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
.brand { margin: 0; font-size: 16px; font-weight: 600; }
.sidebar__list { flex: 1; overflow: auto; padding: 8px; }
.sidebar__foot { padding: 10px 16px; border-top: 1px solid var(--border); }
.muted { color: var(--muted); font-size: 12px; }

.trip-item {
  display: block; width: 100%; text-align: left; cursor: pointer;
  padding: 10px 12px; border: 1px solid transparent; border-radius: 8px;
  background: none; color: inherit; margin-bottom: 4px;
}
.trip-item:hover { background: var(--bg); }
.trip-item--active { background: var(--chip); border-color: #c7d2fe; color: var(--chip-text); }
/* An index row whose local copy this browser does not have. Dimmed, not hidden and not removed:
   the name is still a real reminder that the file exists (REQ-405, REQ-406). */
.trip-item--absent { border-style: dashed; border-color: var(--border); }
.trip-item--absent .trip-item__title { font-weight: 500; color: var(--muted); }
.trip-item__title { font-weight: 600; }
.trip-item__meta { font-size: 12px; color: var(--muted); }

/* Main + tabs */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.mobile-bar { display: none; }
.drawer-backdrop { display: none; }
.tabs { display: flex; gap: 2px; padding: 8px 12px 0; background: var(--panel); border-bottom: 1px solid var(--border); }
.tab {
  appearance: none; border: none; background: none; cursor: pointer;
  padding: 8px 14px; border-radius: 8px 8px 0 0; color: var(--muted); font: inherit; font-weight: 600;
}
.tab:hover { color: var(--text); }
.tab--active { color: var(--primary); box-shadow: inset 0 -2px 0 var(--primary); }
.tab-panel { flex: 1; overflow: auto; padding: 20px; min-height: 0; }
/* The toolbar sits between the tabs and the panel, so it must not flex and must not scroll with
   the panel. `flex: 0 0 auto` keeps its height at whatever its buttons need. */
.toolbar {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--border);
  flex: 0 0 auto;
}

/* Forms */
.input, select, textarea {
  width: 100%; padding: 8px 10px; border: 1px solid var(--border);
  border-radius: 8px; font: inherit; background: #fff; color: var(--text);
}
.input:focus, select:focus, textarea:focus { outline: 2px solid #bcd2ff; border-color: var(--primary); }
label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 4px; font-weight: 600; }
.field { margin-bottom: 14px; }
/* A label that is a sibling element rather than a wrapping <label>, used where the control is
   built separately and the association is made with an id. */
.field-label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 4px; font-weight: 600; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }

.btn {
  appearance: none; border: 1px solid var(--border); background: #fff; color: var(--text);
  padding: 8px 14px; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer;
}
.btn:hover { border-color: #c4c9d0; }
.btn--primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn--primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn--danger { color: var(--danger); border-color: #f3c8c8; }
.btn--ghost { background: none; border: none; color: var(--muted); padding: 2px 6px; }
.btn--ghost:hover { color: var(--text); background: var(--bg); }
.btn--block { width: 100%; }
.btn--sm { padding: 4px 10px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* Cards */
.card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); margin-bottom: 16px; }
.card__head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
.card__head h2 { margin: 0; font-size: 15px; }
.subtle { color: var(--muted); font-size: 12px; }

.empty { text-align: center; color: var(--muted); padding: 48px 16px; }
.empty h2 { color: var(--text); font-size: 16px; }

/* Itinerary */
.day { margin-bottom: 16px; }
.day__head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.day__date { font-weight: 700; }
.item { display: grid; grid-template-columns: 90px 1fr auto; gap: 10px; align-items: start; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; background: #fff; }
.item__time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
.item__title { font-weight: 600; }
.item__meta { font-size: 12px; color: var(--muted); }
.tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
.tag--activity { background: #e0f2fe; color: #075985; }
.tag--transport { background: #fef3c7; color: #92400e; }
.tag--lodging { background: #ede9fe; color: #5b21b6; }
.tag--note { background: #f1f5f9; color: #475569; }

/* Budget */
.bar { height: 10px; background: #eef0f3; border-radius: 999px; overflow: hidden; margin: 6px 0; }
.bar__fill { height: 100%; background: var(--primary); }
.bar__fill--over { background: var(--danger); }
.stat { font-size: 24px; font-weight: 700; }
table.data { width: 100%; border-collapse: collapse; }
table.data th, table.data td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 13px; }
table.data th { color: var(--muted); font-weight: 600; }

/* AI panel */
.ai { display: grid; grid-template-rows: auto 1fr auto; height: 100%; gap: 12px; }
.ai__head { display: flex; gap: 8px; flex-wrap: wrap; }
.ai__transcript { overflow: auto; padding: 8px 4px; }
.msg { margin-bottom: 12px; max-width: 80%; }
.msg--user { margin-left: auto; }
.bubble { padding: 10px 12px; border-radius: 12px; background: #fff; border: 1px solid var(--border); }
.msg--user .bubble { background: var(--primary); color: #fff; border-color: var(--primary); }
.msg--assistant .bubble { background: #fff; }
.msg__role { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
.bubble p { margin: 0 0 8px; }
.bubble p:last-child { margin-bottom: 0; }
.bubble a { color: inherit; }
/* A heading inside an assistant message. Markdown headings are parsed to nodes (REQ-701), so
   this is the h3 the parser emits rather than a real document section. */
.md__head { font-size: 14px; margin: 12px 0 6px; }
.md__head:first-child { margin-top: 0; }
.toolline { font-size: 12px; color: var(--muted); font-family: var(--mono); padding: 2px 8px; border-left: 3px solid var(--chip); margin: 4px 0 4px 12px; }
.toolline cite { display: block; font-style: normal; }
/* A line of the transcript that is the app talking to itself — how many steps were taken, what
   was left out. Quieter than a message from either party. */
.toolline--note { border-left-color: var(--border); font-style: italic; }
/* A standing note at the top of the panel: the mode, and what it does and does not send. */
.ai__note { font-size: 12px; color: var(--muted); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
.ai__composer { display: flex; gap: 8px; }
.ai__composer textarea { resize: vertical; min-height: 48px; }

/* Settings */
.info { background: #f0f9ff; border: 1px solid #bae6fd; color: #075985; border-radius: 8px; padding: 10px 12px; font-size: 13px; margin: 8px 0 16px; }
.info code { background: #e0f2fe; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
.info--warn { background: #fffbeb; border-color: #fde68a; color: var(--warn); }
.info--danger { background: #fef2f2; border-color: #fecaca; color: var(--danger); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; }
.kv dt { color: var(--muted); }

/* Toasts */
.toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 50; max-width: 420px; }
.toast { padding: 12px 14px; border-radius: 8px; background: #1f2430; color: #fff; box-shadow: var(--shadow); font-size: 13px; }
.toast--error { background: var(--danger); }
.toast--ok { background: var(--ok); }
.toast--warn { background: var(--warn); }
/* A toast's action button, e.g. "Undo". It sits on a coloured toast, so it is outlined in the
   toast's own text colour rather than using the panel-white .btn default, which would look like
   a hole punched in the message. */
.toast__action .btn { background: transparent; border-color: currentColor; color: inherit; }

/* Modal */
/* `hidden` must always win over any display rule, or overlays like .modal-host
   cover the page and swallow every click. */
[hidden] { display: none !important; }

.modal-host { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: grid; place-items: center; z-index: 40; }
.modal { background: #fff; border-radius: 12px; padding: 20px; width: min(520px, 92vw); max-height: 88vh; overflow: auto; box-shadow: var(--shadow); }
.modal h3 { margin: 0 0 12px; }
.modal__body > *:first-child { margin-top: 0; }
.modal__body > *:last-child { margin-bottom: 0; }
.modal__body p { margin: 0 0 10px; }
.modal__actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

.flex { display: flex; }
.flex--between { justify-content: space-between; align-items: center; }
.gap { gap: 8px; }
.wrap { flex-wrap: wrap; }
.mt { margin-top: 12px; }
.mb0 { margin-bottom: 0; }
hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

/* Checklists */
.cl-item { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 6px; }
.cl-item:hover { background: var(--bg); }
.cl-item input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
.cl-text { flex: 1; }
.cl-text--done { text-decoration: line-through; color: var(--muted); }

/* Priority badges */
.badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
.badge--high { background: #fef2f2; color: var(--danger); }
.badge--med { background: #fffbeb; color: var(--warn); }
.badge--low { background: #f1f5f9; color: #475569; }
.badge--done { background: #ecfdf5; color: var(--ok); }
.badge--optional { background: var(--chip); color: var(--chip-text); }
.overdue { color: var(--danger); font-weight: 600; }

/* Bucket chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--chip); color: var(--chip-text); border: 1px solid #c7d2fe; border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.chip button { background: none; border: none; color: inherit; cursor: pointer; font-size: 14px; line-height: 1; padding: 0; }

/* Location cards */
.loc__activities { margin-top: 10px; padding-left: 14px; border-left: 3px solid var(--chip); }
.loc__act { display: flex; align-items: baseline; gap: 8px; padding: 4px 0; }
.loc__act-type { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }

/* Inline editable rows (collection tables) */
.inline-edit { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.inline-edit .input { flex: 1; min-width: 120px; }
.compact td .input { width: 100%; }
.sublist { list-style: none; padding: 0; margin: 6px 0 0; }
.sublist li { padding: 2px 0; font-size: 13px; color: var(--muted); }
.sublist li::before { content: "• "; color: var(--border); }

/* ---------- Responsive: tablets and phones ---------- */

/* Layout utilities
   ----------------------------------------------------------------------------------------
   Every one of these replaces an inline `style="..."` that the earlier markup carried. The
   artifact pins `style-src` to the stylesheet's own hash, and a hash-pinned policy blocks
   inline style attributes — in the shell markup and in anything a view sets with
   setAttribute. CSSOM assignment is not covered by that policy, which is why the one
   genuinely computed value (the budget bar's width) is set that way and the rest are classes
   here. Each rule is a faithful single-property translation of the attribute it replaces. */
.flex-1 { flex: 1; }
.ml-auto { margin-left: auto; }
.items-start { align-items: flex-start; }
.mb { margin-bottom: 10px; }
.mb-sm { margin-bottom: 8px; }
.sect-sep { border-top: 1px solid var(--border); padding-top: 12px; margin-top: 12px; }

@media (max-width: 820px) {
  /* Sidebar becomes an off-canvas drawer; the app stacks to a single column. */
  .app { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed; top: 0; bottom: 0; left: 0;
    width: min(320px, 85vw);
    z-index: 60;
    transform: translateX(-105%);
    transition: transform .25s ease;
    box-shadow: var(--shadow);
  }
  .app--drawer-open .sidebar { transform: none; }
  .drawer-backdrop {
    display: block; position: fixed; inset: 0;
    background: rgba(0,0,0,.4); z-index: 55;
  }

  /* Mobile top bar with the drawer toggle. */
  .mobile-bar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .mobile-bar .brand { font-size: 15px; }

  /* Tabs scroll horizontally instead of overflowing. */
  .tabs { overflow-x: auto; padding: 6px 8px 0; -webkit-overflow-scrolling: touch; }
  .tab { flex: 0 0 auto; white-space: nowrap; padding: 10px 12px; }
  .tab-panel { padding: 12px; }

  .card__head { flex-wrap: wrap; }
  .toasts { left: 12px; right: 12px; max-width: none; }
  .modal { padding: 16px; }
}

@media (max-width: 640px) {
  /* 16px inputs prevent iOS Safari's focus zoom. */
  .input, select, textarea { font-size: 16px; }

  /* Stack itinerary rows: time, then content, then actions. */
  .item { grid-template-columns: 1fr; gap: 4px; }
  .item__time { font-size: 12px; }

  .kv { grid-template-columns: 1fr; }
  .kv dt { margin-top: 6px; }
  .msg { max-width: 92%; }
  .ai__composer { flex-direction: column; }

  /* Wide data tables scroll inside their card rather than the page. */
  table.data { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
}</style>
</head>
<body>

  <!-- 3. Shell markup: static. -->
  <div id="app" class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__head">
        <h1 class="brand">🗺️ Trip Planner</h1>
        <div class="flex gap">
          <button class="btn btn--primary flex-1" id="new-trip-btn">+ New Trip</button>
          <button class="btn" id="import-btn" title="Open a planner document, trip-data.json, or a calendar file">⬆ Import</button>
        </div>
        <input type="search" id="trip-search" class="input" placeholder="Search documents…">
        <input type="file" id="import-file" accept=".html,.htm,.json,.ics,text/html,application/json,text/calendar" hidden="">
      </div>
      <nav class="sidebar__list" id="trip-list" aria-label="Documents"></nav>
      <div class="sidebar__foot">
        <span id="storage-status" class="muted">Starting…</span>
      </div>
    </aside>

    <main class="main">
      <!-- Mobile-only bar; the sidebar becomes an off-canvas drawer on small screens. -->
      <div class="mobile-bar">
        <button class="btn" id="menu-btn" aria-label="Open documents menu" aria-expanded="false">☰ Documents</button>
        <span class="brand">🗺️ Trip Planner</span>
      </div>

      <nav class="tabs" id="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="itinerary" aria-selected="true">Itinerary</button>
        <button class="tab" role="tab" data-tab="checklists" aria-selected="false">Checklists</button>
        <button class="tab" role="tab" data-tab="lodging" aria-selected="false">Lodging</button>
        <button class="tab" role="tab" data-tab="bookings" aria-selected="false">Bookings</button>
        <button class="tab" role="tab" data-tab="places" aria-selected="false">Places</button>
        <button class="tab" role="tab" data-tab="charging" aria-selected="false" hidden="">Charging</button>
        <button class="tab" role="tab" data-tab="budget" aria-selected="false">Budget</button>
        <!-- Shipped hidden as well as filtered by the shell: under `file://` the tab is not
             offered at all, and the markup says so before any script runs (REQ-603, REQ-604). -->
        <button class="tab" role="tab" data-tab="ai" aria-selected="false" hidden="">AI Planner</button>
        <button class="tab" role="tab" data-tab="settings" aria-selected="false">Settings</button>
      </nav>

      <!-- Why the AI tab is absent, where a user would look for it (REQ-605). Filled by the shell. -->
      <div id="mode-note" hidden=""></div>
      <!-- What this browser can and cannot keep. Filled by the shell. -->
      <div id="persistence-note" hidden=""></div>

      <div class="toolbar" id="toolbar">
        <button class="btn btn--sm" id="undo-btn" title="Undo (Ctrl/Cmd+Z)">Undo</button>
        <button class="btn btn--sm" id="redo-btn" title="Redo (Ctrl/Cmd+Shift+Z)">Redo</button>
        <button class="btn btn--sm" id="history-btn" title="Commits, revert, compaction">History</button>
        <span class="flex gap ml-auto">
          <span id="save-status" class="subtle" role="status" aria-live="polite"></span>
          <button class="btn btn--sm btn--primary" id="export-btn">Export</button>
        </span>
      </div>

      <section class="tab-panel" id="panel-itinerary"></section>
      <section class="tab-panel" id="panel-checklists" hidden=""></section>
      <section class="tab-panel" id="panel-lodging" hidden=""></section>
      <section class="tab-panel" id="panel-bookings" hidden=""></section>
      <section class="tab-panel" id="panel-places" hidden=""></section>
      <section class="tab-panel" id="panel-charging" hidden=""></section>
      <section class="tab-panel" id="panel-budget" hidden=""></section>
      <section class="tab-panel" id="panel-ai" hidden=""></section>
      <section class="tab-panel" id="panel-settings" hidden=""></section>
      <section class="tab-panel" id="panel-history" hidden=""></section>
    </main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <!-- Click-away backdrop for the mobile sidebar drawer. -->
  <div class="drawer-backdrop" id="drawer-backdrop" hidden=""></div>

  <div class="modal-host" id="modal-host" hidden=""></div>

  <!-- 4. The container: payload + history + build metadata. Inert data (REQ-104, REQ-209). -->

      "keyTips": [
        "Plan every day around a 6:20-6:40pm sunset. Coastal fog and drizzle are normal in October, so the morning is your friend: front-load the scenic pullouts and keep the evenings for towns and food.",
        "Use US-101/CA-1 going north and I-5 coming home. Same roads both ways means you see the coast once and cover ground the second time.",
        "The R1T's 230-mile usable range is fine for this route as long as you charge overnight at every hotel and treat the Big Sur and Redwood Coast legs as range-critical. The failure mode on this trip is not running out — it is arriving at a single-stall charger that is broken. Always leave a leg with 20%+ buffer.",
        "Vintage shopping is best in the mornings before noon: Portland's Hawthorne shops, Eureka Old Town and the Haight both open 10-11am and the good pieces go early.",
        "Carry cash for Swan Oyster Depot in SF (cash only), most Eureka/Portland antique dealers and small coastal cafes on the Oregon coast."
      ],

            "keyTips": [
              "Plan every day around a 6:20-6:40pm sunset. Coastal fog and drizzle are normal in October, so the morning is your friend: front-load the scenic pullouts and keep the evenings for towns and food.",
              "Use US-101/CA-1 going north and I-5 coming home. Same roads both ways means you see the coast once and cover ground the second time.",
              "The R1T's 230-mile usable range is fine for this route as long as you charge overnight at every hotel and treat the Big Sur and Redwood Coast legs as range-critical. The failure mode on this trip is not running out — it is arriving at a single-stall charger that is broken. Always leave a leg with 20%+ buffer.",
              "Vintage shopping is best in the mornings before noon: Portland's Hawthorne shops, Eureka Old Town and the Haight both open 10-11am and the good pieces go early.",
              "Carry cash for Swan Oyster Depot in SF (cash only), most Eureka/Portland antique dealers and small coastal cafes on the Oregon coast."
            ],

    return 'sha256:' + TP.sha256.hex(serialize(value));
  }

  return { serialize: serialize, hash: hash, numToString: numToString };
})();

/* ------------------------------ src/utils/id.js ------------------------------ */
// Identity generation (03-data-model.md §3). Unchanged from the present app: identity
// generation is not security-sensitive and the fallback path already covers `file://`,
// where crypto.randomUUID is not guaranteed to exist.

TP.uid = function uid() {
  try {
    if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
      return crypto.randomUUID();
    }
  } catch (e) { /* fall through */ }
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
};

/* ------------------------------ src/utils/dates.js ------------------------------ */
// Date helpers. Pure. Day ids are derived from their date so that re-expanding a trip's
// date range preserves items by date (03-data-model.md §3).

TP.dates = (function () {
  'use strict';

  function todayISO() {
    var d = new Date();
    return toISO(d);
  }

  function toISO(d) {
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }

  // Parsed as a local calendar date, never as UTC: an itinerary day is a calendar day.
  function parseISO(s) {
    if (!s) return null;
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s));
    if (!m) return null;
    var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    if (isNaN(d.getTime())) return null;
    return d;
  }

  function addDays(d, n) {
    var c = new Date(d.getTime());
    c.setDate(c.getDate() + n);
    return c;
  }

  function daysBetween(aISO, bISO) {
    var a = parseISO(aISO), b = parseISO(bISO);
    if (!a || !b) return 0;
    return Math.round((b - a) / 86400000);
  }

  function dayCount(startISO, endISO) {
    if (!startISO || !endISO) return 0;
    var n = daysBetween(startISO, endISO) + 1;
    return n > 0 ? n : 0;
  }

  // Expand [start, end] into Day entities. The id encodes the index and the date, so it is
  // stable across a re-expansion as long as the date is preserved.
  function expandDays(startISO, endISO, maxDays) {
    var out = [];
    var start = parseISO(startISO);
    var end = parseISO(endISO);
    if (!start || !end) return out;
    var n = daysBetween(startISO, endISO) + 1;
    var cap = typeof maxDays === 'number' ? maxDays : 400;
    if (n > cap) n = cap;
    for (var i = 0; i < n; i++) {
      var date = toISO(addDays(start, i));
      out.push({ id: 'day-' + i + '-' + date, date: date, items: [] });
    }
    return out;
  }

  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

  function fmtDate(iso) {
    var d = parseISO(iso);
    if (!d) return iso || '';
    return MONTHS[d.getMonth()] + ' ' + d.getDate();
  }

  function fmtDateLong(iso) {
    var d = parseISO(iso);
    if (!d) return iso || '';
    return WEEKDAYS[d.getDay()] + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
  }

  return {
    todayISO: todayISO,
    toISO: toISO,
    parseISO: parseISO,
    addDays: addDays,
    daysBetween: daysBetween,
    dayCount: dayCount,
    expandDays: expandDays,
    fmtDate: fmtDate,
    fmtDateLong: fmtDateLong,
  };
})();

/* ------------------------------ src/utils/format.js ------------------------------ */
// Formatting helpers. Pure string/number work — nothing here touches the DOM.
//
// The present app's `escapeHTML` and `renderMarkdown`-returning-a-string are gone: the render
// seam (ui/render.js) is the only path from data to DOM (REQ-701), so a formatter that
// produced markup would be a second one.

TP.format = (function () {
  'use strict';

  function fmtMoney(amount, currency) {
    var n = Number(amount);
    if (!isFinite(n)) n = 0;
    try {
      return new Intl.NumberFormat(undefined, {
        style: 'currency',
        currency: currency || 'USD',
        maximumFractionDigits: 2,
      }).format(n);
    } catch (e) {
      return (currency || 'USD') + ' ' + n.toFixed(2);
    }
  }

  function fmtNumber(n, digits) {
    var v = Number(n);
    if (!isFinite(v)) v = 0;
    try {
      return new Intl.NumberFormat(undefined, { maximumFractionDigits: digits == null ? 2 : digits }).format(v);
    } catch (e) {
      return String(v);
    }
  }

  function truncate(s, n) {
    var str = s == null ? '' : String(s);
    if (!n || str.length <= n) return str;
    return str.slice(0, n - 1) + '…';
  }

  // The one place a free-text cost string becomes a number. Shared by the model, the
  // interchange mappers and the budget roll-up so they cannot disagree.
  function parseCost(s) {
    if (s == null) return undefined;
    if (typeof s === 'number') return isFinite(s) ? s : undefined;
    var m = String(s).match(/\$?\s*([\d,]+(?:\.\d+)?)/);
    if (!m) return undefined;
    var n = parseFloat(m[1].replace(/,/g, ''));
    return isFinite(n) ? n : undefined;
  }

  // URL-valued fields are validated against a scheme allowlist (REQ-704).
  var ALLOWED_SCHEMES = ['http:', 'https:', 'mailto:'];

  function safeUrl(raw) {
    var s = raw == null ? '' : String(raw).trim();
    if (!s) return null;
    // Reject anything that is not an absolute URL with an allowed scheme. A relative URL has
    // no scheme and is rejected too: every link this app renders is absolute.
    var m = /^([a-zA-Z][a-zA-Z0-9+.-]*):/.exec(s);
    if (!m) return null;
    var scheme = m[1].toLowerCase() + ':';
    if (ALLOWED_SCHEMES.indexOf(scheme) === -1) return null;
    return s;
  }

  // A link label that might itself be a URL: only returns a URL when it is a safe one.
  function linkifyTarget(raw) {
    var s = raw == null ? '' : String(raw).trim();
    if (!s) return null;
    if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(s)) return safeUrl(s);
    if (/^www\./i.test(s)) return safeUrl('https://' + s);
    return null;
  }

  function plural(n, one, many) {
    return n + ' ' + (n === 1 ? one : (many || one + 's'));
  }

  return {
    fmtMoney: fmtMoney,
    fmtNumber: fmtNumber,
    truncate: truncate,
    parseCost: parseCost,
    safeUrl: safeUrl,
    linkifyTarget: linkifyTarget,
    plural: plural,
    ALLOWED_SCHEMES: ALLOWED_SCHEMES,
  };
})();

/* ------------------------------ src/core/container.js ------------------------------ */
// The container codec seam (specs/02-architecture.md §2, §5).
//
// Nothing else reads or writes `#app-data`, and nothing else knows the escaping rule. That is
// the point of the seam: the one place where a change in the embedding format has to happen.

TP.container = (function () {
  'use strict';

  var SCHEMA = 'https://trip-planner.invalid/schemas/container-1.0.0.schema.json';
  var FORMAT = '1.0.0';
  var BLOCK_ID = 'app-data';

  // Resource guards (REQ-517). Every one of them fails with an explanation naming the limit
  // and the actual value, and offers to export what was readable — never a blank page
  // (REQ-518).
  //
  // `maxSourceChars` bounds the WHOLE FILE a user hands to Import, and it has to sit above the
  // largest file this app can write. A document carries its own program — ~430 KB of it — plus a
  // data block that `maxBytes` allows to reach 16 MB, so the largest file this app produces is
  // under 17 MB. A limit below that made the app refuse its own exports, which is the one file it
  // must always be able to read back (REQ-404). The cap is therefore set at twice that: 32 M
  // characters, high enough for any document it can write and low enough to refuse a file that
  // was never one.
  var LIMITS = {
    maxBytes: 16 * 1024 * 1024,
    maxCommits: 20000,
    maxPatchOps: 200000,
    maxDepth: 64,
    maxSourceChars: 32 * 1024 * 1024,
  };

  function GuardError(message) { this.name = 'GuardError'; this.message = message; }
  GuardError.prototype = Object.create(Error.prototype);

  // ---- Escaping ----
  //
  // The sequence `<\/script` anywhere in the JSON would end the block early and turn the rest
  // of the payload into markup. (Every occurrence of that sequence in these sources is written
  // with the backslash, because the literal one would end the INLINE script in the artifact —
  // see build.js.) Escaping every `<` as \u003c is safe: inside a JSON string it denotes the
  // same character, and outside a string `<` cannot appear in valid JSON.

  function escapeForScriptBlock(jsonText) {
    return String(jsonText)
      .replace(/</g, '\\u003c')
      .replace(/\u2028/g, '\\u2028')
      .replace(/\u2029/g, '\\u2029');
  }

  // ---- Null-prototype reconstruction (REQ-503) ----
  //
  // JSON.parse produces objects with Object.prototype, so a key named `__proto__` in a
  // hostile file is a prototype-pollution primitive the moment anything merges over it.
  // Every parsed object becomes null-prototype, and depth is bounded while we walk.

  function nullProto(value, depth, limit) {
    var d = depth || 0;
    if (d > limit) {
      throw new GuardError('The file nests deeper than ' + limit + ' levels (found at least ' + d +
        '). It may be malformed or hostile; nothing was loaded.');
    }
    if (value === null || typeof value !== 'object') return value;
    if (Array.isArray(value)) {
      var arr = [];
      for (var i = 0; i < value.length; i++) arr.push(nullProto(value[i], d + 1, limit));
      return arr;
    }
    var out = Object.create(null);
    for (var k in value) {
      if (Object.prototype.hasOwnProperty.call(value, k)) {
        out[k] = nullProto(value[k], d + 1, limit);
      }
    }
    return out;
  }

  function parseJSONHardened(text, context) {
    var value;
    try {
      value = JSON.parse(text);
    } catch (e) {
      throw new GuardError('The ' + context + ' is not valid JSON: ' + e.message);
    }
    return nullProto(value, 0, LIMITS.maxDepth);
  }

  // ---- Locating the block by string scanning (REQ-502) ----
  //
  // Never a DOM parser: the file being read is untrusted, and a DOM parse builds a document
  // from hostile markup (06-interchange.md §5.1). We look for the marker, take the text after
  // the first `>` that closes the tag, and read up to the next `<\/script`.
  //
  // The marker is deliberately the id attribute alone. A hostile file could write
  // `<script type="text/plain" id="app-data">`, and it would still be found — which is
  // correct: we are reading text, and every script element's content is raw text.

  function scanBlock(source) {
    var src = String(source == null ? '' : source);
    var marker = 'id="' + BLOCK_ID + '"';
    var altMarker = "id='" + BLOCK_ID + "'";
    var at = src.indexOf(marker);
    if (at === -1) at = src.indexOf(altMarker);
    if (at === -1) return null;
    var open = src.indexOf('>', at);
    if (open === -1) return null;
    // Split rather than written whole: the literal would terminate the artifact's own inline
    // script element, which the HTML parser ends at the first occurrence of that sequence.
    var close = src.indexOf('<' + '/script', open);
    if (close === -1) return null;
    return src.slice(open + 1, close);
  }

  function parseBlock(text) {
    var raw = String(text == null ? '' : text);
    // Char count is a lower bound on byte count, so this is the cheap conservative check.
    if (raw.length > LIMITS.maxBytes) {
      throw new GuardError('The data block is ' + raw.length + ' characters, beyond the ' +
        LIMITS.maxBytes + '-byte ceiling this app will load.');
    }
    return parseJSONHardened(raw, 'data block');
  }

  // ---- The running document ----
  //
  // For the running artifact the block is read from our own document. It is still the same
  // text the HTML parser produced — nothing here parses markup, and the untrusted path
  // (import) goes through scanBlock over the file's text instead.

  function readRaw() {
    var el = document.getElementById(BLOCK_ID);
    if (!el) return null;
    return el.textContent;
  }

  function read() {
    var raw = readRaw();
    if (raw == null) {
      throw new GuardError('This file has no data block (no element with id="' + BLOCK_ID + '").');
    }
    var container = parseBlock(raw);
    return validate(container);
  }

  // ---- Envelope ----

  function create(payload, build, history) {
    return {
      $schema: SCHEMA,
      format: FORMAT,
      payload: payload,
      history: history || { keyframeInterval: 20, head: null, commits: [] },
      build: build || { appVersion: '0.0.0', appHash: '', generatedAt: new Date().toISOString() },
    };
  }

  function validate(container) {
    if (!container || typeof container !== 'object') {
      throw new GuardError('The data block does not contain a container object.');
    }
    if (typeof container.format !== 'string') {
      throw new GuardError('The container has no `format` field, so this app cannot tell whether it can read it.');
    }
    if (!container.payload || typeof container.payload !== 'object') {
      throw new GuardError('The container has no `payload`.');
    }
    var h = container.history;
    if (!h || typeof h !== 'object') {
      throw new GuardError('The container has no `history`.');
    }
    if (!Array.isArray(h.commits)) {
      throw new GuardError('The container’s `history.commits` is not a list.');
    }
    if (h.commits.length > LIMITS.maxCommits) {
      throw new GuardError('The container holds ' + h.commits.length + ' commits, beyond the ' +
        LIMITS.maxCommits + ' this app will load.');
    }
    if (typeof h.keyframeInterval !== 'number' || !(h.keyframeInterval >= 1)) {
      h.keyframeInterval = 20;
    }
    return container;
  }

  // A container whose `format` is newer than the app's is opened read-only, with an
  // explanation (REQ-212). The app never guesses at a format's semantics — a guess that
  // parses is a guess that gets written back.
  function compareFormat(a, b) {
    var pa = String(a || '').split('.').map(function (x) { return parseInt(x, 10) || 0; });
    var pb = String(b || '').split('.').map(function (x) { return parseInt(x, 10) || 0; });
    for (var i = 0; i < 3; i++) {
      if ((pa[i] || 0) !== (pb[i] || 0)) return (pa[i] || 0) < (pb[i] || 0) ? -1 : 1;
    }
    return 0;
  }

  function isReadableFormat(format) {
    return compareFormat(format, FORMAT) <= 0;
  }

  // ---- Serialization ----
  //
  // The container as it appears in the file is pretty-printed: the whole premise of the
  // pattern is that a person can open the file and read it. Hashing uses
  // TP.canonical.serialize over the payload, never this.

  function serialize(container) {
    return JSON.stringify(container, null, 2);
  }

  function toBlockText(container) {
    return escapeForScriptBlock(serialize(container));
  }

  function payloadTrip(container) {
    var p = container && container.payload;
    return p && p.trip ? p.trip : null;
  }

  function commits(container) {
    return (container && container.history && container.history.commits) || [];
  }

  return {
    SCHEMA: SCHEMA,
    FORMAT: FORMAT,
    BLOCK_ID: BLOCK_ID,
    LIMITS: LIMITS,
    GuardError: GuardError,
    escapeForScriptBlock: escapeForScriptBlock,
    nullProto: nullProto,
    parseJSONHardened: parseJSONHardened,
    scanBlock: scanBlock,
    parseBlock: parseBlock,
    readRaw: readRaw,
    read: read,
    create: create,
    validate: validate,
    compareFormat: compareFormat,
    isReadableFormat: isReadableFormat,
    serialize: serialize,
    toBlockText: toBlockText,
    payloadTrip: payloadTrip,
    commits: commits,
  };
})();

/* ------------------------------ src/core/patch.js ------------------------------ */
// The patch format and its application (04-versioning.md §4.1).
//
//   [ { op: 'replace', path: ['days', 2, 'items', 0, 'title'], value: '…' },
//     { op: 'add',     path: ['days', 2, 'items', 1],          value: { … } },
//     { op: 'remove',  path: ['expenses', 4] } ]
//
// `path` is an ARRAY OF SEGMENTS, not a JSON Pointer string. Two reasons, both about
// validation: array segments make bounds checking direct, and rejecting a `__proto__` /
// `constructor` / `prototype` segment is a comparison rather than a string-parse of an
// escaped pointer (REQ-705).

TP.patch = (function () {
  'use strict';

  var FORBIDDEN = ['__proto__', 'constructor', 'prototype'];
  var OPS = ['replace', 'add', 'remove'];
  var MAX_PATH = 64;

  function isForbidden(segment) {
    return typeof segment === 'string' && FORBIDDEN.indexOf(segment) !== -1;
  }

  // An empty path means the whole document. Only a `replace` may name it: there is no parent to add
  // a root into or remove it from. This case is reachable because `diff` emits it — replacing an
  // array of a different length, or any root whose type changed, is one operation at path [] — and a
  // patch the app can produce must be a patch the app can apply.
  function validatePath(path, allowEmpty) {
    if (!Array.isArray(path)) return 'path is not a list of segments';
    if (path.length === 0) return allowEmpty ? null : 'path is empty';
    if (path.length > MAX_PATH) return 'path has ' + path.length + ' segments, beyond the ' + MAX_PATH + ' this app will walk';
    for (var i = 0; i < path.length; i++) {
      var s = path[i];
      if (typeof s === 'string') {
        if (isForbidden(s)) return 'path segment "' + s + '" is not permitted';
      } else if (typeof s === 'number') {
        if (!Number.isInteger(s) || s < 0) return 'array index ' + String(s) + ' is not a non-negative integer';
      } else {
        return 'path segment ' + i + ' is neither a string nor an index';
      }
    }
    return null;
  }

  function validate(ops, limits) {
    var lim = limits || {};
    if (!Array.isArray(ops)) return 'the patch is not a list of operations';
    var maxOps = lim.maxPatchOps || 200000;
    if (ops.length > maxOps) {
      return 'the patch has ' + ops.length + ' operations, beyond the ' + maxOps + ' this app will apply';
    }
    for (var i = 0; i < ops.length; i++) {
      var op = ops[i];
      if (!op || typeof op !== 'object') return 'operation ' + i + ' is not an object';
      if (OPS.indexOf(op.op) === -1) return 'operation ' + i + ' has unknown op "' + String(op.op) + '"';
      var err = validatePath(op.path, op.op === 'replace');
      if (err) return 'operation ' + i + ': ' + err;
      if (op.op !== 'remove' && op.value === undefined) return 'operation ' + i + ' (' + op.op + ') has no value';
    }
    return null;
  }

  function isArrayIndex(key) {
    return typeof key === 'number' || (typeof key === 'string' && /^(0|[1-9]\d*)$/.test(key));
  }

  // Structural sharing: only the spine along the path is copied, so applying a patch to a
  // 400 KB payload does not clone 400 KB.
  function cloneAlong(value, path, depth) {
    if (depth >= path.length) return value;
    var key = path[depth];
    if (Array.isArray(value)) {
      var arr = value.slice();
      var idx = Number(key);
      arr[idx] = cloneAlong(value[idx], path, depth + 1);
      return arr;
    }
    if (value && typeof value === 'object') {
      var out = {};
      for (var k in value) if (Object.prototype.hasOwnProperty.call(value, k)) out[k] = value[k];
      out[key] = cloneAlong(value[key], path, depth + 1);
      return out;
    }
    throw new Error('patch: cannot walk into ' + (value === null ? 'null' : typeof value) +
      ' at segment ' + depth + ' (' + JSON.stringify(path.slice(0, depth + 1)) + ')');
  }

  function applyOne(root, op) {
    var path = op.path;
    // The whole document. `validate` permits an empty path only for a replace, so there is nothing
    // to insert into and nothing to delete from here.
    if (path.length === 0) return op.value;

    var parentPath = path.slice(0, -1);
    var last = path[path.length - 1];
    var next = cloneAlong(root, path, 0);

    // Walk to the parent and mutate the (already copied) spine.
    var parent = next;
    for (var i = 0; i < parentPath.length; i++) parent = parent[parentPath[i]];
    if (parent === null || typeof parent !== 'object') {
      throw new Error('patch: path ' + JSON.stringify(path) + ' does not resolve to a container');
    }
    if (Array.isArray(parent)) {
      var idx = Number(last);
      if (!isArrayIndex(last)) throw new Error('patch: "' + String(last) + '" is not an array index');
      if (op.op === 'add') {
        if (idx > parent.length) idx = parent.length;
        parent.splice(idx, 0, op.value);
      } else if (op.op === 'remove') {
        if (idx >= parent.length) throw new Error('patch: remove at index ' + idx + ' beyond the array (' + parent.length + ' entries)');
        parent.splice(idx, 1);
      } else {
        if (idx >= parent.length) throw new Error('patch: replace at index ' + idx + ' beyond the array (' + parent.length + ' entries)');
        parent[idx] = op.value;
      }
      return next;
    }
    if (isForbidden(last)) throw new Error('patch: path segment "' + last + '" is not permitted');
    if (op.op === 'remove') {
      delete parent[last];
    } else {
      parent[last] = op.value;
    }
    return next;
  }

  function apply(root, ops) {
    var err = validate(ops);
    if (err) throw new Error(err);
    var cur = root;
    for (var i = 0; i < ops.length; i++) cur = applyOne(cur, ops[i]);
    return cur;
  }

  function equal(a, b) {
    return TP.canonical.serialize(a) === TP.canonical.serialize(b);
  }

  function isPlainObject(v) {
    return v !== null && typeof v === 'object' && !Array.isArray(v);
  }

  // A minimal diff. It is not trying to be clever — rule 3 (§4.2) discards any patch that
  // comes out larger than the snapshot, so a bad diff costs space for one commit and never
  // costs correctness.
  function diff(a, b) {
    var out = [];
    walk([], a, b, out);
    return out;
  }

  function walk(path, a, b, out) {
    if (equal(a, b)) return;
    if (isPlainObject(a) && isPlainObject(b)) {
      var k;
      var seen = Object.create(null);
      for (k in a) {
        if (!Object.prototype.hasOwnProperty.call(a, k)) continue;
        seen[k] = true;
        if (!Object.prototype.hasOwnProperty.call(b, k)) {
          if (!isForbidden(k)) out.push({ op: 'remove', path: path.concat([k]) });
        } else if (a[k] !== b[k]) {
          walk(path.concat([k]), a[k], b[k], out);
        }
      }
      for (k in b) {
        if (!Object.prototype.hasOwnProperty.call(b, k)) continue;
        if (seen[k]) continue;
        if (b[k] === undefined) continue;
        if (isForbidden(k)) continue;
        out.push({ op: 'add', path: path.concat([k]), value: b[k] });
      }
      return;
    }
    if (Array.isArray(a) && Array.isArray(b) && a.length === b.length) {
      for (var i = 0; i < a.length; i++) {
        if (a[i] !== b[i]) walk(path.concat([i]), a[i], b[i], out);
      }
      return;
    }
    // Everything else — type change, length change, scalar — is one replace.
    out.push({ op: 'replace', path: path, value: b });
  }

  // The comparison rule 3 uses, applied before writing: is the patch bigger than the
  // snapshot it would replace?
  function byteSize(ops) {
    return TP.sha256.utf8Bytes(TP.canonical.serialize(ops)).length;
  }

  function opCount(ops) {
    return Array.isArray(ops) ? ops.length : 0;
  }

  return {
    FORBIDDEN: FORBIDDEN,
    MAX_PATH: MAX_PATH,
    validate: validate,
    validatePath: validatePath,
    isForbidden: isForbidden,
    apply: apply,
    diff: diff,
    equal: equal,
    byteSize: byteSize,
    opCount: opCount,
  };
})();

/* ------------------------------ src/core/history.js ------------------------------ */
// The commit DAG (specs/04-versioning.md). Pure logic: no DOM, no storage, no browser APIs,
// so the whole of it is testable under plain Node.
//
// A commit is stored as exactly ONE of a snapshot or a delta against its parent (REQ-308).
// `snapshot` and `delta` are never hash inputs (REQ-302) — which is what makes re-keyframing
// and compaction free, and what stops two copies of one history desynchronising because
// they store it differently.

TP.history = (function () {
  'use strict';

  var KEYFRAME_INTERVAL = 20;   // REQ-310

  // ---- Hashing (REQ-301) ----

  function payloadHash(payload) {
    return TP.canonical.hash(payload);
  }

  // `docId` is one of the seven fields `REQ-301` puts in the commit hash, and a commit is bound to the
  // document it belongs to: the container schema requires a `docId`, and `verify.chain` requires it to
  // be a NON-EMPTY string (src/core/verify.js: "if (typeof c.docId !== 'string' || !c.docId)").
  //
  // It is passed through exactly as the caller gave it. Substituting a default here was tried and
  // reverted: defaulting to `''` manufactured a commit that the schema accepted and the integrity
  // check refused, which is two answers to one question, and defaulting to anything else would be this
  // module inventing an identity for a document. A caller that omits it gets a commit both of them
  // reject — which is correct, and is why every caller in the app supplies the registry's docId.
  function commitHash(fields) {
    var parents = (fields.parents || []).slice().sort();
    return TP.canonical.hash({
      parents: parents,
      docId: fields.docId,
      author: { name: fields.author.name, email: fields.author.email },
      timestamp: fields.timestamp,
      message: fields.message,
      payloadHash: fields.payloadHash,
    });
  }

  function makeCommit(fields) {
    var parents = (fields.parents || []).slice().sort();
    var base = {
      docId: fields.docId,
      parents: parents,
      author: { name: fields.author.name, email: fields.author.email },
      timestamp: fields.timestamp,
      message: fields.message,
      payloadHash: fields.payloadHash,
    };
    var commit = {
      id: commitHash(base),
      docId: base.docId,
      parents: parents,
      author: base.author,
      timestamp: base.timestamp,
      message: base.message,
      payloadHash: base.payloadHash,
    };
    if (fields.snapshot !== undefined) commit.snapshot = fields.snapshot;
    if (fields.delta !== undefined) commit.delta = fields.delta;
    return commit;
  }

  function newHistory(interval) {
    return { keyframeInterval: interval || KEYFRAME_INTERVAL, head: null, commits: [] };
  }

  // ---- Reading the DAG ----

  function index(history) {
    var map = Object.create(null);
    var list = (history && history.commits) || [];
    for (var i = 0; i < list.length; i++) map[list[i].id] = list[i];
    return map;
  }

  function find(history, id) {
    if (!id) return null;
    var list = (history && history.commits) || [];
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  function head(history) {
    return find(history, history && history.head);
  }

  // Depth-first over parents, returning a Set of every commit reachable from `id`.
  function reachable(history, id) {
    var map = index(history);
    var seen = Object.create(null);
    var stack = id ? [id] : [];
    while (stack.length) {
      var cur = stack.pop();
      if (!cur || seen[cur]) continue;
      seen[cur] = true;
      var c = map[cur];
      if (!c) continue;
      for (var i = 0; i < c.parents.length; i++) stack.push(c.parents[i]);
    }
    return seen;
  }

  function isAncestor(history, a, b) {
    if (!a || !b) return false;
    if (a === b) return false;
    var r = reachable(history, b);
    return !!r[a];
  }

  // The linear chain from a keyframe up to `id`, in application order.
  function chainToNearestKeyframe(history, id) {
    var map = index(history);
    var chain = [];
    var cur = id;
    var guard = 0;
    while (cur) {
      if (++guard > 1000000) throw new Error('history: cycle or runaway chain at ' + cur);
      var c = map[cur];
      if (!c) throw new Error('history: no commit ' + cur);
      chain.push(c);
      if (c.snapshot !== undefined) break;
      if (c.parents.length !== 1) {
        throw new Error('history: commit ' + cur + ' is a delta with ' + c.parents.length + ' parents');
      }
      cur = c.parents[0];
    }
    return chain.reverse();
  }

  // Reconstruct the payload at a commit by replaying from the nearest preceding keyframe,
  // so cost is bounded by the interval rather than by the history length (REQ-311).
  function reconstruct(history, id) {
    var chain = chainToNearestKeyframe(history, id);
    if (!chain.length) throw new Error('history: empty chain');
    var first = chain[0];
    if (first.snapshot === undefined) throw new Error('history: chain has no keyframe');
    var payload = first.snapshot;
    for (var i = 1; i < chain.length; i++) {
      payload = TP.patch.apply(payload, chain[i].delta || []);
    }
    return payload;
  }

  function headPayload(history) {
    if (!history || !history.head) return null;
    return reconstruct(history, history.head);
  }

  // Commits between the last keyframe and `commit`'s parent, inclusive of neither end.
  function distanceSinceKeyframe(history, parentId) {
    var map = index(history);
    var n = 0;
    var cur = parentId;
    var guard = 0;
    while (cur) {
      if (++guard > 1000000) throw new Error('history: cycle while measuring keyframe distance');
      var c = map[cur];
      if (!c) return n;
      if (c.snapshot !== undefined) return n;
      n++;
      if (c.parents.length !== 1) return n;
      cur = c.parents[0];
    }
    return n;
  }

  // ---- Writing ----

  // The four keyframe rules (REQ-309). Rules 1–3 are correctness; rule 4 is a heuristic and
  // is stated as one so that changing the interval is not mistaken for changing behaviour.
  function decideStorage(history, parents, payload, parentPayload) {
    if (!parents.length) return { kind: 'keyframe', reason: 'root' };
    if (parents.length > 1) return { kind: 'keyframe', reason: 'merge' };

    var snapshotBytes = TP.sha256.utf8Bytes(TP.canonical.serialize(payload)).length;
    var delta = TP.patch.diff(parentPayload, payload);
    var deltaBytes = TP.patch.byteSize(delta);
    if (deltaBytes >= snapshotBytes) return { kind: 'keyframe', reason: 'patch-larger-than-snapshot' };

    var interval = (history && history.keyframeInterval) || KEYFRAME_INTERVAL;
    if (distanceSinceKeyframe(history, parents[0]) + 1 >= interval) {
      return { kind: 'keyframe', reason: 'interval' };
    }
    return { kind: 'delta', reason: 'incremental', delta: delta };
  }

  // Append a commit. Returns { commit, history } — the history is a new object so callers
  // cannot accidentally hold a half-written one.
  function append(history, payload, meta) {
    var h = history || newHistory();
    var parents = (meta.parents || (h.head ? [h.head] : [])).slice().sort();
    var parentPayload = null;
    if (parents.length) parentPayload = reconstruct(h, parents[0]);

    var decision = decideStorage(h, parents, payload, parentPayload);
    var commit = makeCommit({
      docId: meta.docId,
      parents: parents,
      author: meta.author,
      timestamp: meta.timestamp || new Date().toISOString(),
      message: meta.message || '',
      payloadHash: payloadHash(payload),
    });
    if (decision.kind === 'keyframe') commit.snapshot = payload;
    else commit.delta = decision.delta;

    var next = {
      keyframeInterval: h.keyframeInterval || KEYFRAME_INTERVAL,
      head: commit.id,
      commits: h.commits.concat([commit]),
    };
    return { commit: commit, history: next, decision: decision };
  }

  // A merge commit always has two or more parents and is always a keyframe (rule 2).
  function merge(history, payload, parentIds, meta) {
    return append(history, payload, {
      docId: meta.docId,
      parents: parentIds,
      author: meta.author,
      timestamp: meta.timestamp,
      message: meta.message,
    });
  }

  // ---- Ordering (REQ-312) ----

  var IDENTICAL = 'IDENTICAL';
  var A_NEWER = 'A_NEWER';
  var B_NEWER = 'B_NEWER';
  var DIVERGED = 'DIVERGED';

  // Ancestry decides. A clock never does: timestamps come from untrusted client clocks, and
  // a machine with a wrong clock would otherwise silently win every reconcile.
  function compare(historyA, headA, historyB, headB) {
    if (!headA && !headB) return IDENTICAL;
    if (!headA) return B_NEWER;
    if (!headB) return A_NEWER;
    if (headA === headB) return IDENTICAL;
    if (isAncestor(historyB, headA, headB)) return B_NEWER;
    if (isAncestor(historyA, headB, headA)) return A_NEWER;
    return DIVERGED;
  }

  // Commits are content-addressed, so a commit id means the same record in either history.
  // Merging the two indexes is therefore safe, and it lets one walk see both sides.
  function mergedIndex(historyA, historyB) {
    var map = index(historyA);
    var b = index(historyB);
    for (var k in b) if (!map[k]) map[k] = b[k];
    return map;
  }

  function reachableFromMap(map, id) {
    var seen = Object.create(null);
    var stack = id ? [id] : [];
    while (stack.length) {
      var cur = stack.pop();
      if (!cur || seen[cur]) continue;
      seen[cur] = true;
      var c = map[cur];
      if (!c) continue;
      for (var i = 0; i < c.parents.length; i++) stack.push(c.parents[i]);
    }
    return seen;
  }

  // The nearest common ancestor of two heads, or null when there is none. "Nearest" is by
  // breadth-first distance from headB, which is the merge base for the linear and
  // fast-forward cases this app actually creates. The compare view only needs a base to
  // display (04-versioning.md §7.3), so an approximation is honest here in a way it would
  // not be for ordering, where ancestry decides.
  function mergeBase(historyA, historyB, headA, headB) {
    var map = mergedIndex(historyA, historyB);
    var ra = reachableFromMap(map, headA);
    var level = Object.create(null);
    var queue = headB ? [headB] : [];
    var seen = Object.create(null);
    level[headB] = 0;
    while (queue.length) {
      var cur = queue.shift();
      if (!cur || seen[cur]) continue;
      seen[cur] = true;
      if (ra[cur]) return cur;                    // first (nearest) common ancestor
      var c = map[cur];
      if (!c) continue;
      for (var i = 0; i < c.parents.length; i++) {
        if (level[c.parents[i]] === undefined) level[c.parents[i]] = level[cur] + 1;
        queue.push(c.parents[i]);
      }
    }
    return null;
  }

  // ---- Compaction (REQ-319) ----
  //
  // Rewrites the storage representation without touching ids. That is only possible because
  // the hash never covers the representation (REQ-302) — the payoff for that choice.

  function compact(history, options) {
    var opts = options || {};
    var list = (history && history.commits) || [];
    var reach = reachable(history, history && history.head);
    var unreachable = [];
    for (var i = 0; i < list.length; i++) if (!reach[list[i].id]) unreachable.push(list[i].id);

    var before = TP.sha256.utf8Bytes(TP.canonical.serialize(list)).length;
    var next = newHistory(history.keyframeInterval);
    var rebuilt = [];
    var keyframes = 0;

    // Replay in the history's own (topological) order, re-deciding storage for each commit
    // against the compacted history so far.
    //
    // A commit that the head cannot reach is KEPT unless the caller explicitly asked for it to go
    // (REQ-318, PAT-INV-05, 04-versioning.md §9.1). Compaction rewrites the storage representation;
    // deciding that a commit nobody can currently reach is unwanted is a different act, and one this
    // app may only take on an informed confirmation. `removeOrphans` IS that confirmation, so the
    // branch that discards is the branch that needs the flag — not the branch that keeps.
    for (var j = 0; j < list.length; j++) {
      var c = list[j];
      if (!reach[c.id]) {
        if (!opts.removeOrphans) rebuilt.push(passthrough(c));
        continue;
      }
      var payload = reconstruct(history, c.id);
      var parentPayload = null;
      if (c.parents.length) parentPayload = reconstruct(history, c.parents[0]);
      var decision = decideStorage(next, c.parents, payload, parentPayload);
      var copy = {
        id: c.id, docId: c.docId, parents: c.parents.slice(),
        author: { name: c.author.name, email: c.author.email },
        timestamp: c.timestamp, message: c.message, payloadHash: c.payloadHash,
      };
      if (decision.kind === 'keyframe') { copy.snapshot = payload; keyframes++; }
      else copy.delta = decision.delta;
      if (copy.id !== c.id) throw new Error('compaction changed a commit id: ' + c.id + ' -> ' + copy.id);
      rebuilt.push(copy);
    }
    next.head = history.head;
    next.commits = rebuilt;

    var after = TP.sha256.utf8Bytes(TP.canonical.serialize(rebuilt)).length;
    var report = {
      before: before,
      after: after,
      saved: before - after,
      keyframesBefore: countKeyframes(list),
      keyframesAfter: keyframes,
      unreachable: unreachable,
      removeOrphans: !!opts.removeOrphans,
      keptOrphans: opts.removeOrphans ? 0 : unreachable.length,
      removedOrphans: opts.removeOrphans ? unreachable.length : 0,
    };
    return { history: next, report: report };
  }

  // An unreachable commit, carried across a compaction byte for byte.
  //
  // It is NOT re-decided and NOT re-keyframed. Nothing can reconstruct its payload — reconstruction
  // walks back from the head, and that is exactly the walk that cannot reach it — so there is no
  // payload to store as a snapshot. Its stored bytes already hash to its id, so copying them is the
  // only operation that is guaranteed to leave the id alone (REQ-319).
  function passthrough(commit) {
    var copy = {
      id: commit.id, docId: commit.docId, parents: commit.parents.slice(),
      author: { name: commit.author.name, email: commit.author.email },
      timestamp: commit.timestamp, message: commit.message, payloadHash: commit.payloadHash,
    };
    if (commit.snapshot !== undefined) copy.snapshot = commit.snapshot;
    if (commit.delta !== undefined) copy.delta = commit.delta.slice();
    return copy;
  }

  function countKeyframes(list) {
    var n = 0;
    for (var i = 0; i < list.length; i++) if (list[i].snapshot !== undefined) n++;
    return n;
  }

  // ---- Integrity helpers -------------------------------------------------------------
  //
  // `verify.js` owns the verdicts; these are the two facts it needs and they live here so
  // the DAG has exactly one reader.

  function recomputeId(commit) {
    return commitHash({
      parents: commit.parents || [],
      docId: commit.docId,
      author: commit.author || { name: '', email: '' },
      timestamp: commit.timestamp,
      message: commit.message,
      payloadHash: commit.payloadHash,
    });
  }

  return {
    KEYFRAME_INTERVAL: KEYFRAME_INTERVAL,
    IDENTICAL: IDENTICAL,
    A_NEWER: A_NEWER,
    B_NEWER: B_NEWER,
    DIVERGED: DIVERGED,
    newHistory: newHistory,
    payloadHash: payloadHash,
    commitHash: commitHash,
    makeCommit: makeCommit,
    append: append,
    merge: merge,
    find: find,
    head: head,
    index: index,
    reachable: reachable,
    isAncestor: isAncestor,
    reconstruct: reconstruct,
    headPayload: headPayload,
    distanceSinceKeyframe: distanceSinceKeyframe,
    decideStorage: decideStorage,
    compare: compare,
    mergeBase: mergeBase,
    compact: compact,
    countKeyframes: countKeyframes,
    recomputeId: recomputeId,
  };
})();

/* ------------------------------ src/core/merge.js ------------------------------ */
// Ancestry, comparison and the reconcile decision (specs/04-versioning.md §6, §7).
//
// Pure: given the embedded history and whatever local history exists — including none — it
// returns what should happen. Nothing here writes, and nothing here resolves a divergence:
// that is a human's job and the app does not guess (REQ-313, PAT-INV-04).

TP.merge = (function () {
  'use strict';

  var ADOPT = 'adopt';                 // no local copy: take the file's history
  var IDENTICAL = 'identical';         // same head
  var FAST_FORWARD = 'fast-forward';   // the file is strictly ahead: adopt silently
  var KEEP_LOCAL = 'keep-local';       // local is strictly ahead: keep it, offer an updated file
  var DIVERGED = 'diverged';           // both sides have work: stop and ask
  var SEPARATE = 'separate';           // different documents: register side by side, never merge

  function plan(embedded, local) {
    var e = embedded && embedded.history;
    var l = local && local.history;

    if (!e || !e.commits || !e.commits.length) {
      if (l && l.commits && l.commits.length) return { action: KEEP_LOCAL, reason: 'the file carries no history' };
      return { action: ADOPT, reason: 'the file carries no history' };
    }
    if (!l || !l.commits || !l.commits.length) {
      return { action: ADOPT, reason: 'no local history' };
    }

    if (embedded.docId && local.docId && embedded.docId !== local.docId) {
      return { action: SEPARATE, reason: 'different document ids' };
    }

    var base = TP.history.mergeBase(e, l, e.head, l.head);
    if (!base && e.head !== l.head) {
      return { action: SEPARATE, reason: 'no common ancestor' };
    }

    // A is the embedded history (the file) and B the local one, so A_NEWER means the file moved on
    // and B_NEWER means this browser did. The two verdicts name the arguments by position, not by
    // which side "wins", and getting them the wrong way round adopts the older copy in both
    // directions (04-versioning.md §7).
    var verdict = TP.history.compare(e, e.head, l, l.head);
    if (verdict === TP.history.IDENTICAL) return { action: IDENTICAL, reason: 'same head' };
    if (verdict === TP.history.A_NEWER) return { action: FAST_FORWARD, reason: 'the file is ahead of this copy' };
    if (verdict === TP.history.B_NEWER) return { action: KEEP_LOCAL, reason: 'this copy is ahead of the file' };
    return { action: DIVERGED, reason: 'both copies have changes', base: base };
  }

  // The coarse prompt the first version ships (04-versioning.md §7.3; the three-way view is
  // deferred as Q-5). A three-way compare may pre-select suggestions, but nothing is written
  // until confirmed — and nothing is auto-merged either way.
  function optionsFor(planResult) {
    if (planResult.action === DIVERGED) {
      return [
        { id: 'keep-local',  label: 'Keep this copy',  hint: 'Your local copy stays as it is. The file is left alone.' },
        { id: 'take-file',   label: 'Take the file',   hint: 'Your local history is kept; the file becomes the new head as a merge commit.' },
      ];
    }
    return [];
  }

  return {
    ADOPT: ADOPT,
    IDENTICAL: IDENTICAL,
    FAST_FORWARD: FAST_FORWARD,
    KEEP_LOCAL: KEEP_LOCAL,
    DIVERGED: DIVERGED,
    SEPARATE: SEPARATE,
    plan: plan,
    optionsFor: optionsFor,
  };
})();

/* ------------------------------ src/core/verify.js ------------------------------ */
// Integrity verification (specs/04-versioning.md §5, REQ-316, REQ-317).
//
// Two levels, because full verification is expensive and mostly unnecessary:
//
//   chain    stored fields hash to each commit's declared id; every parent id exists.
//            O(N), no reconstruction. Runs ALWAYS, at boot.
//   payload  reconstruct the payload and recompute its hash. Expensive, so it runs at the
//            head and on any commit the user inspects.
//
// A failure never repairs anything. Repairing means guessing, and a guess that parses is a
// guess that gets written back and circulated as fact.

TP.verify = (function () {
  'use strict';

  function chain(history) {
    var errors = [];
    var list = (history && history.commits) || [];
    var map = TP.history.index(history);

    for (var i = 0; i < list.length; i++) {
      var c = list[i];
      var id = c && c.id;

      if (!c || typeof c !== 'object') {
        errors.push({ commitId: null, problem: 'commit at position ' + i + ' is not an object' });
        continue;
      }
      if (typeof c.docId !== 'string' || !c.docId) {
        errors.push({ commitId: id, problem: 'no docId' });
      }
      if (!Array.isArray(c.parents)) {
        errors.push({ commitId: id, problem: 'parents is not a list' });
      } else {
        for (var p = 0; p < c.parents.length; p++) {
          if (!map[c.parents[p]]) {
            errors.push({ commitId: id, problem: 'parent ' + c.parents[p] + ' is not present in this file' });
          }
        }
      }
      var hasSnapshot = c.snapshot !== undefined;
      var hasDelta = c.delta !== undefined;
      if (hasSnapshot === hasDelta) {
        errors.push({
          commitId: id,
          problem: hasSnapshot
            ? 'carries both a snapshot and a delta; exactly one is permitted'
            : 'carries neither a snapshot nor a delta',
        });
      }
      if (hasDelta && Array.isArray(c.parents) && c.parents.length !== 1) {
        errors.push({ commitId: id, problem: 'a delta must have exactly one parent, this has ' + c.parents.length });
      }
      var declared = null;
      try { declared = TP.history.recomputeId(c); } catch (e) { declared = null; }
      if (declared !== id) {
        errors.push({
          commitId: id,
          problem: 'the stored fields hash to ' + declared + ', not to the declared id',
        });
      }
    }

    if (history && history.head && !map[history.head]) {
      errors.push({ commitId: history.head, problem: 'the head names a commit that is not present in this file' });
    }

    return {
      ok: errors.length === 0,
      checked: list.length,
      errors: errors,
      firstBad: errors.length ? errors[0].commitId : null,
    };
  }

  function payload(history, id) {
    var target = id || (history && history.head);
    if (!target) return { ok: true, commitId: null, errors: [] };
    var c = TP.history.find(history, target);
    if (!c) return { ok: false, commitId: target, errors: [{ commitId: target, problem: 'no such commit' }] };
    var errors = [];
    try {
      var rebuilt = TP.history.reconstruct(history, target);
      var computed = TP.history.payloadHash(rebuilt);
      if (computed !== c.payloadHash) {
        errors.push({
          commitId: target,
          problem: 'the reconstructed payload hashes to ' + computed + ', not to the recorded ' + c.payloadHash,
        });
      }
    } catch (e) {
      errors.push({ commitId: target, problem: 'the payload could not be reconstructed: ' + e.message });
    }
    return { ok: errors.length === 0, commitId: target, errors: errors };
  }

  // The honest label (REQ-320). This is integrity, not authorship: a rebuilt chain proves the
  // history has not changed since it was written, and proves nothing about who wrote it.
  function label(result) {
    if (!result) return 'chain not checked';
    if (result.ok) {
      return result.checked === 1
        ? 'chain intact — 1 commit'
        : 'chain intact — ' + result.checked + ' commits';
    }
    return 'chain broken at ' + shortId(result.firstBad);
  }

  function shortId(id) {
    if (!id) return '(unknown commit)';
    var s = String(id);
    var colon = s.indexOf(':');
    var body = colon === -1 ? s : s.slice(colon + 1);
    return body.slice(0, 12);
  }

  return {
    chain: chain,
    payload: payload,
    label: label,
    shortId: shortId,
  };
})();

// The canonical model (specs/03-data-model.md). One trip per document (REQ-201).
//
// This is the union of what `trip-data.json` and iCalendar can express, never their
// intersection (REQ-202, PAT-INV-11): where only one format has a concept, the concept still
// exists here and the other format's export discloses it as unrepresentable.
//
// Derived roll-ups are NOT canonical (03-data-model.md §2.3). `budget` is recomputed from
// `budgetEstimates` on demand; storing it beside its source would create two truths that a
// merge would then have to arbitrate, and any arbitration is a guess.

TP.model = (function () {
  'use strict';

  // The collections, in the order the UI and both mappers present them.
  var COLLECTIONS = [
    'lodging', 'reservations', 'noReservationNeeded', 'preTripActions',
    'bucketList', 'chargingNetworks', 'minSocThresholds', 'locations',
    'contacts', 'criticalAlerts', 'budgetEstimates', 'expenses',
  ];

  var FORMATS = ['tripDataJson', 'iCal'];

  function clone(value) {
    if (value === undefined) return undefined;
    return JSON.parse(JSON.stringify(value));
  }

  // ---- Passthrough bags (REQ-205–REQ-207) ----
  //
  // Every field the canonical model does not represent is preserved verbatim, keyed by
  // source format, on the entity it came from. An empty bag is omitted, never emitted as {}.

  function bag(entity, format) {
    if (!entity || !entity.x) return null;
    var b = entity.x[format];
    return b && typeof b === 'object' ? b : null;
  }

  function bagSet(entity, format, key, value) {
    if (!entity) return;
    if (!entity.x) entity.x = {};

// The JSON Schema subset validator (specs/06-interchange.md §7, REQ-516, ADR-0008).
//
// ADR-0008 names the force honestly: "a subtly wrong validator is worse than none, because it gives
// confident wrong answers". The way to have a small validator without that failure is to make its
// incompleteness MECHANICAL rather than a matter of care:
//
//   * `SUPPORTED` is an explicit list, and `unsupportedKeywords()` reports anything in a schema
//     that is not on it. The test suite fails if a vendored schema uses an unimplemented keyword,
//     so a schema cannot come to rely on a check that never runs. That is the whole defence:
//     silently ignoring `format` or `if/then` is exactly how a validator becomes confidently wrong.
//
//   * No `format`. Format assertions are the most commonly-ignored keyword in the ecosystem and
//     the easiest to believe in. `pattern` is here instead, and it is checked.
//
// The validator is used on the two vendored JSON Schemas — the trip-data wire and the PVD envelope
// — and on nothing else. It is not a general-purpose implementation and does not claim to be.

TP.validators = TP.validators || {};

TP.validators.schema = (function () {
  'use strict';

  // Keywords that assert something and are implemented below.
  var SUPPORTED = [

// The iCalendar structural validator (specs/06-interchange.md §7, REQ-516, ADR-0008).

// iCalendar is not JSON, so there is no JSON Schema to hand it to. What can be checked structurally

// nest the way the RFC says, that each component carries the properties it must, that the lines are
// the shape a line has, and that the values of the properties this app reads are the type they claim.
//
// TWO RULES SHAPE THIS FILE.

// It is deliberately incomplete, and the incompleteness is stated rather than discovered. Only the
// properties in the vendored table have their values checked; anything else is accepted and passed
// through (the model keeps unmodelled properties as a bag, REQ-207), because a calendar from the
// wider world is not malformed just for being unfamiliar. `NOT CHECKED` in the code below is the
// list of things this validator does not claim.

// the mapper does is testing that function, not the file: the two would agree about a malformed file
// by making the same mistake. The unfolding here is a separate, simpler implementation whose only
// job is to decide whether the file is a calendar at all — and the mapper can then be as tolerant as
// it likes, because something stricter has already said yes.
