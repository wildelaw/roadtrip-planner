      var parsed = parseLine(line.text);
      if (parsed.error) {
        fail('line ' + line.number, 'line', 'Line ' + line.number + ' ' + parsed.error + '.');
        // One unreadable line is not a reason to abandon the file: the structural checks below are
        // still worth making, and the caller reports all of them together.
        continue;
      }

      if (parsed.name === 'BEGIN') {
        var opening = parsed.value.toUpperCase();
        if (!components[opening]) {
          fail('line ' + line.number, 'component', 'The file opens a ' + opening + ' component, which is not one this app knows how to read.');
          stack.push({ unknown: true, name: opening, line: line.number });
          continue;
        }
        if (stack.length >= depthLimit) {
          fail('line ' + line.number, 'depth', 'The components nest more than ' + depthLimit + ' deep, beyond what this app will read.');
          stack.push({ unknown: true, name: opening, line: line.number });
          continue;
        }
        if (!stack.length) {
          if (rootSeen) fail('line ' + line.number, 'root', 'The file has a second ' + opening + ' at the top level; a calendar file holds one.');
          if (opening !== table.root) {
            fail('line ' + line.number, 'root', 'The file begins with ' + opening + ' rather than ' + table.root + ', so it is not a calendar.');
          }
          rootSeen = true;
        } else {
          var parent = stack[stack.length - 1];
          if (!parent.unknown) {
            var allowed = components[parent.name].contains || [];
            if (allowed.indexOf(opening) === -1) {
              fail('line ' + line.number, 'nesting', 'A ' + opening + ' cannot appear inside a ' + parent.name +
                (allowed.length ? '; the RFC allows ' + allowed.join(', ') + ' there' : '; it holds no other components') + '.');
            }
          }
        }
        stack.push({ name: opening, line: line.number, props: Object.create(null), propsList: [], unknown: false });
        continue;
      }

      if (parsed.name === 'END') {
        var closing = parsed.value.toUpperCase();
        if (!stack.length) {
          fail('line ' + line.number, 'nesting', 'Line ' + line.number + ' closes ' + closing + ', but no component is open.');
          continue;
        }
        var open = stack[stack.length - 1];
        if (open.name !== closing) {
          fail('line ' + line.number, 'nesting', 'Line ' + line.number + ' closes ' + closing + ', but the open component is ' + open.name + '.');
          // Recover at the closed name if it is somewhere on the stack, so one bad END does not
          // cascade into a report about every component after it.
          for (var s = stack.length - 2; s >= 0; s--) {
            if (stack[s].name === closing) { stack.length = s; open = null; break; }
          }
          if (open) { stack.pop(); continue; }
          continue;
        }
        stack.pop();
        if (!open.unknown) finishComponent(open, components, problems);
        continue;
      }

      // A property line.
      if (!stack.length) {
        fail('line ' + line.number, 'line', 'Line ' + line.number + ' is a property outside any component, so there is nothing for it to describe.');
        continue;
      }
      var current = stack[stack.length - 1];
      if (current.unknown) continue;
      current.propsList.push({ line: line, parsed: parsed });
      current.props[parsed.name] = true;
    }

    // Unclosed components. This is the case a truncating read produces, and naming it is the
    // difference between "this file is corrupt" and "the app found nothing and said nothing".
    while (stack.length) {
      var unclosed = stack.pop();
      fail('line ' + unclosed.line, 'unclosed', 'The ' + unclosed.name + ' opened on line ' + unclosed.line + ' is never closed.');
    }

    if (!rootSeen) {
      fail('', 'root', 'The file contains no ' + table.root + ' component, so it is not a calendar.');
    }

    return { ok: problems.length === 0, problems: problems };
  }

  // Required properties, and the two relations the RFC states as relations rather than tables.
  function finishComponent(open, components, problems) {
    var spec = components[open.name];
    var where = 'the ' + open.name + ' on line ' + open.line;

    for (var r = 0; r < spec.required.length; r++) {
      var req = spec.required[r];
      if (open.props[req]) continue;
      // The one exception the vendored table documents: a VEVENT in an object with no METHOD may
      // omit DTSTART in a calendar that describes a task rather than a time. This app's own files
      // always carry it, so the check is applied and the exception is not: an import that refuses a
      // file whose events have no times would refuse the very thing it is for.
      problems.push({
        path: open.name, keyword: 'required',
        message: where + ' has no ' + req + ' property, which an iCalendar ' + open.name + ' must have',
      });
    }

    // DTEND and DURATION are mutually exclusive (RFC 5545 §3.6.1). A relation, so it is code.
    if (open.name === 'VEVENT' && open.props.DTEND && open.props.DURATION) {
      problems.push({
        path: open.name, keyword: 'exclusive',
        message: where + ' has both DTEND and DURATION; an event states its length one way or the other, not both',
      });
    }

    // Value types, for the properties the vendored table names.
    var declared = spec.properties || {};
    for (var p = 0; p < open.propsList.length; p++) {
      var entry = open.propsList[p];
      var name = entry.parsed.name;
      if (!declared[name]) continue;   // unmodelled: kept as a bag, not interpreted (REQ-207)
      if (name === 'DTEND' && open.props.DURATION) continue;   // already reported; the value adds noise
      checkValue(name, entry.parsed, declared[name], where, open.name, problems);
    }
  }

  // ---- The entry point ----

  // `text` is the raw file. The result has the same shape as `TP.validators.schema.validate`, so a
  // caller does not have to know which format it validated.
  function validateText(text) {
    if (typeof text !== 'string' || !text.length) {
      return { ok: false, problems: [{ path: '', keyword: 'empty', message: 'The file is empty.' }] };
    }
    // The root is checked here as well as in `detect`, because this function is also called on text
    // that did not come from the import path — an AI answer, or a fixture in a test. A byte-order
    // mark and any leading whitespace are skipped; `\s` covers the two Unicode line terminators as
    // well, so a file saved with them is still recognised rather than reported as "not a calendar".
    var head = text;
    var bom = String.fromCharCode(0xFEFF);
    while (head.length && (head.charAt(0) === bom || /\s/.test(head.charAt(0)))) head = head.slice(1);
    if (head.slice(0, 15).toUpperCase() !== 'BEGIN:VCALENDAR') {
      return { ok: false, problems: [{ path: '', keyword: 'root', message: 'This is not a calendar: it does not begin with BEGIN:VCALENDAR.' }] };
    }
    return validate(text);
  }

  return {
    validate: validate,
    validateText: validateText,
    logicalLines: logicalLines,
    parseLine: parseLine,
    VALUE_CHECKS: VALUE_CHECKS,
  };
})();

/* ------------------------------ src/validators/index.js ------------------------------ */
// The validator seam (specs/06-interchange.md §7, REQ-516, REQ-517, REQ-518).
//
// One entry point, three formats, one result shape. A caller — the import path, the AI panel — asks
// "is this well-formed for the format it claims to be?", and gets back the same structure either
// way. It does not have to know that one format is validated against a JSON Schema and the other by
// a hand-written structural walk.
//
// WHY THIS IS NOT THE MAPPER. The mappers are deliberately tolerant: they take what they can and put
// the rest in a bag (REQ-205–REQ-207). If the same code also decided whether a file was acceptable,
// there would be no answer to "what is a malformed file?" other than "one the mapper could not
// salvage" — and a mapper is written to salvage. So this runs FIRST, says yes or no, and the mapper
// then works on files that have already been told apart from their neighbours.

TP.validators = TP.validators || {};

TP.validators.index = (function () {
  'use strict';

  // The formats an import can produce. `artifact` is validated as its envelope: the payload inside
  // is the trip model, whose shape is checked by the model's own normaliser (`TP.model.normalize`)
  // and whose history is checked by chain verification (04-versioning.md §5). Validating the trip
  // model here as well would be a second, divergent answer to a question already answered.
  var FORMATS = ['artifact', 'tripdata', 'ical'];

  function problemList(result) {
    return (result && result.problems) || [];
  }

  // Validate whatever `input` is, for the format named.
  //
  //   check('tripdata', parsedJson)
  //   check('artifact', containerObject)
  //   check('ical', rawText)
  //
  // Anything else returns a refusal rather than throwing, because every caller is a boundary that
  // has to say something to a person.
  function check(format, input) {
    if (FORMATS.indexOf(format) === -1) {
      return {
        ok: false, format: format,
        problems: [{ path: '', keyword: 'format', message: 'There is no validator for ' + JSON.stringify(String(format)) + '.' }],
      };
    }

    if (format === 'ical') {
      var ical = TP.validators.ical.validateText(input);
      return { ok: ical.ok, format: format, problems: ical.problems };
    }

    if (format === 'artifact') {
      var env = TP.validators.schema.validate(TP.schemas.container, input);
      return { ok: env.ok, format: format, problems: env.problems };
    }

    var wire = TP.validators.schema.validate(TP.schemas.tripData, input);
    return { ok: wire.ok, format: format, problems: wire.problems };
  }

  // One sentence for the user (REQ-518: a guard failure explains itself). It names the format, says
  // how many problems there are, and quotes the first few — with the path, because "the third item
  // on the second day has no title" is actionable and "the file is invalid" is not.
  function explain(result, options) {
    var opts = options || {};
    var limit = opts.limit || 3;
    var problems = problemList(result);
    if (!problems.length) return '';

    var kind = result.format === 'ical' ? 'calendar' : result.format === 'tripdata' ? 'trip data'
      : result.format === 'artifact' ? 'planner document' : 'file';
    var lead = 'This ' + kind + ' has ' + problems.length +
      (problems.length === 1 ? ' problem that this app will not accept: ' : ' problems that this app will not accept: ');

    var named = problems.slice(0, limit).map(function (p) {
      return p.path ? p.path + ' — ' + p.message : p.message;
    });
    var rest = problems.length > limit
      ? ' (and ' + (problems.length - limit) + ' more)' : '';
    return lead + named.join(' ') + rest;
  }

  // Everything a schema-driven format refuses, stated as a list of (path, message) — for a test that
  // wants to assert on a specific failure, and for a dialog that wants to show them all.
  function problems(result) {
    return problemList(result).map(function (p) { return { path: p.path, keyword: p.keyword, message: p.message }; });
  }

  return {
    FORMATS: FORMATS,
    check: check,
    explain: explain,
    problems: problems,
  };
})();

// The seam itself, lifted onto the namespace: `TP.validators.check(format, input)` is what the
// import path and the AI panel call, and what a reader should find first. `index` stays reachable
// for the static checks, which want to assert on the whole module rather than one entry point.
TP.validators.check = TP.validators.index.check;
TP.validators.explain = TP.validators.index.explain;
TP.validators.problems = TP.validators.index.problems;

// The lossiness ledger (specs/06-interchange.md §3, REQ-511, REQ-512, REQ-809).
//
// Written BEFORE the mappers — PATTERN.md §8.1 step 3 — so that "did we forget a field?" is a
// mechanical check rather than a matter of opinion.
//
//   M  mapped        round-trips with the same meaning
//   F  folded        represented, but combined with other fields; un-folded on import
//   D  dropped       not representable in that format. DISCLOSED at export
//   P  passthrough   preserved verbatim in a bag (x), never interpreted
//
// There is no M on the iCalendar side for anything with no VEVENT counterpart, and every D
// is a disclosure obligation rather than a silent omission.
//
// The rows below are `specs/06-interchange.md` §3's tables. They are written in the same order,
// with the same field names and the same classifications and the same notes, because that table
// IS the ledger: a reviewer comparing the two should find them identical, and anything that
// differs is a decision someone made in code and never wrote down. Rows marked `[extension]` are
// the ones the spec's tables do not name — the passthrough bags on the entities §3 names no bag
// for, and the sub-fields §3 classifies with an "M / D" slash that a single classification cannot
// express.

TP.ledger = (function () {
  'use strict';

  var M = 'mapped';
  var F = 'folded';
  var D = 'dropped';
  var P = 'passthrough';

  // §3.1 Trip-level.
  var TRIP = [
    { field: 'trip.id', json: M, ical: P, note: 'iCalendar has no trip-level id. On .ics import a docId is minted' },
    { field: 'trip.docId', json: D, ical: D, note: 'Document identity, not trip content. Never exported (REQ-211)' },
    { field: 'trip.title', json: M, ical: M, note: 'X-WR-CALNAME, and each SUMMARY carries the item title' },
    { field: 'trip.subtitle', json: M, ical: D },
    { field: 'trip.currency', json: M, ical: D, note: 'Synthesized as USD when absent (03-data-model.md §7)' },
    { field: 'trip.startDate', json: M, ical: D, note: 'Derivable from the earliest VEVENT; derived on import, never stored from the .ics' },
    { field: 'trip.endDate', json: M, ical: D, note: 'Derivable from the latest VEVENT; derived on import, never stored from the .ics' },
    { field: 'trip.destinations[]', json: M, ical: D },
    { field: 'trip.travelers[]', json: M, ical: F, note: 'Folded into ATTENDEE where an email exists; the names travel in X-TP-TRAVELERS, one per line, which restores order too. Un-folding is best-effort: two travellers with the same name and only one address come back paired the other way round' },
    { field: 'trip.travelers[].id', json: M, ical: D, note: '[extension] a calendar identifies a traveller by name and address, never by an id, so it is derived on import from the position and name the calendar gave' },
    { field: 'trip.travelers[].type', json: M, ical: D, note: '[extension] ATTENDEE has no field for it' },
    { field: 'trip.vehicle', json: M, ical: D, note: 'All six fields. Disclosed. EV planning has no calendar representation' },
    // The bags (REQ-205–REQ-207). Each bag is keyed by the format its fields came from, so each
    // format's column states what THAT format does with the bag — which is why the pairs below
    // differ: `trip-data.json` is the format that carries the calendar's bag on the wire
    // (06-interchange.md §3.2, §3.5), and a calendar line has nowhere to put a JSON bag.
    { field: 'trip.x.iCal', json: M, ical: P, note: '[extension] unmodelled trip-level calendar properties; on trip-data.json they ride in the carrier bag' },
    { field: 'trip.x.tripDataJson', json: P, ical: D, note: '[extension] trip-level wire fields the model does not name. A calendar cannot carry a JSON bag, so this is disclosed' },
    { field: 'trip.vehicle.x.iCal', json: M, ical: D, note: '[extension] the vehicle has no calendar counterpart, so in practice this bag is empty' },
    { field: 'trip.vehicle.x.tripDataJson', json: P, ical: D, note: '[extension] same, for the JSON bag' },
  ];

  // §3.2 Days and items.
  var DAY = [
    { field: 'day.id', json: M, ical: D, note: 'Derived on import from DTSTART; the UID this app writes embeds it (03-data-model.md §3), so a day from our own file keeps its id, but a calendar carries no day id' },
    { field: 'day.date', json: M, ical: M, note: 'DTSTART / DTEND of the day’s all-day event' },
    { field: 'day.title', json: M, ical: F, note: 'Folded into that event’s SUMMARY' },
    { field: 'day.stay', json: M, ical: F, note: 'Folded into a `Stay: …` line of DESCRIPTION. A value containing a line break does not survive the fold' },
    { field: 'day.drive', json: M, ical: F, note: 'Folded into a `Drive: …` line of DESCRIPTION. Same line limit' },
    { field: 'day.chargeStops', json: M, ical: F, note: 'Folded into a `Charge stops: …` line of DESCRIPTION. Same line limit' },
    { field: 'day.nacs', json: M, ical: F, note: 'Folded into a `NACS: …` line of DESCRIPTION. Same line limit' },
    { field: 'day.summary', json: M, ical: F, note: 'Folded into a `Summary: …` line of DESCRIPTION. Same line limit' },
    { field: 'day.dining[]', json: M, ical: F, note: 'Folded into a `Dining: …` line of DESCRIPTION, joined with `; ` and split on `;` — so a value containing a semicolon does not survive, and neither does surrounding whitespace' },
    { field: 'day.tips[]', json: M, ical: F, note: 'Folded into a `Tips: …` line of DESCRIPTION, joined with `; ` and split on `;`. Same limits as dining' },
    { field: 'day.x.iCal', json: M, ical: P, note: '[extension] the day event’s UID, and any property on it the model does not name — a VALARM among them, kept whole. ATTENDEE is not here: it folds into trip.travelers[] and is written back from the model' },
    { field: 'day.x.tripDataJson', json: P, ical: D, note: '[extension] day-level wire fields the model does not name' },
  ];

  var ITEM = [
    { field: 'item.id', json: M, ical: P, note: 'The UID is derived from it (03-data-model.md §3) and stored in x.iCal — unless it is the UID this app derived, which is a function of the id and is not kept twice' },
    { field: 'item.title', json: M, ical: M, note: '`activity` on the wire; `SUMMARY` in the calendar' },
    { field: 'item.time', json: M, ical: M, note: '`time` on the wire; the DTSTART time in the calendar' },
    { field: 'item.timeRaw', json: M, ical: D, note: 'The original unparsed string. Disclosed. Written back when it parses to the item’s own time; a raw this format cannot read is written as it stands, and comes back as the raw' },
    { field: 'item.type', json: M, ical: D, note: 'Not a VEVENT concept. Disclosed. Derived from the flags, never carried by the wire' },
    { field: 'item.location', json: M, ical: M, note: 'LOCATION' },
    { field: 'item.cost', json: M, ical: D, note: 'Disclosed. A non-numeric cost is kept verbatim in the bag and written back' },
    { field: 'item.currency', json: M, ical: D },
    { field: 'item.durationMin', json: M, ical: F, note: 'Folded into DTEND − DTSTART' },
    { field: 'item.confirmation', json: M, ical: F, note: 'Folded into DESCRIPTION as a leading `Confirmation: …` line, so a note whose own first line reads that way is read as one on the way back in' },
    { field: 'item.notes', json: M, ical: M, note: '`desc` on the wire; `DESCRIPTION` in the calendar' },
    { field: 'item.flags', json: M, ical: D, note: 'The flag keys (charge, overnight, tour, warn, minSoc, minSocCritical). Disclosed. Unrepresentable in a calendar' },
    { field: 'item.x.iCal', json: M, ical: P, note: 'Unmodelled VEVENT properties: VALARM, RRULE, ORGANIZER, SEQUENCE, STATUS, GEO, CATEGORIES, URL, CLASS, TRANSP, PRIORITY, CREATED, LAST-MODIFIED. ATTENDEE is NOT here: it is folded into trip.travelers[] and written back from the model, so bagging it as well would put two on one event' },
    { field: 'item.x.tripDataJson', json: P, ical: D, note: '[extension] item-level wire fields the model does not name' },
  ];

  // §3.3 Collections. A row naming a whole collection covers every field beneath it — the mappers
  // copy those fields verbatim — so the rows below are as coarse as the spec’s table, with a finer
  // row only where the spec itself writes an "M / D" slash.
  var COLLECTIONS = [
    { field: 'lodging[]', json: M, ical: D, note: 'All six fields. Disclosed. A lodging stay is not an itinerary entry in this model' },
    { field: 'reservations[]', json: M, ical: D, note: 'All eight trip-data.json fields. Disclosed' },
    { field: 'reservations[].done', json: M, ical: D, note: 'On the wire `done: false` is written as an absent key; both mean not done' },
    { field: 'noReservationNeeded[]', json: M, ical: D, note: 'Both fields. Disclosed' },
    { field: 'preTripActions[]', json: M, ical: D, note: 'All four fields. Disclosed' },
    { field: 'preTripActions[].done', json: M, ical: D, note: 'Same convention as reservations: false is written as an absent key' },
    { field: 'bucketList[]', json: M, ical: D, note: 'All three fields. Disclosed' },
    { field: 'chargingNetworks[]', json: M, ical: D, note: 'All five fields. Disclosed' },
    { field: 'minSocThresholds[]', json: M, ical: D, note: 'All six fields. Disclosed' },
    { field: 'locations[]', json: M, ical: D, note: 'All eight fields including the nested activities[]. Disclosed' },
    { field: 'contacts[]', json: M, ical: D, note: 'Both fields. Disclosed' },
    { field: 'keyTips[]', json: M, ical: F, note: 'Folded into X-WR-CALDESC, one tip per line. An empty tip does not survive, and neither does a tip containing a line break' },
    { field: 'criticalAlerts[]', json: M, ical: D, note: 'All three fields. Disclosed. A VALARM is not an alert here — it is an alarm on an event, and conflating them would be the "folded" category used dishonestly' },
    { field: 'checklists[]', json: M, ical: D, note: 'The wire shape is {category: string[]}. Disclosed' },
    { field: 'checklists[].id', json: D, ical: D, note: 'That shape has nowhere to put an id, so import mints a fresh one' },
    { field: 'checklists[].items[].id', json: D, ical: D, note: 'Same wire shape, same reason: the element is a bare string' },
    { field: 'checklists[].items[].done', json: D, ical: D, note: 'The format has no place for it. This is today’s behaviour (app/io.js:235) made explicit' },
    { field: 'budgetEstimates[]', json: M, ical: D, note: 'All four fields. Disclosed' },
    { field: 'budget.categories', json: D, ical: D, note: 'Derived, never stored (03-data-model.md §2.3)' },
    { field: 'expenses[]', json: M, ical: D, note: 'All five fields. Disclosed' },
  ];

  function entries() {
    return TRIP.concat(DAY, ITEM, COLLECTIONS);
  }

  function forFormat(format) {
    var key = format === 'ical' ? 'ical' : 'json';
    return entries().map(function (e) {
      return { field: e.field, kind: e[key], note: e.note || '' };
    });
  }

  // Everything the format cannot carry, in the order the ledger declares it. This is what the
  // export dialog shows (06-interchange.md §3.4) — the disclosure is generated from the
  // ledger, so it cannot drift from it.
  function disclosures(format) {
    var key = format === 'ical' ? 'ical' : 'json';
    return entries()
      .filter(function (e) { return e[key] === D; })
      .map(function (e) { return { field: e.field, note: e.note || '' }; });
  }

  // The ledger's classification of one RUNTIME path (`days[0].items[0].title`).
  //
  // Resolution is exact match first, then the LONGEST declared field that bounds the path on a
  // segment boundary. The second rule is what lets the ledger stay as coarse as the spec's tables
  // while still classifying every path the model can emit: `item.flags` covers `item.flags.charge`,
  // `lodging[]` covers `lodging[0].location`, `trip.vehicle` covers `trip.vehicle.model`. Without
  // it, mirroring the spec’s rows literally would report every field beneath a collection as
  // unclassified — and a completeness check that can only pass when the ledger is written in some
  // other dialect is one that gets turned off.
  //
  // `null` means the ledger says nothing about the path — which is exactly what a completeness
  // failure IS. One function, so the completeness check and a test asking "what does the ledger
  // call this?" can never disagree about what the ledger says.
  //
  // It takes a runtime path, not a ledger path: `ledgerPath` is applied here, so passing an
  // already-translated path would translate it twice.
  function kindOf(runtimePath, format) {
    var key = format === 'ical' ? 'ical' : 'json';
    var p = ledgerPath(runtimePath);
    var list = entries();
    var i;

    for (i = 0; i < list.length; i++) if (list[i].field === p) return list[i][key];

    var best = null;
    var bestLen = -1;
    for (i = 0; i < list.length; i++) {
      var f = list[i].field;
      // `a.b.*` is a declared wildcard: it covers anything below `a.b.`, at any depth.
      var star = f.slice(-2) === '.*';
      var prefix = star ? f.slice(0, -1) : f;
      if (prefix.length <= bestLen) continue;
      if (p.length <= prefix.length) continue;
      if (p.slice(0, prefix.length) !== prefix) continue;
      // A declared field bounds whole segments only: `day.date` must not cover `day.datex`.
      if (!star) {
        var next = p.charAt(prefix.length);
        if (next !== '.' && next !== '[' && next !== '@') continue;
      }
      bestLen = prefix.length;
      best = list[i][key];
    }
    return best;
  }

  // Mechanical completeness (REQ-809): every canonical field path the model can emit must be
  // classified for both formats. The test suite feeds a maximally populated trip through
  // TP.model and asserts every resulting path is present here.

    for (var i = 0; i < days.length; i++) {
      var d = days[i];
      if (!isObject(d)) continue;
      if (typeof d.id === 'number') return 'days[].id';
      if (typeof d.chargeStops === 'number') return 'days[].chargeStops';
      if (typeof d.nacs === 'boolean') return 'days[].nacs';
      var items = Array.isArray(d.items) ? d.items : [];
      for (var j = 0; j < items.length; j++) {
        if (isObject(items[j]) && typeof items[j].minSoc === 'string') return 'days[].items[].minSoc';
      }
    }
    var thresholds = Array.isArray(w.minSocThresholds) ? w.minSocThresholds : [];
    for (var t = 0; t < thresholds.length; t++) {
      if (isObject(thresholds[t]) && typeof thresholds[t].minSoc === 'string') return 'minSocThresholds[].minSoc';
    }
    return null;
  }

  // `minSoc` in place on a copied entity: a numeric string becomes the number, text this generation
  // cannot read moves beside the entity as `minSocRaw` — the same treatment a non-numeric `cost`
  // gets in `toItem`, so a value the wire spelled in prose survives instead of being dropped by
  // `numOrUndef`.
  function upgradeMinSoc(entity) {
    if (typeof entity.minSoc === 'number') return;
    if (typeof entity.minSoc !== 'string') return;
    if (numericString(entity.minSoc)) { entity.minSoc = Number(entity.minSoc); return; }
    if (entity.minSocRaw === undefined) entity.minSocRaw = entity.minSoc;
    delete entity.minSoc;
  }

  function upgradeNetwork(network) {
    var out = copyShallow(network);
    if (typeof out.nacsAdapter === 'string') {
      var word = out.nacsAdapter.toLowerCase();
      if (word === 'true') out.nacsAdapter = true;
      else if (word === 'false') out.nacsAdapter = false;
      else {
        if (out.nacsAdapterRaw === undefined) out.nacsAdapterRaw = out.nacsAdapter;
        delete out.nacsAdapter;
      }
    }
    return out;
  }

  function upgradeDay(day) {
    var out = copyShallow(day);
    if (typeof out.id === 'number') out.id = String(out.id);
    if (typeof out.chargeStops === 'number') out.chargeStops = String(out.chargeStops);
    if (typeof out.nacs === 'boolean') {
      // The text the v1 UI rendered for the flag (`app/ui/charging.js:78`); false is absent, not a
      // string saying "false" (ADR-0018).
      if (out.nacs) out.nacs = 'NACS';
      else delete out.nacs;
    }
    if (Array.isArray(day.items)) {
      out.items = day.items.map(function (item) {
        if (!isObject(item)) return item;
        var copy = copyShallow(item);
        upgradeMinSoc(copy);
        return copy;
      });
    }
    return out;
  }

  // Upgrade `wire` if it is the previous generation. Returns the value to validate and map, and
  // `from` — null when nothing was done, so a caller can say so. Idempotent: every marker is gone
  // from the result, so a second call is a no-op and returns the same value.
  function upgrade(wire) {
    if (!isObject(wire)) return { value: wire, from: null, marker: null };
    var marker = generationMarker(wire);
    if (!marker) return { value: wire, from: null, marker: null };

    var out = copyShallow(wire);
    if (Array.isArray(wire.days)) {
      out.days = wire.days.map(function (d) { return isObject(d) ? upgradeDay(d) : d; });
    }
    if (Array.isArray(wire.minSocThresholds)) {
      out.minSocThresholds = wire.minSocThresholds.map(function (t) {
        if (!isObject(t)) return t;
        var copy = copyShallow(t);
        upgradeMinSoc(copy);
        return copy;
      });
    }
    if (Array.isArray(wire.chargingNetworks)) {
      out.chargingNetworks = wire.chargingNetworks.map(function (n) { return isObject(n) ? upgradeNetwork(n) : n; });
    }
    return { value: out, from: PREVIOUS_GENERATION, marker: marker };
  }

  // ---- Export ----

  function fromTrip(trip) {
    var n = TP.model.normalize(TP.model.clone(trip));
    var out = {};

    var wt = { title: n.title };
    if (n.id) wt.id = n.id;
    if (n.startDate) wt.startDate = n.startDate;
    if (n.endDate) wt.endDate = n.endDate;
    if (n.subtitle) wt.subtitle = n.subtitle;
    if (n.currency && n.currency !== 'USD') wt.currency = n.currency;
    if (n.vehicle) {
      var v = { model: n.vehicle.model };
      if (n.vehicle.batteryKWh != null) v.batteryKWh = n.vehicle.batteryKWh;
      if (n.vehicle.efficiencyMilesPerKWh != null) v.efficiencyMilesPerKWh = n.vehicle.efficiencyMilesPerKWh;
      if (n.vehicle.fullRangeMiles != null) v.fullRangeMiles = n.vehicle.fullRangeMiles;
      if (n.vehicle.usableRangeMiles != null) v.usableRangeMiles = n.vehicle.usableRangeMiles;
      if (n.vehicle.chargingConvention) v.chargingConvention = n.vehicle.chargingConvention;
      emitUnknown(v, n.vehicle);
      out.trip = wt;
      wt.vehicle = v;
    }
    // Destinations and travellers keep the incumbent bare-name shape — a file that came in as
    // names goes out as names. An object appears only when the entity carries something a bare name
    // cannot: an identity the file itself supplied, or a bag. Inventing a field on the wire that
    // the entity does not have is what makes a round trip stop being a fixed point.
    //
    // "A bag" means either format's. Checking only this format's was a real loss: a traveller whose
    // only bag is the calendar's (`x.iCal.EMAIL`, which is where an `.ics` import puts the address)
    // took the bare-name branch, and the bare name has nowhere to put a carrier — so the address was
    // gone after one trip through `trip-data.json`, which is exactly the case this comment said the
    // bag was here to prevent. `carryOut` is what the object branch would have written, so asking it
    // is asking the same question the branch below is about to answer.
    var dests = (n.destinations || []).filter(function (d) { return d && d.name; });
    if (dests.length) {
      wt.destinations = dests.map(function (d, i) {
        var named = d.id === TP.model.derivedId('dest', i, d.name);
        if (named && !TP.model.bag(d, FORMAT) && !TP.model.carryOut(d, FORMAT)) return d.name;
        var o = { name: d.name };
        if (!named) o.id = d.id;
        emitUnknown(o, d);
        return o;
      });
    }
    var travelers = (n.travelers || []).filter(function (t) { return t && t.name; });
    if (travelers.length) {
      wt.travelers = travelers.map(function (t, i) {
        var named = t.id === TP.model.derivedId('person', i, t.name);
        var adult = !t.type || t.type === 'adult';
        if (named && adult && !TP.model.bag(t, FORMAT) && !TP.model.carryOut(t, FORMAT)) return t.name;
        var o = { name: t.name };
        if (!named) o.id = t.id;
        if (!adult) o.type = t.type;
        emitUnknown(o, t);
        return o;
      });
    }
    emitUnknown(wt, n);
    out.trip = wt;

    out.days = (n.days || []).map(fromDay);

    for (var c = 0; c < TP.model.COLLECTIONS.length; c++) {
      var key = TP.model.COLLECTIONS[c];
      var known = COLLECTION_KEYS[key] || {};
      out[key] = (n[key] || []).map(function (item) { return fromEntity(item, known, key); });
    }

    out.keyTips = (n.keyTips || []).slice();

    // The wire shape is the incumbent `{category: string[]}` map, and the schema also accepts an
    // array of `{category, items}` entries (06-interchange.md §3.3). The map cannot hold two
    // checklists that share a name, so a trip that has two would lose a whole list here; the array
    // form is used for exactly that trip and the map for every other. An empty name and an empty
    // item are representable in both forms and are no longer dropped: the ledger lists
    // `checklists[]` as mapped and disclosed, and a silent drop is neither.
    var lists = (n.checklists || []).filter(function (c) { return !!c; });
    var seen = Object.create(null);
    var duplicated = lists.some(function (c) {
      var name = c.category || '';
      if (seen[name]) return true;
      seen[name] = true;
      return false;
    });
    if (duplicated) {
      out.checklists = lists.map(function (c) {
        return {
          category: c.category || '',
          items: (c.items || []).map(function (i) { return (i && i.text) || ''; }),
        };
      });
    } else {
      var cl = {};
      lists.forEach(function (c) {
        cl[c.category || ''] = (c.items || []).map(function (i) { return (i && i.text) || ''; });
      });
      out.checklists = cl;
    }

    out.budgetEstimates = (n.budgetEstimates || []).map(function (e) {
      var o = fromEntity(e, COLLECTION_KEYS.budgetEstimates, 'budgetEstimates');
      return o;
    });
    out.expenses = (n.expenses || []).map(function (e) {
      return fromEntity(e, COLLECTION_KEYS.expenses, 'expenses');
    });
    (n.expenses || []).forEach(function (e, i) {
      if (typeof e.amount === 'string') out.expenses[i].amount = e.amount;
    });

    return out;
  }

  function fromEntity(entity, known, collection) {
    var out = { id: entity.id };
    for (var k in known) {
      if (k === 'id') continue;
      var v = entity[k];
      if (v === undefined) continue;
      // `done: false` and an absent `done` mean the same thing on the wire.
      if (k === 'done' && !v) continue;
      out[k] = v;
    }
    if (collection === 'expenses') {
      if (!out.category) out.category = 'General';
      out.amount = Number(entity.amount) || 0;
      if (!out.label) out.label = '';
    }
    // A `…Raw` from the generation upgrade is written only while the field it stands in for is
    // absent (see `dropBag`).
    if (collection === 'minSocThresholds' && out.minSoc != null) dropBag(entity, 'minSocRaw');
    if (collection === 'chargingNetworks' && out.nacsAdapter != null) dropBag(entity, 'nacsAdapterRaw');
    emitUnknown(out, entity);
    return out;
  }

  function fromDay(day) {
    var out = { id: day.id };
    if (day.date) out.date = day.date;
    if (day.title) out.title = day.title;
    if (day.stay) out.stay = day.stay;
    if (day.drive) out.drive = day.drive;
    if (day.chargeStops) out.chargeStops = day.chargeStops;
    if (day.nacs) out.nacs = day.nacs;
    if (day.summary) out.summary = day.summary;
    out.dining = (day.dining || []).slice();
    out.tips = (day.tips || []).slice();
    out.items = (day.items || []).map(fromItem);
    emitUnknown(out, day);
    return out;
  }

  function fromItem(item) {
    // The item's id is on the wire and comes back with it. The day above it already emits its id;
    // an item that did not would lose one on every export, and `item.id` is M in the ledger.
    var out = { id: item.id };
    // `time` is the parsed form and `timeRaw` the string the wire carried, and the wire has ONE
    // slot for both. Writing the raw form back is only right when it parses to the time beside it.
    // Otherwise — an `.ics` DTSTART, say, which this mapper cannot read as a time at all — the
    // export would replace a good time with a string it cannot parse, and the time would be gone
    // on the next import. The same guard as `costRaw` below, for the same reason.
    //
    // An item with a RAW and no parsed time is one of two things, and they are told apart here: a
    // raw this format cannot read, which is written back as it stands (ledger: `item.timeRaw`), or a
    // raw that DOES parse — which is the same slot as `item.time`, so its absence means the person
    // cleared the time, and writing it back would restore the value they deleted.
    var rawTime = item.timeRaw;
    if (item.time == null) {
      if (rawTime && timeToHHMM(rawTime) === undefined) out.time = rawTime;
    } else if (rawTime && timeToHHMM(rawTime) === item.time) out.time = rawTime;
    else out.time = item.time;
    out.activity = item.title;
    if (item.notes) out.desc = item.notes;
    if (item.location) out.location = item.location;

    var bag = TP.model.bag(item, FORMAT);
    var rawCost = bag && bag.costRaw != null ? bag.costRaw : null;
    if (rawCost != null && TP.format.parseCost(rawCost) === item.cost) out.cost = rawCost;
    else if (item.cost != null) out.cost = item.cost;

    if (item.durationMin != null) out.durationMin = item.durationMin;
    if (item.currency) out.currency = item.currency;
    if (item.confirmation) out.confirmation = item.confirmation;

    var f = item.flags || {};
    if (f.charge) out.charge = true;
    if (f.overnight) out.overnight = true;
    if (f.tour) out.tour = true;
    if (f.warn) out.warn = true;
    if (f.minSoc != null) out.minSoc = f.minSoc;
    if (f.minSocCritical) out.minSocCritical = true;
    // A `minSocRaw` the generation upgrade left beside the value is written only while there is no
    // number to write (`dropBag`). `minSoc` and `minSocRaw` are two spellings of one wire slot, so a
    // person who later edits the text to a number must not leave the old prose in the file beside it.
    if (out.minSoc != null) dropBag(item, 'minSocRaw');

    emitUnknown(out, item);
    return out;
  }

  function losses() {
    return TP.ledger.disclosures('json');
  }

  return {
    ID: ID,
    FORMAT: FORMAT,
    detect: detect,
    toTrip: toTrip,
    fromTrip: fromTrip,
    upgrade: upgrade,
    PREVIOUS_GENERATION: PREVIOUS_GENERATION,
    losses: losses,
    TRIP_KEYS: TRIP_KEYS,
    DAY_KEYS: DAY_KEYS,
    ITEM_KEYS: ITEM_KEYS,
    COLLECTION_KEYS: COLLECTION_KEYS,
  };
})();
