// Reading a file the user chose (specs/06-interchange.md §2, REQ-501–REQ-505).
//
// Two rules govern this whole file:
//
//   * The text is TEXT. It is never written into the document. No iframe, no innerHTML, no
//     parser fed the file in "HTML mode" — the app reads characters and decides what they
//     are (REQ-501, REQ-502). This is the one moment the app handles bytes it did not write.
//
//   * Nothing is merged. An import produces a candidate trip and a description of what the
//     format could and could not carry; the user then decides (REQ-505). A deep merge over
//     untrusted structure is how an import silently rewrites fields the user never saw.
//
// Container parse failures arrive as thrown GuardErrors, because that is what the codec does;
// they are caught here, at the boundary, and turned into a sentence for the user.

TP.io = TP.io || {};

TP.io.import = (function () {
  'use strict';

  var MAX_SOURCE_CHARS = TP.container.LIMITS.maxSourceChars;

  // ---- Format detection ----
  //
  // By structural markers, never by filename (REQ-503). A file called trip.json that holds an
  // iCalendar is an iCalendar; the extension is a hint from a filesystem, not evidence.

  function detect(text) {
    if (typeof text !== 'string' || !text.length) return { format: 'unknown', reason: 'The file is empty.' };
    if (text.length > MAX_SOURCE_CHARS) {
      return { format: 'unknown', reason: 'This file is ' + text.length.toLocaleString() +
        ' characters, beyond the ' + MAX_SOURCE_CHARS.toLocaleString() + ' this app will read.' };
    }

    var head = text.slice(0, 8192);

    // A PVD artifact: the data block's id is the marker, and it survives any reformatting of
    // the surrounding HTML.
    if (head.indexOf('id="' + TP.container.BLOCK_ID + '"') !== -1 ||
        head.indexOf("id='" + TP.container.BLOCK_ID + "'") !== -1 ||
        /<!doctype html|<html[\s>]/i.test(head)) {
      var blockText = TP.container.scanBlock(text);
      if (blockText == null) {
        return { format: 'unknown', reason: 'This looks like a web page, but it has no planner data block in it.' };
      }
      return { format: 'artifact', blockText: blockText };
    }

    var t = text.replace(/^\uFEFF/, '').replace(/^[\s\u2028\u2029]+/, '');
    if (t.slice(0, 15).toUpperCase() === 'BEGIN:VCALENDAR') return { format: 'ical' };

    if (t.charAt(0) === '{' || t.charAt(0) === '[') {
      var value;
      try {
        // `t`, not `text`: the branch above tests the BOM-stripped string, and `JSON.parse` rejects a
        // leading U+FEFF, so parsing the raw text refused the very file this line just recognised —
        // a trip-data.json written by an editor that adds a BOM (Notepad among them).
        value = TP.container.parseJSONHardened(t, 'file');
      } catch (e) {
        return { format: 'unknown', reason: e && e.message ? e.message : 'The file is not valid JSON.' };
      }
      if (TP.tripdatajson.detect(value)) return { format: 'tripdata', value: value };
      if (value && typeof value === 'object' && value.payload && value.history) {
        return { format: 'unknown', reason: 'This file holds a planner document, but without the page around it there is nothing to show it in. Open the .html file it came from instead.' };
      }
      return { format: 'unknown', reason: 'This is JSON, but it is not trip data and not a planner document.' };
    }

    return { format: 'unknown', reason: 'This file is not a planner document, trip data, or a calendar.' };
  }

  // ---- Reading ----

  function parseText(text, options) {
    var opts = options || {};
    var found = detect(text);
    if (found.format === 'unknown') return { ok: false, reason: found.reason };

    if (found.format === 'artifact') return readArtifact(found.blockText);
    if (found.format === 'ical') return readICal(text, opts);
    if (found.format === 'tripdata') return readTripData(found.value, opts);
    return { ok: false, reason: 'This file could not be read.' };
  }

  function readArtifact(blockText) {
    var container;
    try {
      container = TP.container.parseBlock(blockText);
    } catch (e) {
      return { ok: false, reason: e && e.message ? e.message : 'The data block could not be read.' };
    }
    // The envelope is validated against the vendored schema FIRST, and by a different function
    // from the one that applies the limits below. `TP.container.validate` bounds size and count;
    // this says whether the shape is a container at all. Two questions, two answers, neither
    // standing in for the other (REQ-516, ADR-0008).
    var shape = TP.validators.check('artifact', container);
    if (!shape.ok) {
      return { ok: false, reason: TP.validators.explain(shape) };
    }
    try {
      container = TP.container.validate(container);
    } catch (e) {
      return { ok: false, reason: e && e.message ? e.message : 'The data block could not be read.' };
    }
    // Reading is structural: the file is understood, not trusted. The chain is checked where it
    // is acted on — the confirmation dialog and the open — so that one verification decides both
    // what the user is told and what happens next.
    return { ok: true, format: 'artifact', formatId: 'document', container: container };
  }

  function readTripData(value, opts) {
    // An older generation of this same format first (`ADR-0019`). `trip-data.json` carries no version
    // marker, and the shape of a value is the only evidence there is, so the upgrade is a no-op on a
    // file this generation wrote. Doing it BEFORE the validator is the point: the older spellings are
    // not type errors this app should report, they are a different generation of its own format, and a
    // validator that refuses a file the detector accepted has two answers to one question.
    var up = TP.tripdatajson.upgrade(value);
    value = up.value;
    // Validate the STRUCTURE before mapping it. The mapper is tolerant by design — it takes what it
    // can and bags the rest — so it is the wrong place to ask whether a file is well-formed: a
    // mapper asked that question answers with what it managed to salvage. This is the file that
    // says no (REQ-516).
    var shape = TP.validators.check('tripdata', value);
    if (!shape.ok) {
      return { ok: false, reason: TP.validators.explain(shape) };
    }
    var trip;
    try {
      trip = TP.tripdatajson.toTrip(value);
    } catch (e) {
      return { ok: false, reason: 'That trip data could not be read: ' + (e && e.message ? e.message : e) };
    }
    trip = TP.model.normalize(trip, opts.docId);
    return {
      ok: true,
      format: 'tripdata',
      formatId: TP.tripdatajson.ID,
      trip: trip,
      losses: TP.tripdatajson.losses(),
      blocked: [],
      // The user is told when the file was an older generation, because it is the honest answer to
      // "why does this say 1.0.0" if they open the file after exporting it again.
      message: up.from
        ? 'Read as ' + TP.tripdatajson.ID + ', upgraded from generation ' + up.from + ' (' + up.marker + ').'
        : 'Read as ' + TP.tripdatajson.ID + '.',
      upgradedFrom: up.from,
    };
  }

  function readICal(text, opts) {
    // Structural validation first, by a parser that is deliberately NOT the mapper's: a validator
    // that unfolds lines the same way the mapper does agrees with the mapper about a malformed file
    // by making the same mistake (see src/validators/ical.js).
    var shape = TP.validators.check('ical', text);
    if (!shape.ok) {
      return { ok: false, reason: TP.validators.explain(shape) };
    }
    var trip;
    try {
      trip = TP.ical.toTrip(text, opts);
    } catch (e) {
      return { ok: false, reason: 'That calendar could not be read: ' + (e && e.message ? e.message : e) };
    }
    trip = TP.model.normalize(trip, opts.docId);
    return {
      ok: true,
      format: 'ical',
      formatId: TP.ical.ID,
      trip: trip,
      losses: TP.ical.losses(),
      blocked: [],
      message: 'Read as ' + TP.ical.ID + '.',
    };
  }

  function readFile(file) {
    return new Promise(function (resolve, reject) {
      if (!file) { resolve({ ok: false, reason: 'No file was chosen.' }); return; }
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error('The file could not be read from disk.')); };
      reader.onload = function () {
        var result;
        try {
          result = parseText(String(reader.result));
        } catch (e) {
          result = { ok: false, reason: 'The file could not be read: ' + (e && e.message ? e.message : e) };
        }
        resolve(result);
      };
      // Text only. Never readAsDataURL, never readAsArrayBuffer into a decoder we did not write.
      reader.readAsText(file, 'utf-8');
    });
  }

  // A short, honest description of what came in, for the confirmation step (REQ-505).
  function describe(result) {
    if (!result || !result.ok) return '';
    if (result.format === 'artifact') {
      // What the file IS. The verdict on its history is stated separately, by the dialog that
      // shows this line, so the two cannot end up saying the same thing twice or disagreeing.
      var commits = TP.container.commits(result.container).length;
      return '“' + TP.model.tripTitle(TP.container.payloadTrip(result.container)) +
        '” — a planner document with ' + TP.format.plural(commits, 'commit') + '.';
    }
    var trip = result.trip;
    var days = (trip.days || []).length;
    var itemCount = 0;
    (trip.days || []).forEach(function (d) { itemCount += (d.items || []).length; });
    return TP.model.tripTitle(trip) + ' — ' + days + (days === 1 ? ' day' : ' days') + ', ' +
      itemCount + (itemCount === 1 ? ' item' : ' items') + '.';
  }

  return {
    MAX_SOURCE_CHARS: MAX_SOURCE_CHARS,
    detect: detect,
    parseText: parseText,
    readFile: readFile,
    describe: describe,
  };
})();

/* ------------------------------ src/io/export.js ------------------------------ */
// Producing a file (specs/02-architecture.md §5, specs/06-interchange.md §4).
//
// The document is assembled from a PRISTINE copy of the page taken before anything ran, not
// from the live DOM. This is the whole reason export is trustworthy: the running page has
// buttons, focus rings, toasts, a highlighted row, a half-typed title in an input — none of
// which belong in a file. Exporting the live DOM would write the user's momentary UI state
// into a document that is supposed to be reproducible.
//
// Every export passes five checks before the user is offered the result, and a failed check
// withholds the file rather than offering one the app has just proven wrong.

TP.io.export = (function () {
  'use strict';

  var SCRIPT_ID = 'app-script';
  var HASH_META = 'app-hash';

  // Called as boot.js's first statement, before any other code can touch the document.
  function capturePristine(root) {
    var source = root || document.documentElement;
    TP.pristine = source.cloneNode(true);
    return TP.pristine;
  }

  function pristine() {
    if (!TP.pristine) throw new Error('export: the pristine copy was not captured at boot');
    return TP.pristine;
  }

  // ---- Assembly ----

  function assemble(container) {
    var clone = pristine().cloneNode(true);
    var block = clone.querySelector('#' + TP.container.BLOCK_ID);
    if (!block) throw new Error('export: the pristine copy has no #' + TP.container.BLOCK_ID + ' block');
    // textContent assigns characters; it does not parse them. The escaping is what keeps a
    // payload containing the "<\/script>" sequence from ending the block early.
    block.textContent = TP.container.toBlockText(container);
    return '<!DOCTYPE html>\n' + clone.outerHTML;
  }

  // ---- The five checks ----

  function checkDocument(html, container) {
    var checks = [];
    function add(name, ok, detail) { checks.push({ name: name, ok: !!ok, detail: detail || '' }); }

    // 1. The assembled document re-parses far enough to find the data block.
    var blockText = TP.container.scanBlock(html);
    add('The document re-reads as a document', blockText != null,
      blockText == null ? 'No data block was found in the assembled text.' : '');

    // 2. The block's text is JSON.
    var parsed = null;
    var parseError = '';
    if (blockText != null) {
      try { parsed = TP.container.parseBlock(blockText); }
      catch (e) { parseError = e && e.message ? e.message : String(e); }
    }
    add('The data block is valid JSON', !!parsed, parseError);

    // 3. What came back out is what went in — compared canonically, so key order and
    //    formatting are not mistaken for content.
    var same = false;
    if (parsed) {
      try {
        same = TP.canonical.serialize(parsed) === TP.canonical.serialize(container);
      } catch (e) { same = false; }
    }
    add('The data block carries exactly this document', same,
      same ? '' : 'The document read back differs from the one written.');

    // 4. The script text is byte-identical to the one that is running.
    var clone = pristine().cloneNode(true);
    var liveScript = document.getElementById(SCRIPT_ID);
    var cloneScript = clone.querySelector('#' + SCRIPT_ID);
    var identical = !!(liveScript && cloneScript) && liveScript.textContent === cloneScript.textContent;
    add('The program text is unchanged', identical,
      identical ? '' : 'The embedded program differs from the one running.');

    // 5. The declared hash matches the program it claims to describe.
    var declared = clone.querySelector('meta[name="' + HASH_META + '"]');
    var declaredHash = declared ? declared.getAttribute('content') : null;
    var computed = liveScript ? 'sha256-' + TP.sha256.base64(liveScript.textContent) : null;
    var hashOk = !!declaredHash && declaredHash === computed;
    add('The program matches its declared hash', hashOk,
      hashOk ? '' : 'Declared ' + (declaredHash || 'nothing') + ', computed ' + (computed || 'nothing') + '.');

    return {
      ok: checks.every(function (c) { return c.ok; }),
      checks: checks,
    };
  }

  // ---- The three exports ----

  function artifact(container) {
    var html;
    try {
      html = assemble(container);
    } catch (e) {
      return { ok: false, reason: e && e.message ? e.message : String(e), checks: [] };
    }
    var result = checkDocument(html, container);
    if (!result.ok) {
      var failed = result.checks.filter(function (c) { return !c.ok; });
      return {
        ok: false,
        checks: result.checks,
        reason: 'This file failed its own check, so it was not offered for saving. ' +
          failed.map(function (c) { return c.name + (c.detail ? ' (' + c.detail + ')' : ''); }).join(' '),
      };
    }
    return {
      ok: true,
      checks: result.checks,
      text: html,
      mime: 'text/html',
      filename: filenameFor(TP.model.tripTitle(TP.container.payloadTrip(container)) || 'trip', 'html'),
    };
  }

  function tripData(trip) {
    var value = TP.tripdatajson.fromTrip(trip);
    return {
      ok: true,
      checks: [],
      text: JSON.stringify(value, null, 2) + '\n',
      mime: 'application/json',
      filename: filenameFor(TP.model.tripTitle(trip) || 'trip', 'json'),
      losses: TP.tripdatajson.losses(),
    };
  }

  function ical(trip) {
    var out;
    try {
      out = TP.ical.fromTrip(trip);
    } catch (e) {
      return { ok: false, reason: 'The calendar could not be produced: ' + (e && e.message ? e.message : e) };
    }
    return {
      ok: true,
      checks: [],
      text: out.text,
      mime: 'text/calendar',
      filename: filenameFor(TP.model.tripTitle(trip) || 'trip', 'ics'),
      losses: out.losses,
      blocked: out.blocked || [],
      synthesized: out.synthesized || [],
    };
  }

  // What a format cannot carry, phrased for the confirmation dialog. The list is the same data
  // the mappers were written against, so the two cannot drift apart (REQ-512).
  function disclosures(format) {
    var losses = format === 'ical' ? TP.ical.losses() : format === 'tripdata' ? TP.tripdatajson.losses() : [];
    if (!losses.length) return { items: [], text: '' };
    return {
      items: losses,
      text: 'What this format cannot carry: ' + losses.map(function (l) {
        return l.field + (l.note ? ' (' + l.note + ')' : '');
      }).join('; ') + '. Everything else in your trip is included.',
    };
  }

  // ---- Delivery ----

  function filenameFor(title, ext) {
    var base = String(title || 'trip')
      .replace(/[\\/:*?"<>|]+/g, '-')
      .replace(/\s+/g, '-')
      .replace(/^[.-]+|[.-]+$/g, '')
      .slice(0, 60) || 'trip';
    return base + '.' + ext;
  }

  function download(text, filename, mime) {
    var blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    // The node is removed on the next turn, so the click has certainly been dispatched.
    setTimeout(function () {
      if (a.parentNode) a.parentNode.removeChild(a);
      URL.revokeObjectURL(url);
    }, 0);
  }

  // Returns a promise. Written without async/await so the artifact stays parseable by any
  // engine the app claims to support.
  function deliver(result) {
    if (!result || !result.ok) {
      return Promise.resolve(result || { ok: false, reason: 'Nothing to export.' });
    }
    var env = TP.environment;

    // Saving in place is offered only where the platform really has it. When it is absent the
    // download is not a downgrade, it is the same file by a route that always exists.
    if (env.canSaveInPlace && typeof window.showSaveFilePicker === 'function') {
      var accept = {};
      accept[result.mime] = ['.' + result.filename.split('.').pop()];
      return window.showSaveFilePicker({
        suggestedName: result.filename,
        types: [{ description: result.mime === 'text/html' ? 'Planner document' : 'Data file', accept: accept }],
      }).then(function (handle) {
        return handle.createWritable().then(function (writable) {
          return writable.write(result.text).then(function () { return writable.close(); });
        });
      }).then(function () {
        return {
          ok: true, via: 'save-in-place', filename: result.filename,
          checks: result.checks || [], text: result.text, offerCopy: false,
        };
      }).catch(function (e) {
        if (e && e.name === 'AbortError') {
          return { ok: false, aborted: true, reason: 'The save was cancelled. Nothing was written.' };
        }
        // Fall back to the download rather than reporting a failure the user cannot act on.
        return byDownload(result, env);
      });
    }

    return Promise.resolve(byDownload(result, env));
  }

  function byDownload(result, env) {
    download(result.text, result.filename, result.mime);
    return {
      ok: true,
      via: 'download',
      filename: result.filename,
      checks: result.checks || [],
      // A download from a file:// page can be refused by the browser's settings. The text is
      // offered in the UI as well, so there is always a route that works (REQ-510, REQ-604).
      offerCopy: !!env.prefersTextExport,
      text: result.text,
    };
  }

  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { return { ok: true, via: 'clipboard' }; })
        .catch(function () { return { ok: false, reason: 'The browser refused clipboard access. Select the text and copy it by hand.' }; });
    }
    return Promise.resolve({ ok: false, reason: 'This browser has no clipboard API. Select the text and copy it by hand.' });
  }

  return {
    SCRIPT_ID: SCRIPT_ID,
    HASH_META: HASH_META,
    capturePristine: capturePristine,
    assemble: assemble,
    checkDocument: checkDocument,
    artifact: artifact,
    tripData: tripData,
    ical: ical,
    disclosures: disclosures,
    filenameFor: filenameFor,
    download: download,
    deliver: deliver,
    copyToClipboard: copyToClipboard,
  };
})();

/* ------------------------------ src/store.js ------------------------------ */
// The document store: the one place that holds the container, the working payload, and the
// relationship between them.
//
// Three ideas hold this together:
//
//   * The WORKING payload is what the UI edits. It may differ from the head commit; that is
//     what "unsaved" means.
//
//   * A COMMIT is a deliberate boundary. Undo and redo move within the working payload and
//     therefore stop at the last commit — which is exactly the promise the UI makes when it
//     says "undo" (REQ-315). Reversing a committed change is a different, more deliberate act:
//     History → revert, which writes a FORWARD commit so that nothing is ever destroyed.
//
//   * Persistence is a cache of the file, never its owner (PAT-INV-01). Saving is best-effort
//     and its failure is disclosed; the document in the user's hand is unaffected.

TP.store = (function () {
  'use strict';

  var MAX_UNDO = 50;
  var AUTOSAVE_MS = 900;

  var state = {
    container: null,
    storage: null,
    readOnly: false,
    interactive: false,
    working: null,      // the payload being edited
    dirty: false,
    holding: false,     // true while a grouped operation owns the commit boundary
    undo: [],
    redo: [],
    lastSavedAt: null,
    saveError: null,
    persistenceNote: null,
  };

  var listeners = [];
  var autosaveTimer = null;
  var pendingMessage = null;

  function onChange(fn) {
    listeners.push(fn);
    return function () { listeners = listeners.filter(function (f) { return f !== fn; }); };
  }

  function emit(what) {
    for (var i = 0; i < listeners.length; i++) {
      try { listeners[i](what || 'change'); } catch (e) { /* one view's failure is not the store's */ }
    }
  }

  // ---- Lifecycle ----

  function init(container, storage, options) {
    var opts = options || {};
    state.container = container;
    state.storage = storage;
    state.readOnly = !!opts.readOnly;
    state.interactive = false;
    state.working = TP.model.clone(TP.container.payloadTrip(container) || TP.model.newTrip());
    state.dirty = false;
    state.holding = false;
    state.undo = [];
    state.redo = [];
    state.saveError = null;
    state.lastSavedAt = null;
    state.persistenceNote = opts.persistenceNote || describeStorage(storage);
  }

  // Adopt a document AFTER boot, completing the transition `init` deliberately leaves open.
  //
  // `init` resets `interactive` to false because boot calls it fourth and reconcile runs fifth
  // (REQ-612): the UI must not be live over a document whose own history has not been checked yet,
  // and boot re-arms the flag itself once the sequence finishes or the divergence is settled.
  //
  // Every later swap — the registry's row, New Trip, opening a file — has already done its own
  // integrity check synchronously by the time it reaches the store, so there is no window left to
  // protect: the store holds a document it can vouch for the moment `init` returns. Leaving the

// payload text can only arrive as a text node.
//
//   el(tag, props, children)  create an element

  // Anything unrecognised stays literal text, which is the safe direction to fail in.

  var INLINE_PATTERN = /(\*\*[^*]+\*\*|__[^_]+__|\*[^*\n]+\*|_[^_\n]+_|`[^`]+`|\[[^\]]+\]\([^)\s]+\)|https?:\/\/[^\s<>()]+)/g;
  var BULLET = /^\s*[-*+]\s+(.*)$/;
  var HEADING = /^\s*(#{1,6})\s+(.*)$/;

  function markdown(value) {
    var out = frag([]);
    var paragraph = [];
    var bullets = null;

    function flushParagraph() {
      if (!paragraph.length) return;
      out.appendChild(el('p', {}, inline(paragraph.join(' '))));
      paragraph = [];
    }
    function flushBullets() {
      if (!bullets) return;
      out.appendChild(el('ul', {}, bullets));
      bullets = null;
    }

    var lines = String(value == null ? '' : value).replace(/\r\n?/g, '\n').split('\n');
    lines.forEach(function (raw) {
      var line = raw.replace(/\s+$/, '');
      if (!line.trim()) { flushParagraph(); flushBullets(); return; }

      var heading = HEADING.exec(line);
      if (heading) {
        flushParagraph(); flushBullets();
        out.appendChild(el('h3', { class: 'md__head' }, inline(heading[2])));
        return;
      }
      var bullet = BULLET.exec(line);
      if (bullet) {
        flushParagraph();
        if (!bullets) bullets = [];
        bullets.push(el('li', {}, inline(bullet[1])));
        return;
      }
      flushBullets();
      paragraph.push(line.trim());
    });
    flushParagraph();
    flushBullets();
    return out;
  }

  function inline(str) {
    var s = String(str);
    var nodes = [];
    var last = 0;
    var m;
    INLINE_PATTERN.lastIndex = 0;
    while ((m = INLINE_PATTERN.exec(s)) !== null) {
      if (m.index > last) nodes.push(text(s.slice(last, m.index)));
      var node = inlineToken(m[0]);
      if (node) nodes.push(node);
      last = m.index + m[0].length;
    }
    if (last < s.length) nodes.push(text(s.slice(last)));
    return nodes;
  }

  function inlineToken(token) {
    if (token.indexOf('**') === 0 || token.indexOf('__') === 0) {
      return el('strong', {}, inline(token.slice(2, -2)));
    }
    if (token.charAt(0) === '`') return el('code', { text: token.slice(1, -1) });
    if (token.charAt(0) === '*') return el('em', {}, inline(token.slice(1, -1)));
    if (token.charAt(0) === '_') return el('em', {}, inline(token.slice(1, -1)));

    var link = /^\[([^\]]+)\]\(([^)\s]+)\)$/.exec(token);
    if (link) {
      // The label is a text node and the href goes through the scheme allowlist (REQ-704), so a
      // link a model invented cannot become `javascript:`.
      return anchor(link[2], link[1]);
    }
    return anchor(token, token);
  }

  function anchor(href, label) {
    var safe = TP.format.linkifyTarget(href);
    if (!safe) return text(label);
    return el('a', { href: safe, rel: 'noreferrer noopener', target: '_blank' }, [label]);
  }

  return {
    el: el,
    text: text,
    frag: frag,
    clear: clear,
    mount: mount,
    append: appendAll,
    show: show,
    toggleClass: toggleClass,
    region: region,
    byId: byId,
    button: button,
    labelled: labelled,
    markdown: markdown,
    isNode: isNode,
  };
})();

/* ------------------------------ src/ui/shell.js ------------------------------ */
// The shell: tabs, toolbar, and the one place that decides what is visible (specs/07-ui.md §1,
// §5).
//
// Gating is not a set of `if (isFile)` branches scattered through the views. It is a filter over
// one list (REQ-603): the tab list is computed, the panels are shown or hidden from the same
// answer, and a view never asks about the platform at all.

TP.ui.shell = (function () {
  'use strict';

  var R = null;

  // The full tab list, in order. `gate` names the reason a tab may be absent; the visibility
  // rule lives in `visible()` below, not here.
  var TABS = [
    { id: 'itinerary', label: 'Itinerary' },
    { id: 'checklists', label: 'Checklists' },
    { id: 'lodging', label: 'Lodging' },
    { id: 'bookings', label: 'Bookings' },
    { id: 'places', label: 'Places' },
    { id: 'charging', label: 'Charging', gate: 'ev' },
    { id: 'budget', label: 'Budget' },
    { id: 'ai', label: 'AI Planner', gate: 'ai' },
    { id: 'settings', label: 'Settings' },
  ];

  var PANEL_IDS = TABS.map(function (t) { return t.id; }).concat(['history']);

  var renderers = {};
  var active = 'itinerary';
  var historyOpen = false;

  function init() {
    R = TP.ui.render;
    buildTabs();
    wireToolbar();
    wireDrawer();
    wireKeys();
    reflectMode();
  }

  function registerView(id, render) {
    renderers[id] = render;
  }

  // ---- Visibility ----

  // The model's own rule, `!!(trip && trip.vehicle)` (specs/07-ui.md, REQ-609). A second, wider rule
  // here — charging networks or thresholds without a vehicle — showed a Charging tab for a trip the
  // tab itself then called "not an electric-vehicle trip", because the tab asks the model.
  function isEv(trip) {
    return TP.model.isEv(trip);
  }

  function visible(tab) {
    if (!tab.gate) return true;
    if (tab.gate === 'ai') return TP.environment.aiEnabled;
    if (tab.gate === 'ev') return isEv(TP.store.trip());
    return true;
  }

  function activeTabs() {
    return TABS.filter(visible);
  }

  function buildTabs() {
    var nav = R.byId('tabs');
    if (!nav) return;
    var trip = TP.store.trip();
    var tabs = activeTabs();

    R.mount(nav, tabs.map(function (t) {
      return R.el('button', {
        class: ['tab', t.id === active && !historyOpen ? 'tab--active' : ''],
        attrs: { role: 'tab', 'data-tab': t.id, 'aria-selected': t.id === active && !historyOpen ? 'true' : 'false' },
        on: { click: function () { setTab(t.id); } },
        text: t.label,
      });
    }));

    // A tab that is not offered must also be absent from the DOM's interactive surface, so
    // the panel is hidden and removed from the tablist rather than merely styled.
    PANEL_IDS.forEach(function (id) {
      var panel = R.byId('panel-' + id);
      if (!panel) return;
      var offered = id === 'history' ? historyOpen : tabs.some(function (t) { return t.id === id; });
      R.show(panel, offered && (id === 'history' ? historyOpen : id === active));
    });

    if (!tabs.some(function (t) { return t.id === active; })) {
      active = (tabs[0] || { id: 'settings' }).id;
    }
    refreshSaveStatus();
    void trip;
  }

  function setTab(id, options) {
    var opts = options || {};
    if (!opts.keepHistory) historyOpen = false;
    active = id;
    buildTabs();
    renderActive();
    // The earlier version mirrored the tab into `location.hash` for deep links. It is not here:
    // REQ-601 confines every use of `location` to the environment seam, and a convenience that
    // lives just outside a stated invariant is how the invariant stops being true.
    void opts;
  }

  function currentTab() { return historyOpen ? 'history' : active; }

  function openHistory() {
    historyOpen = true;
    buildTabs();
    renderActive();
  }

  function closeHistory() {
    historyOpen = false;
    buildTabs();
    renderActive();
  }

  // ---- Rendering ----

  function renderAll() {
    buildTabs();
    renderActive();
    renderSidebarFoot();
    // The document list is part of the chrome, so "render everything" includes it. Boot registers
    // this file in the registry before calling here, which is why the list is not empty on load.
    TP.ui.tripList.render();
  }

  function renderActive() {
    var id = currentTab();
    var fn = renderers[id];
    var panel = R.byId('panel-' + id);
    if (!panel) return;
    R.clear(panel);
    if (!fn) {
      R.append(panel, R.el('div', { class: 'empty' }, [
        R.el('h2', { text: 'This view is not available' }),
        R.el('p', { text: 'The part of the program that draws it did not load.' }),
      ]));
      return;
    }
    try {
      fn(panel);
    } catch (e) {
      R.clear(panel);
      R.append(panel, R.el('div', { class: 'empty' }, [
        R.el('h2', { text: 'This view could not be drawn' }),
        R.el('p', { text: (e && e.message) ? e.message : String(e) }),
      ]));
    }
  }

  // ---- Mode reflection (REQ-603, REQ-605) ----

  function reflectMode() {
    var env = TP.environment;

    // The callout. One sentence about what is limited and one about what is not, at the place
    // where a user would look for the missing feature.
    var note = R.byId('mode-note');
    if (note) {
      if (env.aiEnabled) {
        R.mount(note, []);
        R.show(note, false);
      } else {
        R.mount(note, [R.el('div', { class: 'info' }, [
          R.el('strong', { text: 'AI planning needs a web address. ' }),
          'This planner is running from a file on your disk, where the browser gives it no web ',
          'identity — so it cannot reach an AI service, and it will not store a service key ',
          'somewhere any other local file could read it. Open the same planner from ',
          R.el('code', { text: 'http(s)://' }),
          ' instead and the AI tab appears. Everything else — your itinerary, budget, bookings, ',
          'checklists, history, import and export — works exactly as it does here, from the file ',
          'on your disk.',
        ])]);
        R.show(note, true);
      }
    }

    // The tab title names the document, in the form the shell template declares (specs/02 §1):
    // app first, document after. The template's static title and this runtime one are the same
    // shape on purpose — a file that has been edited should not change what the tab is called.
    var trip = TP.store.trip();
    document.title = 'Trip Planner — ' + (trip ? TP.model.tripTitle(trip) : 'Untitled trip');

    renderSidebarFoot();
  }

  function renderSidebarFoot() {
    var foot = R.byId('storage-status');
    if (!foot) return;
    var status = TP.store.saveStatus();
    var parts = [];

    if (TP.store.isReadOnly()) {
      parts.push('Read-only');
    } else if (status.dirty) {
      parts.push('Unsaved changes');
    } else if (status.lastSavedAt) {
      parts.push('Saved locally');
    } else {
      parts.push('Not saved here yet');
    }

    if (status.storageKind === 'memory') parts.push('this session only');
    if (status.storageKind === 'null') parts.push('no local storage');

    R.mount(foot, [R.el('span', { class: 'muted', text: parts.join(' · ') })]);
    if (status.error) {
      R.append(foot, R.el('div', { class: 'muted', text: status.error }));
    }
  }

  function refreshSaveStatus() {
    var status = TP.store.saveStatus();

    var undoBtn = R.byId('undo-btn');
    var redoBtn = R.byId('redo-btn');
    if (undoBtn) undoBtn.disabled = !TP.store.canUndo();
    if (redoBtn) redoBtn.disabled = !TP.store.canRedo();

    var save = R.byId('save-status');
    if (save) {
      var label = TP.store.isReadOnly() ? 'Read-only'
        : status.dirty ? 'Unsaved'
        : status.lastSavedAt ? 'Saved' : 'Not saved here';
      R.mount(save, [R.el('span', { class: 'subtle', text: label })]);
    }

    var exportBtn = R.byId('export-btn');
    if (exportBtn) exportBtn.disabled = !TP.store.isInteractive();

    renderSidebarFoot();

    var banner = R.byId('persistence-note');
    if (banner) {
      if (status.note) {
        R.mount(banner, [R.el('div', { class: 'info info--warn', text: status.note })]);
        R.show(banner, true);
      } else {
        R.mount(banner, []);
        R.show(banner, false);
      }
    }
  }

  // ---- Toolbar ----

  function wireToolbar() {
    var map = {
      'undo-btn': function () { TP.store.undo(); renderAll(); },
      'redo-btn': function () { TP.store.redo(); renderAll(); },
      'history-btn': function () { openHistory(); },
      'new-trip-btn': function () { newTrip(); },
      'import-btn': function () { TP.ui.shell.importFile(); },
      'export-btn': function () { TP.ui.shell.exportDocument(); },
    };
    Object.keys(map).forEach(function (id) {
      var node = R.byId(id);
      if (node) node.addEventListener('click', map[id]);
    });

    var picker = R.byId('import-file');
    if (picker) {
      picker.addEventListener('change', function () {
        var file = picker.files && picker.files[0];
        picker.value = '';
        if (file) handlePickedFile(file);
      });
    }

    var storageBtn = R.byId('storage-status');
    if (storageBtn) {
      storageBtn.addEventListener('click', function () { showStorageDetail(); });
    }
  }

  function wireDrawer() {
    var app = R.byId('app');
    var menu = R.byId('menu-btn');
    var backdrop = R.byId('drawer-backdrop');
    function setOpen(open) {
      if (!app) return;
      if (open) app.classList.add('app--drawer-open');
      else app.classList.remove('app--drawer-open');
      if (menu) menu.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (backdrop) R.show(backdrop, open);
    }
    if (menu) menu.addEventListener('click', function () { setOpen(!app.classList.contains('app--drawer-open')); });
    if (backdrop) backdrop.addEventListener('click', function () { setOpen(false); });
    TP.ui.shell.closeDrawer = function () { setOpen(false); };
  }

  function wireKeys() {
    document.addEventListener('keydown', function (e) {
      var mod = e.metaKey || e.ctrlKey;
      if (mod && (e.key === 'z' || e.key === 'Z')) {
        e.preventDefault();
        if (e.shiftKey) TP.store.redo(); else TP.store.undo();
        renderAll();
        return;
      }
      if (mod && (e.key === 's' || e.key === 'S')) {
        e.preventDefault();
        var res = TP.store.commit('Manual save');
        if (!res || !res.ok) {
          TP.ui.toast.warn((res && res.reason) || 'Nothing could be saved.');
          renderAll();
          return;
        }
        // A commit with nothing new in it answers `noop` without going near storage, so "the commit
        // succeeded" is not the same question as "the document is on disk" — and the last save may
        // have failed (a writer conflict, a quota, a document with no identity). Ask the store what
        // happened before saying "Saved.": a green toast over unwritten work is the one lie this
        // app must not tell (PAT-INV-01, REQ-405).
        var saved = res.saved || TP.store.save();
        if (saved && saved.ok) TP.ui.toast.ok('Saved.');
        else TP.ui.toast.warn((saved && (saved.reason || saved.message)) || 'Nothing could be written.');
        renderAll();
      }
    });
  }

  // ---- Actions that need the shell's regions ----

  function newTrip() {
    TP.ui.tripEditor.createTrip().then(function (trip) {
      if (!trip) return;
      TP.ui.tripList.addAndOpen(trip);
      setTab('itinerary');
      renderAll();
      TP.ui.toast.ok('New trip created.');
    });
  }

  function importFile() {
    var picker = R.byId('import-file');
    if (picker) picker.click();
  }

  function handlePickedFile(file) {
    TP.io.import.readFile(file).then(function (result) {
      if (!result.ok) {
        TP.ui.toast.error(result.reason || 'That file could not be read.');
        return;
      }
      return TP.ui.reconcile.acceptImport(result);
    }).catch(function (e) {
      TP.ui.toast.error('That file could not be read: ' + (e && e.message ? e.message : e));
    });
  }

  function exportDocument() {
    TP.ui.tripEditor.exportDialog();
  }

  function showStorageDetail() {
    var status = TP.store.saveStatus();
    var storage = TP.store.storage();
    var bytes = storage && storage.bytesUsed ? storage.bytesUsed() : 0;
    R.mount(R.byId('modal-host'), []);
    TP.ui.modal.notice({
      title: 'Where this document is kept',
      body: [
        R.el('div', { class: 'info', text: storage && storage.describe ? storage.describe() : 'Nothing can be saved locally.' }),
        R.el('dl', { class: 'kv' }, [
          R.el('dt', { text: 'Storage used' }),
          R.el('dd', { text: TP.format.fmtNumber(bytes) + ' bytes' }),
          R.el('dt', { text: 'Last saved here' }),
          R.el('dd', { text: status.lastSavedAt ? TP.dates.fmtDateLong(status.lastSavedAt.slice(0, 10)) : 'not yet' }),
          R.el('dt', { text: 'Document' }),
          R.el('dd', { text: TP.store.docIdOf(TP.store.container()) || 'unsaved' }),
        ]),
        R.el('p', { class: 'subtle mt', text:
          'This copy is a cache. The file you exported is the document, and this browser may ' +
          'forget its copy at any time — clearing site data, or simply never opening this page ' +
          'again, loses nothing you have exported.' }),
      ],
    });
  }

  return {
    TABS: TABS,
    PANEL_IDS: PANEL_IDS,
    init: init,
    registerView: registerView,
    visible: visible,
    activeTabs: activeTabs,
    isEv: isEv,
    buildTabs: buildTabs,
    setTab: setTab,
    currentTab: currentTab,
    openHistory: openHistory,
    closeHistory: closeHistory,
    historyOpen: function () { return historyOpen; },
    renderAll: renderAll,
    renderActive: renderActive,
    reflectMode: reflectMode,
    refreshSaveStatus: refreshSaveStatus,
    renderSidebarFoot: renderSidebarFoot,
    newTrip: newTrip,
    importFile: importFile,
    handlePickedFile: handlePickedFile,
    exportDocument: exportDocument,
    showStorageDetail: showStorageDetail,
    closeDrawer: function () {},
  };
})();

/* ------------------------------ src/ui/trip-list.js ------------------------------ */
// The trip list in the sidebar (specs/07-ui.md §3).
//
// This lists documents this browser has SEEN, held in the registry. It is a convenience index,
// not a library: each row is a pointer, and removing a row removes the pointer and says so.
// The document itself is the file the user has, and the app never deletes that.

TP.ui.tripList = (function () {
  'use strict';

  var R = null;
  var query = '';

  function init() {
    R = TP.ui.render;
    var search = R.byId('trip-search');
    if (search) {
      search.addEventListener('input', function () {
        query = search.value || '';
        render(R.byId('trip-list'));
      });
    }
  }

  function entries() {
    var storage = TP.store.storage();
    if (!storage || !storage.available()) return [];
    var reg = TP.registry.load(storage);
    var q = query.trim().toLowerCase();
    var rows = reg.docs;
    if (q) rows = rows.filter(function (d) { return String(d.title || '').toLowerCase().indexOf(q) !== -1; });
    return rows;
  }

  function render(root) {
    R = R || TP.ui.render;
    var node = root || R.byId('trip-list');
    if (!node) return;

    var storage = TP.store.storage();
    if (!storage || !storage.available()) {
      R.mount(node, [R.el('p', { class: 'muted', text:
        'This browser is not keeping a list of trips. Open a document from a file each time.' })]);
      return;
    }

    var rows = entries();
    if (!rows.length) {
      R.mount(node, [R.el('p', { class: 'muted', text: query
        ? 'No trips match that search.'
        : 'No documents have been opened here yet. Use Import to open one, or New Trip to start.' })]);
      return;
    }

    var currentDoc = TP.store.docIdOf(TP.store.container());
    R.mount(node, rows.map(function (doc) {
      var isCurrent = doc.docId === currentDoc;
      // An entry can outlive the copy this browser kept — every load re-seeds the index from the
      // file, so a name is here from the moment a file is opened, before anything has been written.
      // The row says which it is rather than guessing (REQ-405, REQ-406: a stale entry is not an
      // error, and an entry is never deleted on the user's behalf).
      var held = TP.registry.hasLocal(storage, doc.docId);
      return R.el('button', {
        class: ['trip-item', isCurrent ? 'trip-item--active' : '', held ? '' : 'trip-item--absent'],
        attrs: { type: 'button' },
        on: { click: function () { openLocal(doc.docId); } },
      }, [
        R.el('div', { class: 'trip-item__title', text: doc.title || 'Untitled trip' }),
        R.el('div', { class: 'trip-item__meta', text: !held
          ? 'not kept in this browser — open its file'
          : doc.updatedAt
            ? TP.dates.fmtDate(doc.updatedAt.slice(0, 10))
            : 'not opened since' }),
      ]);
    }));
  }

  // Opening from the list opens THIS BROWSER'S copy, which may lag the file on disk. Saying so
  // is the whole difference between a cache and a lie (PAT-INV-01).
  function openLocal(docId) {
    var storage = TP.store.storage();
    if (!storage || !storage.available()) {
      TP.ui.toast.warn('This browser is not keeping local copies, so that document cannot be reopened from here. Open its file instead.');
      return;
    }
    var local = TP.registry.localHistory(storage, docId);
    if (!local.commits.length) {
      // The entry is left alone. It is an index row, not a record, and this app does not delete
      // the user's reminders for them — Settings has "Forget this entry" for that, deliberately.
      var doc = TP.registry.entry(storage, docId);
      TP.ui.modal.notice({
        title: 'This browser has no copy of that document',
        body: [
          R.el('p', { text: 'The list remembers “' + ((doc && doc.title) || 'that trip') + '” from a file you opened here, ' +
            'but nothing about it was ever written into this browser — so there is nothing to reopen from here.' }),
          R.el('p', { class: 'subtle', text: 'Open the document’s file (Import) to work on it. It is the copy that matters, and this list will pick it up again when you do.' }),
          R.el('p', { class: 'subtle', text: 'To remove the name from the list, use “Forget this entry” in Settings → Documents this browser has seen.' }),
        ],
      });
      return;
    }

    var chain = TP.verify.chain(local);
    if (!chain.ok) {
      var first = (chain.errors && chain.errors[0]) || null;
      TP.ui.modal.notice({
        title: 'This copy has a broken history',
        body: [R.el('p', { text: 'The copy of this document in this browser does not hold together: ' +
          (first ? 'commit ' + TP.verify.shortId(first.commitId) + ' ' + first.problem : 'no reason was recorded') + '.' }),
          R.el('p', { class: 'subtle', text: 'The app will not open it and will not repair it. Open the document\'s file instead — the file is the copy that matters.' })],
      });
      return;
    }

    var payload = TP.history.headPayload(local);
    var container = TP.container.create(payload, TP.store.buildInfo(), local);
    // `openDocument`, not `init`: this swap happens after boot, so it also marks the store
    // interactive again — otherwise Export stays disabled for the rest of the session.
    TP.store.openDocument(container, storage);
    TP.registry.touch(storage, docId);
    TP.ui.shell.reflectMode();
    TP.ui.shell.renderAll();
    TP.ui.toast.info('Opened from this browser\'s copy. Export to write a file that carries it.');
  }

  function addAndOpen(trip) {
    var container = TP.store.newDocument();
    // `newDocument` mints the document identity and carries it on the placeholder trip; the editor's
    // trip is the content that replaces it. The identity has to move across with it, because
    // `docIdOf` reads the commits first and the payload trip second — and there are no commits yet.
    // Without this the new document has no identity at all: the commit is written with an empty
    // `docId`, `verify.chain` reports "no docId", `save` refuses it, and the trip is lost on reload
    // (03-data-model.md §"New Trip", REQ-301).
    trip.docId = TP.store.docIdOf(container) || TP.uid();
    container.payload = { trip: trip };
    var res = TP.history.append(container.history, container.payload, {
      docId: trip.docId,
      author: { name: 'You', email: '' },
      timestamp: new Date().toISOString(),
      message: 'New trip',
    });
    if (res && res.history) container.history = res.history;
    TP.store.openDocument(container, TP.store.storage());
    TP.store.commit('New trip');
    render();
  }

  return {
    init: init,
    render: render,
    entries: entries,
    openLocal: openLocal,
    addAndOpen: addAndOpen,
  };
})();

/* ------------------------------ src/ui/trip-editor.js ------------------------------ */
// The trip's own fields, and the export dialog (specs/07-ui.md §4, specs/06 §4).

TP.ui.tripEditor = (function () {
  'use strict';

  var R = null;
  function r() { R = R || TP.ui.render; return R; }

  // ---- Field writers ----
  //
  // Every edit goes through TP.store.edit, so it is undone as a unit and lands in the history
  // with a label that says what changed.

  function setField(label, path, value) {
    TP.store.edit(label, function (trip) {
      var parts = path.split('.');
      var node = trip;
      for (var i = 0; i < parts.length - 1; i++) {
        if (!node[parts[i]] || typeof node[parts[i]] !== 'object') node[parts[i]] = {};
        node = node[parts[i]];
      }
      node[parts[parts.length - 1]] = value;
    });
  }

  function textField(label, path, value, options) {
    var opts = options || {};
    var input = r().el('input', {
      class: 'input',
      type: opts.type || 'text',
      value: value == null ? '' : value,
      attrs: opts.placeholder ? { placeholder: opts.placeholder } : null,
    });
    input.addEventListener('change', function () {
      var next = input.value;
      if (path === 'vehicle.model' && !next.trim()) {
        // Clearing the vehicle model is how a trip stops being an EV trip; leaving an empty
        // vehicle object behind would keep the Charging tab on for nobody. The key goes rather
        // than being nulled, because the schema says `vehicle` is an object when it is there at
        // all — see the note in `model/trip.js`.
        TP.store.edit('Remove vehicle', function (trip) { delete trip.vehicle; });
        return;
      }
      setField(label, path, next);
    });
    return r().labelled(opts.labelText || label, input);
  }

  function dateField(label, path, value) {
    var input = r().el('input', { class: 'input', type: 'date', value: value || '' });
    input.addEventListener('change', function () {
      setField(label, path, input.value || null);
      // The day list follows the dates. Shrinking the range does not delete days that still
      // hold items — itineraryDay.resync asks first.
      TP.ui.itineraryDay.resync();
    });
    return r().labelled(label, input);
  }

  function peopleControl(trip, label) {
    var input = r().el('input', { class: 'input', type: 'text', value: travelerNames(trip) });
    input.addEventListener('change', function () {
      setField(label || 'Change travelers', 'travelers', readTravelers(input.value));
    });
    return input;
  }

  // ---- Travelers ----

  function travelerNames(trip) {
    return ((trip && trip.travelers) || []).map(function (t) {
      return typeof t === 'string' ? t : (t && t.name) || '';
    }).filter(Boolean).join(', ');
  }

  function readTravelers(text) {
    return String(text || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean)
      .map(function (name) {
        var t = TP.model.newTraveler();
        t.name = name;
        return t;
      });
  }

  // ---- A whole trip, as a form ----

  function tripForm(trip) {
    var draft = trip || TP.model.newTrip({});
    var fields = {
      title: r().el('input', { class: 'input', type: 'text', value: draft.title || '', attrs: { placeholder: 'Pacific Coast, September' } }),
      subtitle: r().el('input', { class: 'input', type: 'text', value: draft.subtitle || '', attrs: { placeholder: 'Optional' } }),
      startDate: r().el('input', { class: 'input', type: 'date', value: draft.startDate || TP.dates.todayISO() }),
      endDate: r().el('input', { class: 'input', type: 'date', value: draft.endDate || '' }),
      currency: r().el('input', { class: 'input', type: 'text', value: draft.currency || 'USD', attrs: { maxlength: '8' } }),
      vehicleModel: r().el('input', { class: 'input', type: 'text', value: (draft.vehicle && draft.vehicle.model) || '', attrs: { placeholder: 'Leave blank if not driving an EV' } }),
      travelers: r().el('input', { class: 'input', type: 'text', value: travelerNames(draft) }),
    };

    var body = [
      r().el('div', { class: 'field' }, [r().el('label', { text: 'Trip name' }), fields.title]),
      r().el('div', { class: 'field' }, [r().el('label', { text: 'Subtitle' }), fields.subtitle]),
      r().el('div', { class: 'row' }, [
        r().el('div', { class: 'field' }, [r().el('label', { text: 'First day' }), fields.startDate]),
        r().el('div', { class: 'field' }, [r().el('label', { text: 'Last day' }), fields.endDate]),
      ]),
      r().el('div', { class: 'row' }, [
        r().el('div', { class: 'field' }, [r().el('label', { text: 'Currency' }), fields.currency]),
        r().el('div', { class: 'field' }, [r().el('label', { text: 'Vehicle' }), fields.vehicleModel]),
      ]),
      r().el('div', { class: 'field' }, [
        r().el('label', { text: 'People' }),
        fields.travelers,
        r().el('div', { class: 'subtle', text: 'Separate names with commas.' }),
      ]),
    ];

    return { body: body, fields: fields };
  }

  // New Trip.
  function createTrip() {
    var form = tripForm(null);
    return TP.ui.modal.open({
      title: 'New trip',
      body: form.body,
      defaultAction: 'create',
      actions: [{ id: 'cancel', label: 'Cancel' }, { id: 'create', label: 'Create' }],
    }).then(function (id) {
      if (id !== 'create') return null;
      var f = form.fields;
      var start = f.startDate.value || TP.dates.todayISO();
      var end = f.endDate.value || start;
      if (TP.dates.daysBetween(start, end) < 0) {
        // A trip that ends before it starts is not a trip. The range is swapped rather than
        // refused, because the user's intent is obvious and a dialog about it helps nobody.
        var swap = start; start = end; end = swap;
      }
      var trip = TP.model.newTrip({
        title: f.title.value || 'Untitled trip',
        startDate: start,
        endDate: end,
        currency: (f.currency.value || 'USD').toUpperCase(),
      });
      trip.subtitle = f.subtitle.value || '';
      trip.travelers = readTravelers(f.travelers.value);
      if (f.vehicleModel.value.trim()) {
        trip.vehicle = { model: f.vehicleModel.value.trim() };
      }
      return TP.model.normalize(trip);
    });
  }

  // ---- The trip's own card, drawn at the top of the itinerary (REQ-702) ----

  function renderHeader(root, trip) {
    var card = r().el('div', { class: 'card' }, [
      r().el('div', { class: 'card__head' }, [
        r().el('h2', { text: TP.model.tripTitle(trip) }),
        r().el('span', { class: 'subtle', text: dateRange(trip) }),
      ]),
      trip.subtitle ? r().el('p', { class: 'subtle mb0', text: trip.subtitle }) : null,
      r().el('div', { class: 'row mt' }, [
        textField('Trip name', 'title', trip.title, { labelText: 'Trip name' }),
        dateField('First day', 'startDate', trip.startDate),
        dateField('Last day', 'endDate', trip.endDate),
      ]),
      r().el('div', { class: 'row' }, [
        textField('Currency', 'currency', trip.currency, { labelText: 'Currency' }),
        textField('Vehicle', 'vehicle.model', trip.vehicle && trip.vehicle.model, {
          labelText: 'Vehicle', placeholder: 'Leave blank if not driving an EV',
        }),
      ]),
      r().el('div', { class: 'field' }, [
        r().el('label', { text: 'People' }),
        peopleControl(trip, 'Change travelers'),
      ]),
    ]);
    r().append(root, card);
  }

  function dateRange(trip) {
    if (!trip || !trip.startDate) return 'No dates yet';
    if (!trip.endDate || trip.endDate === trip.startDate) return TP.dates.fmtDateLong(trip.startDate);
    return TP.dates.fmtDateLong(trip.startDate) + ' – ' + TP.dates.fmtDateLong(trip.endDate);
  }

  // ---- Export (specs/06 §4) ----

  var FORMATS = [
    { id: 'artifact', label: 'Planner document (.html)', note: 'The whole thing: your trip, its history, and the program. Open it later, on any machine, and everything is there.' },
    { id: 'tripdata', label: 'Trip data (.json)', note: 'Your trip as plain data, for another program or a backup you can read.' },
    { id: 'ical', label: 'Calendar (.ics)', note: 'Your itinerary as calendar events.' },
  ];

  function exportDialog() {
    var chosen = 'artifact';
    var notes = r().el('div');

    function refreshNotes() {
      if (chosen === 'artifact') { r().mount(notes, []); return; }
      var disc = TP.io.export.disclosures(chosen);
      r().mount(notes, [r().el('div', { class: 'info', text: disc.text })]);
    }

    var options = FORMATS.map(function (f) {
      var radio = r().el('input', { type: 'radio', name: 'export-format', value: f.id, checked: f.id === chosen });
      radio.addEventListener('change', function () { if (radio.checked) { chosen = f.id; refreshNotes(); } });
      return r().el('label', { class: 'flex gap items-start mb' }, [
        radio,
        r().el('span', {}, [r().el('strong', { text: f.label }), r().el('div', { class: 'subtle', text: f.note })]),
      ]);
    });

    refreshNotes();

    return TP.ui.modal.open({
      title: 'Export',
      body: [
        r().el('p', { class: 'subtle', text: 'What would you like to save?' }),
        r().el('div', { class: 'field' }, options),
        notes,
      ],
      defaultAction: 'export',
      actions: [{ id: 'cancel', label: 'Cancel' }, { id: 'export', label: 'Export' }],
    }).then(function (id) {
      if (id !== 'export') return null;
      return doExport(chosen);
    });
  }

  function build(format) {
    var trip = TP.store.trip();
    if (format === 'tripdata') return TP.io.export.tripData(trip);
    if (format === 'ical') return TP.io.export.ical(trip);

    // The container that is written must be the one the app holds, with the working copy
    // recorded at head if there are uncommitted edits — otherwise Export would quietly drop
    // the change the user just made.
    if (TP.store.isDirty()) TP.store.commit('Save before export');
    return TP.io.export.artifact(TP.store.container());
  }

  function doExport(format) {
    var result = build(format);

    if (!result.ok) {
      return TP.ui.modal.notice({
        title: 'This file was not produced',
        body: [
          r().el('div', { class: 'info info--danger', text: result.reason || 'The export failed.' }),
          (result.checks || []).length
            ? r().el('ul', {}, result.checks.map(function (c) {
              return r().el('li', { text: (c.ok ? '✓ ' : '✗ ') + c.name + (c.detail ? ' — ' + c.detail : '') });
            }))
            : null,
        ],
      }).then(function () { return null; });
    }

    var body = [];
    if (result.checks && result.checks.length) {
      body.push(r().el('ul', { class: 'sublist' }, result.checks.map(function (c) {
        return r().el('li', { text: c.name });
      })));
    }
    if (result.synthesized && result.synthesized.length) {
      body.push(r().el('div', { class: 'info', text: 'Added so the calendar is valid: ' + result.synthesized.join(' ') }));
    }
    if (result.blocked && result.blocked.length) {
      body.push(r().el('div', { class: 'info info--warn', text: result.blocked.length +
        (result.blocked.length === 1 ? ' item has no date, so it is not in the calendar: ' : ' items have no date, so they are not in the calendar: ') +
        result.blocked.map(function (b) { return b.title || b.id; }).join(', ') +
        '. They are still in the planner document.' }));
    }
    if (result.losses && result.losses.length) {
      body.push(r().el('div', { class: 'info', text: TP.io.export.disclosures(format).text }));
    }
    body.push(r().el('p', { class: 'subtle', text: 'Save as ' + result.filename + '?' }));

    return TP.ui.modal.open({
      title: 'Save ' + result.filename,
      body: body,
      defaultAction: 'save',
      actions: [{ id: 'cancel', label: 'Cancel' }, { id: 'save', label: 'Choose where to save' }],
    }).then(function (id) {
      if (id !== 'save') return null;
      return TP.io.export.deliver(result).then(function (delivered) {
        if (delivered.aborted) return null;
        if (!delivered.ok) {
          TP.ui.toast.warn(delivered.reason || 'The file could not be saved. The text is below so you can copy it.');
          return offerText(result, false);
        }
        TP.ui.toast.ok('Saved ' + delivered.filename + '.');
        if (delivered.offerCopy) return offerText(result, true);
        return delivered;
      });
    });
  }

  // Text export: when the browser will not hand a file:// page a download, the text itself is
  // the deliverable (REQ-510, REQ-604). It is shown in a read-only textarea, which the user
  // can select — the text is set as a property, never parsed as markup.
  function offerText(result, secondary) {
    var area = r().el('textarea', { class: 'input', attrs: { rows: '12', readonly: 'readonly', 'aria-label': 'File contents' } });
    area.value = result.text;
    return TP.ui.modal.open({
      title: secondary ? 'A copy you can paste' : 'Copy this to a file',
      body: [
        r().el('p', { class: 'subtle', text: secondary
          ? 'Some browsers will not download a file from a page opened from disk. The contents are here if you want them.'
          : 'Copy this text and paste it into a new file named ' + result.filename + '.' }),
        area,
      ],
      defaultAction: 'copy',
      actions: [{ id: 'close', label: 'Close' }, { id: 'copy', label: 'Copy to clipboard' }],
    }).then(function (id) {
      if (id !== 'copy') return null;
      return TP.io.export.copyToClipboard(result.text).then(function (res) {
        if (res.ok) TP.ui.toast.ok('Copied.');
        else TP.ui.toast.warn(res.reason);
        return res;
      });
    });
  }

  // ---- Collections ----
  //
  // Lodging, bookings, places, charging networks, budget lines: all of them are the same shape
  // — a list of entities on the trip, each with a few fields. They are drawn by one function so
  // that "add a row, change a cell, remove a row" behaves identically everywhere, and so that
  // every one of them writes through TP.store.edit and therefore lands in the history.

  function collectionCard(spec) {
    var trip = spec.trip;
    var rows = trip[spec.key] || [];
    var newRow = spec.blank || function () { return { id: TP.uid() }; };

    function cell(row, col) {
      var value = row[col.key];
      // A derived column is read-only: it shows something computed from the row rather than
      // stored on it, so editing it would create a second truth (03-data-model.md §2.3).
      if (col.derive) {
        var shown = col.derive(row);
        return r().el('span', { class: 'subtle', text: shown == null || shown === '' ? '—' : String(shown) });
      }
      if (col.type === 'checkbox') {
        var box = r().el('input', { type: 'checkbox', checked: !!value, attrs: { 'aria-label': col.label } });
        box.addEventListener('change', function () { setCell(row.id, col, box.checked); });
        return box;
      }
      if (col.type === 'select') {
        var sel = r().el('select', { class: 'input', attrs: { 'aria-label': col.label } },
          (col.options || []).map(function (o) {
            var v = typeof o === 'string' ? o : o.value;
            var l = typeof o === 'string' ? o : o.label;
            return r().el('option', { value: v, text: l, selected: String(value || '') === v });
          }));
        sel.addEventListener('change', function () { setCell(row.id, col, sel.value); });
        return sel;
      }
      var input = r().el('input', {
        class: 'input',
        type: col.type === 'number' ? 'number' : col.type === 'date' ? 'date' : 'text',
        value: value == null ? '' : value,
        attrs: col.placeholder ? { placeholder: col.placeholder, 'aria-label': col.label } : { 'aria-label': col.label },
      });
      input.addEventListener('change', function () {
        var next = input.value;
        if (col.type === 'number') next = next === '' ? null : Number(next);
        setCell(row.id, col, next);
      });
      return input;
    }

    function setCell(id, col, value) {
      TP.store.edit(spec.editLabel || ('Change ' + (spec.title || spec.key).toLowerCase()), function (t) {
        var list = t[spec.key] || [];
        var target = TP.model.findIn(list, id);
        if (!target) return;
        // A cleared cell DELETES the key rather than storing a null. The wire types the number
        // columns (`minSoc`) as `number`, so a null makes an export this app's own validator
        // refuses; an absent field is not a null field (ADR-0018). `budget.setField` does the same.
        if (col.set) col.set(target, value);
        else if (value === null) delete target[col.key];
        else target[col.key] = value;
      });
      TP.ui.shell.renderAll();
    }

    var table = r().el('table', { class: 'data compact' }, [
      r().el('thead', {}, r().el('tr', {}, (spec.columns || []).map(function (c) {
        return r().el('th', { text: c.label });
      }).concat([r().el('th', { attrs: { 'aria-label': 'Actions' } })]))),
      r().el('tbody', {}, rows.map(function (row) {
        return r().el('tr', {}, (spec.columns || []).map(function (c) {
          return r().el('td', {}, cell(row, c));
        }).concat([
          r().el('td', {}, [r().button('✕', function () { removeRow(row.id); }, {
            class: 'btn btn--ghost btn--sm', attrs: { 'aria-label': 'Remove this row', title: 'Remove this row' },
          })]),
        ]));
      })),
    ]);

    var card = r().el('div', { class: 'card' }, [
      r().el('div', { class: 'card__head' }, [
        r().el('h2', { text: spec.title || spec.key }),
        r().el('span', { class: 'subtle', text: rows.length ? TP.format.plural(rows.length, 'entry', 'entries') : 'Nothing here yet' }),
      ]),
      spec.intro ? r().el('p', { class: 'subtle', text: spec.intro }) : null,
      rows.length ? table : r().el('p', { class: 'subtle', text: spec.empty || 'Nothing here yet.' }),
      r().el('div', { class: 'mt' }, [
        r().button('+ Add', function () { addRow(); }, { class: 'btn btn--primary btn--sm' }),
      ]),
    ]);

    function addRow() {
      var row = newRow();
      TP.store.edit(spec.editLabel || ('Add to ' + (spec.title || spec.key).toLowerCase()), function (t) {
        if (!Array.isArray(t[spec.key])) t[spec.key] = [];
        t[spec.key].push(row);
      });
      TP.ui.shell.renderAll();
      return row;
    }

    function removeRow(id) {
      TP.store.edit(spec.editLabel || ('Remove from ' + (spec.title || spec.key).toLowerCase()), function (t) {
        t[spec.key] = (t[spec.key] || []).filter(function (x) { return x.id !== id; });
      });
      TP.ui.shell.renderAll();
    }

    return { card: card, addRow: addRow, removeRow: removeRow };
  }

  return {
    setField: setField,
    textField: textField,
    dateField: dateField,
    peopleControl: peopleControl,
    tripForm: tripForm,
    createTrip: createTrip,
    renderHeader: renderHeader,
    dateRange: dateRange,
    travelerNames: travelerNames,
    readTravelers: readTravelers,
    exportDialog: exportDialog,
    doExport: doExport,
    build: build,
    collectionCard: collectionCard,
    FORMATS: FORMATS,
  };
})();

/* ------------------------------ src/ui/itinerary-day.js ------------------------------ */
// The itinerary: the trip's days and the items in them (specs/07-ui.md §4).

TP.ui.itineraryDay = (function () {
  'use strict';

  var R = null;
  function r() { R = R || TP.ui.render; return R; }

  function render(root) {
    var trip = TP.store.trip();
    var header = r().el('div');
    TP.ui.tripEditor.renderHeader(header, trip);
    r().append(root, header);

    r().append(root, alertsCard(trip));

    var days = trip.days || [];
    if (!days.length) {
      r().append(root, r().el('div', { class: 'empty' }, [
        r().el('h2', { text: 'No days yet' }),
        r().el('p', { text: 'Set the trip\'s first and last day above and the days appear here.' }),
        r().button('Add a day', function () { addDay(); }, { class: 'btn btn--primary' }),
      ]));
      return;
    }

    days.forEach(function (day, index) {
      r().append(root, dayCard(day, index, days.length));
    });
  }

  // ---- Things to watch for ----
  //
  // Critical alerts sit at the top of the itinerary, where a warning is worth having. They are
  // the trip's own content, not a calendar VALARM, and neither export format carries them —
  // the ledger records that as a D rather than calling them "folded" and hoping.
  function alertsCard(trip) {
    var alerts = trip.criticalAlerts || [];
    var card = r().el('div', { class: 'card' }, [
      r().el('div', { class: 'card__head' }, [
        r().el('h2', { text: 'Things to watch for' }),
        r().el('span', { class: 'flex gap ml-auto' }, [
          r().button('+ Add', function () { addAlert(); }, { class: 'btn btn--sm' }),
        ]),
      ]),
    ]);

    if (!alerts.length) {
      r().append(card, r().el('p', { class: 'subtle mb0', text: 'Anything that would catch you out: a closed pass, a ferry that stops running, a booking that needs cash.' }));
      return card;
    }

    alerts.forEach(function (alert) {
      var severity = alert.severity === 'danger' ? 'high' : alert.severity === 'warn' ? 'med' : 'low';
      r().append(card, r().el('div', { class: 'flex gap items-start mb-sm' }, [
        r().el('span', { class: 'badge badge--' + severity, text: alert.severity || 'info' }),
        r().el('span', { class: 'flex-1' }, [
          r().el('strong', { text: alert.title || '' }),
          alert.text ? r().el('div', { class: 'subtle', text: alert.text }) : null,
        ]),
        r().button('Edit', function () { addAlert(alert.id); }, { class: 'btn btn--ghost btn--sm' }),
        r().button('✕', function () { removeAlert(alert.id); }, { class: 'btn btn--ghost btn--sm', attrs: { 'aria-label': 'Remove this alert' } }),
      ]));
    });

    return card;
  }

  function addAlert(id) {
    var existing = id ? TP.model.findIn(TP.store.trip().criticalAlerts, id) : { severity: 'warn', title: '', text: '' };
    var fields = {
      title: r().el('input', { class: 'input', type: 'text', value: existing.title || '', attrs: { placeholder: 'The road over the pass closes at dusk' } }),
      severity: r().el('select', { class: 'input' }, ['info', 'warn', 'danger'].map(function (s) {
        return r().el('option', { value: s, text: s, selected: (existing.severity || 'warn') === s });
      })),
      text: r().el('textarea', { class: 'input', attrs: { rows: '3' } }),
    };
    fields.text.value = existing.text || '';
    var error = r().el('div', { class: 'subtle mt' });

    return TP.ui.modal.open({
      title: id ? 'Edit alert' : 'Add an alert',
      body: [
        r().el('div', { class: 'field' }, [r().el('label', { text: 'What' }), fields.title]),
        r().el('div', { class: 'field' }, [r().el('label', { text: 'How serious' }), fields.severity]),
        r().el('div', { class: 'field' }, [r().el('label', { text: 'Detail' }), fields.text]),
        error,
      ],
      defaultAction: 'save',
      actions: (id ? [{ id: 'cancel', label: 'Cancel' }, { id: 'delete', label: 'Delete', danger: true }] : [{ id: 'cancel', label: 'Cancel' }])
        .concat([{
          id: 'save',
          label: 'Save',
          run: function (settle) {
            if (!fields.title.value.trim()) { error.textContent = 'A title is needed.'; return; }
            TP.store.edit(id ? 'Edit an alert' : 'Add an alert', function (trip) {
              if (id) {
                var target = TP.model.findIn(trip.criticalAlerts, id);
                if (!target) return;
                target.title = fields.title.value.trim();
                target.severity = fields.severity.value;
                target.text = fields.text.value;
              } else {
                trip.criticalAlerts = trip.criticalAlerts || [];
                trip.criticalAlerts.push({
                  id: TP.uid(), title: fields.title.value.trim(),
                  severity: fields.severity.value, text: fields.text.value,
                });
              }
            });
            settle('save');
            TP.ui.shell.renderActive();
          },
        }]),
    }).then(function (chosen) {
      if (chosen === 'delete') return removeAlert(id);
      return chosen;
    });
  }

  function removeAlert(id) {
    TP.store.edit('Remove an alert', function (trip) {
      trip.criticalAlerts = (trip.criticalAlerts || []).filter(function (a) { return a.id !== id; });
    });
    TP.ui.shell.renderActive();
    return id;
  }

  function dayCard(day, index, total) {    var items = day.items || [];
    var head = r().el('div', { class: 'day__head' }, [
      r().el('span', { class: 'day__date', text: day.date ? TP.dates.fmtDateLong(day.date) : 'Day ' + (index + 1) }),
      r().el('span', { class: 'subtle', text: 'Day ' + (index + 1) + ' of ' + total }),
      r().el('span', { class: 'flex gap ml-auto' }, [
        r().button('↑', function () { moveDay(day.id, -1); }, { class: 'btn btn--ghost btn--sm', attrs: { title: 'Move this day earlier', 'aria-label': 'Move this day earlier' } }),
        r().button('↓', function () { moveDay(day.id, 1); }, { class: 'btn btn--ghost btn--sm', attrs: { title: 'Move this day later', 'aria-label': 'Move this day later' } }),
        r().button('Remove', function () { removeDay(day.id); }, { class: 'btn btn--ghost btn--sm' }),
      ]),
    ]);

    var card = r().el('div', { class: 'card day' }, [head]);

    // The day's own fields. They are the reason a day is more than a list.
    var details = r().el('div', { class: 'row' }, [
      dayTextField(day, 'title', 'Day title', 'Where you are and what the day is for'),
      dayTextField(day, 'stay', 'Stay', 'Where you sleep'),
    ]);
    r().append(card, details);
    r().append(card, r().el('div', { class: 'row' }, [
      dayTextField(day, 'drive', 'Drive', 'Distance and route'),
      dayTextField(day, 'chargeStops', 'Charge stops', ''),
    ]));
    r().append(card, r().el('div', { class: 'row' }, [
      dayTextField(day, 'nacs', 'NACS', ''),
      dayTextField(day, 'summary', 'Summary', ''),
    ]));
    r().append(card, listField(day, 'dining', 'Dining'));
    r().append(card, listField(day, 'tips', 'Tips'));

    r().append(card, r().el('hr'));

    if (!items.length) {
      r().append(card, r().el('p', { class: 'subtle', text: 'Nothing planned for this day yet.' }));
    } else {
      items.forEach(function (item, i) {
        r().append(card, itemRow(day, item, i));
      });
    }

    r().append(card, r().el('div', { class: 'flex gap mt' }, [
      r().button('+ Add an item', function () { addItem(day.id); }, { class: 'btn btn--primary btn--sm' }),
      r().button('Paste a list', function () { pasteList(day.id); }, { class: 'btn btn--sm' }),
    ]));

    return card;
  }

  function dayTextField(day, field, label, placeholder) {
    var input = r().el('input', {
      class: 'input', type: 'text', value: day[field] || '',
      attrs: placeholder ? { placeholder: placeholder } : null,
    });
    input.addEventListener('change', function () {
      editDay(day.id, 'Change ' + label.toLowerCase(), function (d) { d[field] = input.value; });
    });
    return r().el('div', { class: 'field' }, [r().el('label', { text: label }), input]);
  }

  function listField(day, field, label) {
    var input = r().el('input', {
      class: 'input', type: 'text', value: (day[field] || []).join(', '),
      attrs: { placeholder: 'Separate with commas' },
    });
    input.addEventListener('change', function () {
      var list = input.value.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
      editDay(day.id, 'Change ' + label.toLowerCase(), function (d) { d[field] = list; });
    });
    return r().el('div', { class: 'field' }, [r().el('label', { text: label }), input]);
  }

  function itemRow(day, item, index) {
    var type = TP.model.itemType(item);
    var row = r().el('div', { class: 'item' }, [
      r().el('div', { class: 'item__time', text: item.time || '—' }),
      r().el('div', {}, [
        r().el('div', { class: 'item__title', text: item.title || 'Untitled' }),
        r().el('div', { class: 'item__meta' }, [
          r().el('span', { class: 'tag tag--' + type, text: type }),
          item.location ? ' · ' + item.location : '',
          item.cost != null && item.cost !== '' ? ' · ' + item.cost : '',
          item.durationMin ? ' · ' + TP.format.plural(item.durationMin, 'minute') : '',
        ]),
        item.notes ? r().el('div', { class: 'item__meta', text: item.notes }) : null,
        item.confirmation ? r().el('div', { class: 'item__meta', text: 'Confirmation: ' + item.confirmation }) : null,
        item.link ? safeLink(item.link) : null,
      ]),
      r().el('div', { class: 'flex gap' }, [
        r().button('↑', function () { moveItem(day.id, item.id, -1); }, { class: 'btn btn--ghost btn--sm', attrs: { 'aria-label': 'Move up' } }),
        r().button('↓', function () { moveItem(day.id, item.id, 1); }, { class: 'btn btn--ghost btn--sm', attrs: { 'aria-label': 'Move down' } }),
        r().button('Edit', function () { editItem(day.id, item.id); }, { class: 'btn btn--ghost btn--sm' }),
        r().button('Delete', function () { removeItem(day.id, item.id); }, { class: 'btn btn--ghost btn--sm' }),
      ]),
    ]);
    void index;
    return row;
  }

  // A link is only a link if its scheme is one of the three the app allows (REQ-704).
  function safeLink(href) {
    var target = TP.format.linkifyTarget(href);
    if (!target) return r().el('div', { class: 'item__meta', text: String(href) });
    return r().el('div', { class: 'item__meta' }, [
      r().el('a', { href: target, attrs: { rel: 'noopener noreferrer', target: '_blank' }, text: target }),
    ]);
  }

  // ---- Mutations ----

  function editDay(dayId, label, mutate) {
    TP.store.edit(label, function (trip) {
      var day = TP.model.findDay(trip, dayId);
      if (!day) return;
      mutate(day);
    });
    TP.ui.shell.renderAll();
  }

  function editItem(dayId, itemId) {
    var trip = TP.store.trip();
    var item = TP.model.findItem(trip, dayId, itemId);
    if (!item) return;

    var fields = {
      time: r().el('input', { class: 'input', type: 'text', value: item.time || '', attrs: { placeholder: 'HH:MM' } }),
      title: r().el('input', { class: 'input', type: 'text', value: item.title || '' }),
      type: r().el('select', { class: 'input' }, ['activity', 'transport', 'lodging', 'note'].map(function (t) {
        return r().el('option', { value: t, text: t, selected: (item.type || 'activity') === t });
      })),
      location: r().el('input', { class: 'input', type: 'text', value: item.location || '' }),
      cost: r().el('input', { class: 'input', type: 'text', value: item.cost == null ? '' : item.cost, attrs: { placeholder: '$20 or 20' } }),
      durationMin: r().el('input', { class: 'input', type: 'text', value: item.durationMin == null ? '' : item.durationMin }),
      confirmation: r().el('input', { class: 'input', type: 'text', value: item.confirmation || '' }),
      link: r().el('input', { class: 'input', type: 'text', value: item.link || '', attrs: { placeholder: 'https://…' } }),
      notes: r().el('textarea', { class: 'input', attrs: { rows: '3' } }),
    };
    fields.notes.value = item.notes || '';

    return TP.ui.modal.open({
      title: 'Edit item',
      body: [
        r().el('div', { class: 'row' }, [
          r().el('div', { class: 'field' }, [r().el('label', { text: 'Time' }), fields.time]),
          r().el('div', { class: 'field' }, [r().el('label', { text: 'Type' }), fields.type]),
        ]),
        r().el('div', { class: 'field' }, [r().el('label', { text: 'What' }), fields.title]),
        r().el('div', { class: 'row' }, [
          r().el('div', { class: 'field' }, [r().el('label', { text: 'Where' }), fields.location]),
          r().el('div', { class: 'field' }, [r().el('label', { text: 'Cost' }), fields.cost]),
        ]),
        r().el('div', { class: 'row' }, [
          r().el('div', { class: 'field' }, [r().el('label', { text: 'Minutes' }), fields.durationMin]),
