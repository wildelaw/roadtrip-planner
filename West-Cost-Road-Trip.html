  function clone(v) {
    if (v === null || typeof v !== 'object') return v;
    if (Array.isArray(v)) return v.map(clone);
    var out = {};
    Object.keys(v).forEach(function (k) { out[k] = clone(v[k]); });
    return out;
  }

  // ---- Routing ----

  function chat(options) {
    if (!available()) return Promise.resolve(refusal());
    var cfg = config();
    // Mock always wins, so the whole agent loop can be exercised with no network and no spend.
    if (cfg.mock) return TP.ai.mock.chat(options, cfg);
    if (cfg.isWebGPU) return TP.ai.webgpu.chat(options, cfg);
    return TP.ai.ollama.chat(options, cfg);
  }

  function testConnection() {
    if (!available()) return Promise.resolve(refusal());
    var cfg = config();
    if (cfg.mock) return TP.ai.mock.testConnection(cfg);
    if (cfg.isWebGPU) return TP.ai.webgpu.testConnection(cfg);
    return TP.ai.ollama.testConnection(cfg);
  }

  // Web search and web fetch exist only on the Ollama Cloud endpoint. The other transports return
  // the same honest "not available in this mode" error rather than silently planning blind.
  function webSearch(options) {
    if (!available()) return Promise.resolve(refusal());
    var cfg = config();
    if (cfg.mock) return TP.ai.mock.webSearch(options);
    if (cfg.isWebGPU) return Promise.resolve(notInMode('Web search'));
    return TP.ai.ollama.webSearch(options, cfg);
  }

  function webFetch(options) {
    if (!available()) return Promise.resolve(refusal());
    var cfg = config();
    if (cfg.mock) return TP.ai.mock.webFetch(options);
    if (cfg.isWebGPU) return Promise.resolve(notInMode('Web fetch'));
    return TP.ai.ollama.webFetch(options, cfg);
  }

  function notInMode(what) {
    return { ok: false, error: { kind: 'http', status: 0, message: what + ' is only available in Ollama Cloud mode.' } };
  }

  // A one-line description of what is answering, for the panel header and the test result.
  function modeLabel(cfg) {
    cfg = cfg || config();
    if (cfg.mock) return 'Mock transport (no network)';
    if (cfg.isWebGPU) {
      var m = findModel(cfg.webgpuModel);
      return 'In this browser · ' + (m ? m.label : cfg.webgpuModel);
    }
    return (cfg.isCloud ? 'Ollama Cloud' : 'Local Ollama') + ' · ' + cfg.model;
  }

  function findModel(id) {
    for (var i = 0; i < WEBGPU_MODELS.length; i++) if (WEBGPU_MODELS[i].id === id) return WEBGPU_MODELS[i];
    return null;
  }

  // Turn a typed transport error into something the user can act on.
  function describeError(error) {
    if (!error) return 'The request failed for no stated reason.';
    var msg = error.message || 'The request failed.';
    if (error.kind === 'unavailable') return msg;
    if (error.kind === 'auth') return 'The service refused the key' + (error.status ? ' (' + error.status + ')' : '') + '. ' + (msg ? msg : 'Check the API key in Settings.');
    if (error.kind === 'cors') return 'The browser blocked the request (CORS). ' + (error.hint || '');
    if (error.kind === 'network') return 'The request never reached the service. ' + (error.hint || msg);
    if (error.kind === 'webgpu') return msg;
    return msg;
  }

  return {
    WEBGPU_MODELS: WEBGPU_MODELS,
    DEFAULT_WEBGPU_MODEL: DEFAULT_WEBGPU_MODEL,
    DEFAULTS: DEFAULTS,
    FILE_REASON: FILE_REASON,
    available: available,
    refusal: refusal,
    config: config,
    storedSettings: storedSettings,
    saveSettings: saveSettings,
    resetSettings: resetSettings,
    chat: chat,
    testConnection: testConnection,
    webSearch: webSearch,
    webFetch: webFetch,
    modeLabel: modeLabel,
    findModel: findModel,
    describeError: describeError,
    notInMode: notInMode,
  };
})();

/* ------------------------------ src/ai/ollama.js ------------------------------ */
// The Ollama HTTP client (specs/07-ui.md §3.2).
//
// Cloud: https://ollama.com — Bearer key, web search available.
// Local: http://localhost:11434 — no key, no web search.
// An optional CORS proxy prefix can be put in front of either.
//
// Every call goes through request(), which classifies failures into a typed error rather than
// letting a rejected promise reach the UI as "TypeError: Failed to fetch". The classification is
// the whole value here: a CORS block and a bad key are the same exception and need completely
// different advice.

TP.ai.ollama = (function () {
  'use strict';

  function resolveUrl(path, cfg) {
    var base = String(cfg.baseUrl || '').replace(/\/+$/, '');
    var url = base + path;
    if (!cfg.proxyUrl) return url;
    return String(cfg.proxyUrl).replace(/\/+$/, '') + url;
  }

  function headers(cfg, json) {
    var h = {};
    if (json !== false) h['Content-Type'] = 'application/json';
    if (cfg.apiKey) h['Authorization'] = 'Bearer ' + cfg.apiKey;
    return h;
  }

  // Returns { ok:true, data } | { ok:false, error:{kind, status?, message, hint?} }.
  function request(path, body, cfg, options) {
    var opts = options || {};
    var url = resolveUrl(path, cfg);
    return fetch(url, {
      method: 'POST',
      headers: headers(cfg),
      body: JSON.stringify(body),
    }).then(function (res) {
      if (res.status === 401 || res.status === 403) {
        return safeText(res).then(function (message) {
          // Ollama local also answers 403 for an origin it will not serve. The wording is what
          // tells the two apart, and they need opposite advice.
          if (res.status === 403 && /origin|cors/i.test(message)) {
            return { ok: false, error: { kind: 'cors', status: 403, message: message, hint: corsHint(cfg) } };
          }
          return { ok: false, error: { kind: 'auth', status: res.status, message: message } };
        });
      }
      if (res.status === 404) {
        return safeText(res).then(function (message) {
          return { ok: false, error: { kind: 'http', status: 404, message: message || 'Not found (check the base URL and the model name).' } };
        });
      }
      if (!res.ok) {
        return safeText(res).then(function (message) {
          return { ok: false, error: { kind: 'http', status: res.status, message: message } };
        });
      }
      if (opts.allowEmpty && res.status === 204) return { ok: true, data: null };
      return res.json().then(function (data) { return { ok: true, data: data }; },
        function () { return { ok: true, data: null }; });
    }, function (e) {
      // A fetch() that REJECTS — rather than answering with a non-2xx — is the CORS/network
      // signature. There is no status to read; the advice is the only useful output.
      return { ok: false, error: { kind: 'network', message: (e && e.message) || 'Failed to fetch', hint: corsHint(cfg) } };
    });
  }

  function safeText(res) {
    return res.text().then(function (t) { return String(t).slice(0, 600); }, function () { return ''; });
  }

  function corsHint(cfg) {
    if (cfg.mode === 'local') {
      return 'Start Ollama with: OLLAMA_ORIGINS=* OLLAMA_HOST=0.0.0.0 ollama serve';
    }
    return 'The browser may be blocked by CORS. Set a proxy URL in Settings, or route through your own relay.';
  }

  // ---- Chat (OpenAI-compatible) ----
  // options: { messages, tools, model, numCtx }
  function chat(options, cfg) {
    var body = {
      model: options.model || cfg.model,
      messages: options.messages,
      stream: false,
      // num_ctx travels through Ollama's own options object; both the /v1 and native paths read it.
      options: { num_ctx: options.numCtx || cfg.numCtx },
    };
    if (options.tools && options.tools.length) body.tools = options.tools;
    return request('/v1/chat/completions', body, cfg);
  }

  // ---- Web search and fetch (cloud only) ----

  function webSearch(options, cfg) {
    if (!cfg.isCloud) {
      return Promise.resolve({ ok: false, error: { kind: 'http', status: 0, message: 'Web search is only available in Ollama Cloud mode.' } });
    }
    var max = Math.min(10, options.maxResults || 5);
    return request('/api/web_search', { query: options.query, max_results: max }, cfg).then(function (res) {
      if (res.ok) res.data = truncateResults(res.data);
      return res;
    });
  }

  function webFetch(options, cfg) {
    if (!cfg.isCloud) {
      return Promise.resolve({ ok: false, error: { kind: 'http', status: 0, message: 'Web fetch is only available in Ollama Cloud mode.' } });
    }
    return request('/api/web_fetch', { url: options.url }, cfg).then(function (res) {
      if (res.ok && res.data && res.data.content) {
        res.data.content = TP.format.truncate(res.data.content, 8000);
      }
      return res;
    });
  }

  function truncateResults(data) {
    var results = (data && Array.isArray(data.results)) ? data.results : [];
    return {
      results: results.slice(0, 10).map(function (r) {
        return { title: r.title, url: r.url, content: TP.format.truncate(r.content, 2000) };
      }),
    };
  }

  // ---- Connection probe ----

  function testConnection(cfg) {
    if (cfg.mode === 'cloud' && !cfg.apiKey) {
      return Promise.resolve({ ok: false, error: { kind: 'auth', status: 0, message: 'No API key is set. Add one in Settings.' } });
    }
    return chat({
      messages: [{ role: 'user', content: 'Reply with the single word: ok' }],
      numCtx: 4096,
    }, cfg).then(function (res) {
      if (!res.ok) return res;
      var content = (res.data && res.data.choices && res.data.choices[0] && res.data.choices[0].message && res.data.choices[0].message.content) || '';
      return { ok: true, model: cfg.model, replied: content };
    });
  }

  return {
    chat: chat,
    webSearch: webSearch,
    webFetch: webFetch,
    testConnection: testConnection,
    resolveUrl: resolveUrl,
    corsHint: corsHint,
  };
})();

/* ------------------------------ src/ai/webgpu.js ------------------------------ */
// The in-browser WebGPU transport, over @mlc-ai/web-llm (specs/07-ui.md §3.2).
//
// Loaded lazily, and only ever from a served origin: `TP.ai.transport` refuses before this module
// is reached when `aiEnabled` is false (REQ-708), so the CDN `import()` below is unreachable from
// `file://`. Whether an opaque origin could import it at all is Q-1, carried unverified — the
// design does not depend on the answer.
//
// The envelope is the same { ok, data, error } shape the Ollama client returns, so the agent loop
// does not know which of the two answered.

TP.ai.webgpu = (function () {
  'use strict';

  // CDN URL for web-llm. esm.run (jsdelivr) serves a browser-ready bundle; esm.sh emits a
  // Node-flavoured one that references `createRequire` from Node's `module` builtin, which
  // Safari's JS engine lacks. Don't pin a version: the @v1 form 404s on this CDN.
  var WEB_LLM_URL = 'https://esm.run/@mlc-ai/web-llm';

  var enginePromise = null;   // the CreateMLCEngine promise, for the model it was built for
  var loadedModelId = null;
  var progressCb = null;

  // Function-calling is a property of the model, not of web-llm. Only the Hermes line supports it
  // reliably; the others accept `tools` and quietly ignore them.
  var FUNCTION_CALLING_PREFIXES = ['Hermes-2-Pro-', 'Hermes-3-'];

  function supported() {
    return typeof navigator !== 'undefined' && !!navigator.gpu;
  }

  function isReady() { return !!(enginePromise && loadedModelId); }
  function readyModel() { return loadedModelId; }

  function describeError(e) {
    if (!e) return 'Unknown error (nothing was thrown).';
    if (e instanceof Error) return e.message || e.name || 'Error with an empty message';
    if (typeof e === 'string') return e;
    return String(e);
  }

  // web-llm (through Apache TVM) hard-requires maxStorageBuffersPerShaderStage >= 10 at runtime
  // init, before any model loads. Older Intel Macs and some integrated GPUs report 8, and there
  // is no model-side workaround. Checking up front turns a cryptic TVM stack trace into advice.
  function checkGpuLimits() {
    if (!supported()) {
      return Promise.resolve({ ok: false, error: { kind: 'webgpu', message:
        'WebGPU is not available in this browser. Use Chrome/Edge 113+, Safari 17+, or enable WebGPU in Firefox (about:config → dom.computepainter.enabled).' } });
    }
    return navigator.gpu.requestAdapter({ powerPreference: 'high-performance' }).then(function (adapter) {
      if (!adapter) {
        return { ok: false, error: { kind: 'webgpu', message: 'No WebGPU adapter is available. Check that WebGPU is enabled in this browser.' } };
      }
      var limit = (adapter.limits && adapter.limits.maxStorageBuffersPerShaderStage) || 0;
      if (limit < 10) {
        return { ok: false, error: { kind: 'webgpu', message:
          'This GPU reports maxStorageBuffersPerShaderStage=' + limit + ', but web-llm requires at least 10. ' +
          'That is a known limitation on older Intel Macs and some integrated GPUs. Switch to Ollama Cloud ' +
          'or Local Ollama in Settings to use the AI planner.' } };
      }
      return { ok: true };
    }, function (e) {
      return { ok: false, error: { kind: 'webgpu', message: 'The GPU adapter could not be opened: ' + describeError(e) } };
    });
  }

  // Create or reuse the engine for the configured model. Changing the model rebuilds it.
  function getEngine(cfg) {
    var modelId = cfg.webgpuModel;
    if (!TP.ai.transport.findModel(modelId)) modelId = TP.ai.transport.DEFAULT_WEBGPU_MODEL;

    return checkGpuLimits().then(function (limits) {
      if (!limits.ok) return { error: limits.error };

      if (enginePromise && loadedModelId === modelId) {
        return enginePromise.then(function (engine) {
          return engine ? { engine: engine } : { error: { kind: 'webgpu', message: 'The model engine failed to start.' } };
        });
      }

      enginePromise = import(WEB_LLM_URL).then(function (lib) {
        var CreateMLCEngine = lib && lib.CreateMLCEngine;
        if (typeof CreateMLCEngine !== 'function') {
          throw new Error('web-llm loaded but CreateMLCEngine is missing (version mismatch?).');
        }
        return CreateMLCEngine(modelId, {
          initProgressCallback: function (p) { if (progressCb) progressCb(p); },
        });
      }).catch(function (e) {
        throw new Error('The model library could not be loaded from the CDN (' + describeError(e) +
          '). Check the network connection and that esm.run is reachable.');
      });

      return enginePromise.then(function (engine) {
        loadedModelId = modelId;
        return engine ? { engine: engine } : { error: { kind: 'webgpu', message: 'The model engine failed to start.' } };
      }, function (e) {
        enginePromise = null;
        loadedModelId = null;
        return { error: { kind: 'webgpu', message: describeError(e) } };
      });
    });
  }

  // Optional warm-up. The panel calls this before the first send so the one-time download can
  // stream progress into the transcript instead of looking like a hang.
  function warmUp(options) {
    var opts = options || {};
    progressCb = opts.onProgress || null;
    return getEngine(TP.ai.transport.config()).then(function (res) {
      progressCb = null;
      return res.engine ? { ok: true, model: loadedModelId } : { ok: false, error: res.error };
    }, function (e) {
      progressCb = null;
      return { ok: false, error: { kind: 'webgpu', message: describeError(e) } };
    });
  }

  function chat(options, cfg) {
    cfg = cfg || TP.ai.transport.config();
    if (cfg.mock) return TP.ai.mock.chat(options, cfg);

    return getEngine(cfg).then(function (res) {
      if (res.error) return { ok: false, error: res.error };
      var engine = res.engine;

      // web-llm is particular about system messages: the Hermes tool-calling path rejects a
      // user-supplied system message and inserts its own, which then trips an ordering error if
      // the original is still there; the template path rejects a system message anywhere but
      // index 0. Folding every system message into the first user message sidesteps all of it.
      var supportsTools = FUNCTION_CALLING_PREFIXES.some(function (p) {
        return String(loadedModelId || '').indexOf(p) === 0;
      });

      var req = { messages: normalizeMessages(options.messages), stream: false };
      if (options.tools && options.tools.length && supportsTools) req.tools = options.tools;

      return engine.chat.completions.create(req).then(function (data) {
        return { ok: true, data: data };
      }, function (e) {
        return { ok: false, error: { kind: 'webgpu', message: describeError(e) } };
      });
    });
  }

  // Returns a new array containing only user/assistant/tool roles.
  function normalizeMessages(messages) {
    if (!Array.isArray(messages)) return messages;
    var systemText = messages.filter(function (m) { return m.role === 'system'; })
      .map(function (m) { return m.content; }).join('\n\n');
    var out = [];
    var merged = false;
    messages.forEach(function (m) {
      if (m.role === 'system') return;
      if (!merged && m.role === 'user' && systemText) {
        out.push({ role: 'user', content: systemText + '\n\n' + (m.content || '') });
        merged = true;
      } else {
        out.push(m);
      }
    });
    if (!merged && systemText) out.unshift({ role: 'user', content: systemText });
    return out;
  }

  function testConnection(cfg) {
    cfg = cfg || TP.ai.transport.config();
    if (!supported()) {
      return Promise.resolve({ ok: false, error: { kind: 'webgpu', message:
        'WebGPU is not available in this browser. Use Chrome/Edge 113+, Safari 17+, or enable WebGPU in Firefox (about:config → dom.computepainter.enabled).' } });
    }
    return warmUp().then(function (res) {
      if (!res.ok) return res;
      // A load is not a run. Prove inference works, not just that the weights arrived.
      return chat({ messages: [{ role: 'user', content: 'Reply with the single word: ok' }], numCtx: 2048 }, cfg);
    }).then(function (test) {
      if (!test.ok) return test;
      var content = (test.data && test.data.choices && test.data.choices[0] && test.data.choices[0].message && test.data.choices[0].message.content) || '';
      return { ok: true, model: loadedModelId, replied: content };
    });
  }

  return {
    WEB_LLM_URL: WEB_LLM_URL,
    supported: supported,
    isReady: isReady,
    readyModel: readyModel,
    warmUp: warmUp,
    chat: chat,
    testConnection: testConnection,
    checkGpuLimits: checkGpuLimits,
  };
})();

/* ------------------------------ src/ai/agent.js ------------------------------ */
// The planning agent (specs/07-ui.md §3.3).
//
// A loop of: ask the model, run the tools it calls, feed the results back, ask again. The model
// decides when it is done by returning no tool calls; the iteration cap is the backstop for a
// model that never decides.
//
// Two things this loop is careful about:
//
//   * It writes into the WORKING payload, not the file, and holds the commit boundary open for the
//     whole run (TP.store.holdCommits). However many turns the agent takes, the user gets one
//     commit, one Cmd-Z, and one honest line in the history.
//
//   * It releases that hold in a `finally`. An agent that threw partway through would otherwise
//     leave the autosave suppressed and the run's work uncommitted — which is the one failure here
//     that could actually lose something.

TP.ai.agent = (function () {
  'use strict';

  function runAgent(instruction, handlers) {
    var h = handlers || {};
    var trip = TP.store.trip();

    if (!trip) {
      if (h.onError) h.onError({ kind: 'unavailable', message: 'There is no trip open to plan.' });
      return Promise.resolve({ ok: false, stoppedReason: 'error' });
    }
    if (!TP.ai.transport.available()) {
      // Belt and braces on top of transport's own refusal (REQ-708).
      if (h.onError) h.onError(TP.ai.transport.refusal().error);
      return Promise.resolve({ ok: false, stoppedReason: 'error' });
    }

    var cfg = TP.ai.transport.config();
    var messages = TP.ai.prompt.systemPrompt(trip).concat([TP.ai.prompt.userPlanMessage(instruction)]);
    var conversationId = TP.uid();
    var citations = [];
    var iterations = 0;
    var stoppedReason = 'limit';      // assume the cap was reached; corrected when the model stops
    var dirtyBefore = TP.store.isDirty();
    // What the working copy held when the run started. `isDirty` cannot answer "did the agent write
    // anything?" — it is true for edits the person had already made and not committed — so the run
    // is compared against this. Otherwise a run that changed nothing commits the user's own unsaved
    // edit under the message "AI planning", clears their undo stack, and reports `changed: true`.
    var before = TP.canonical.serialize(TP.store.trip());

    TP.store.holdCommits();

    function step() {
      if (iterations >= cfg.maxIterations) return Promise.resolve();

      iterations++;
      return TP.ai.transport.chat({
        messages: messages,
        tools: TP.ai.tools.schemas(TP.store.trip()),
        model: cfg.model,
        numCtx: cfg.numCtx,
      }).then(function (res) {
        if (!res.ok) {
          stoppedReason = 'error';
          if (h.onError) h.onError(res.error);
          return;
        }

        var choice = res.data && res.data.choices && res.data.choices[0];
        var msg = (choice && choice.message) || {};

        // The assistant turn goes back into the transcript WITH its tool_calls, because the model
        // needs to see which call each result belongs to on the next pass.
        messages.push({ role: 'assistant', content: msg.content == null ? null : msg.content, tool_calls: msg.tool_calls || undefined });
        if (msg.content && h.onMessage) h.onMessage({ role: 'assistant', content: msg.content });

        var calls = msg.tool_calls || [];
        if (!calls.length) {
          stoppedReason = 'done';
          return;
        }

        // Tools run in order, one at a time: several of them write into the same trip, and a
        // batch would make the order of those writes depend on how fast the network answered.
        var chain = Promise.resolve();
        calls.forEach(function (call) {
          chain = chain.then(function () {
            return TP.ai.tools.dispatch(call, { onTool: h.onTool }).then(function (out) {
              if (out.citations && out.citations.length) {
                citations = citations.concat(out.citations);
              }
              messages.push({
                role: 'tool',
                tool_call_id: call.id || (call.function && call.function.name),
                name: out.name,
                content: out.content,
              });
            });
          });
        });
        return chain.then(function () {
          if (citations.length && h.onCitations) h.onCitations(unique(citations));
          return step();
        });
      });
    }

    return step().then(function () {
      if (stoppedReason === 'limit' && h.onMessage) {
        h.onMessage({ role: 'system', content:
          'The agent reached its iteration limit and stopped. Review the itinerary and ask for more if it is incomplete.' });
      }
      return finish();
    }, function (e) {
      stoppedReason = 'error';
      if (h.onError) h.onError({ kind: 'http', status: 0, message: (e && e.message) || 'The agent stopped unexpectedly.' });
      return finish();
    });

    function finish() {
      var changed = TP.canonical.serialize(TP.store.trip()) !== before;
      TP.store.releaseCommits();
      // One commit for the whole run, and none at all if the agent wrote nothing.
      if (changed) {
        TP.store.commit('AI planning', { automatic: false });
      } else if (dirtyBefore) {
        // The run changed nothing, but there were unsaved edits before it started. Leaving them
        // uncommitted is correct: the user has not finished with them.
        TP.store.emit('edit');
      }
      saveConversation(conversationId, messages, stoppedReason);
      if (h.onDone) h.onDone({ iterations: iterations, stoppedReason: stoppedReason, conversationId: conversationId, changed: changed });
      return { ok: stoppedReason !== 'error', iterations: iterations, stoppedReason: stoppedReason, changed: changed };
    }
  }

  function unique(urls) {
    var seen = Object.create(null);
    var out = [];
    urls.forEach(function (u) {
      if (!u || seen[u]) return;
      seen[u] = true;
      out.push(u);
    });
    return out;
  }

  // Conversations are app-local and never enter the container (REQ-410). They are kept so a panel
  // reopened in the same browser can show what was said; they are not part of the document.
  function saveConversation(id, messages, stoppedReason) {
    var storage = TP.store.storage();
    if (!storage || !storage.available()) return;
    var docId = TP.store.docIdOf(TP.store.container()) || 'unknown';
    try {
      TP.registry.saveConversation(storage, {
        id: id,
        tripId: docId,                 // the registry's own key for "which document"
        stoppedReason: stoppedReason,
        createdAt: Date.now(),
        endedAt: new Date().toISOString(),
        messages: messages.map(compact).slice(-200),
      });
    } catch (e) {
      // A conversation that could not be stored is not worth a dialog: the trip is unaffected.
    }
  }

  function compact(m) {
    return {
      role: m.role,
      content: typeof m.content === 'string' ? m.content : null,
      name: m.name,
      tool_calls: m.tool_calls ? m.tool_calls.map(function (c) {
        return { id: c.id, name: c.function && c.function.name };
      }) : undefined,
    };
  }

  function conversationsFor(docId) {
    var storage = TP.store.storage();
    if (!storage || !storage.available()) return [];
    try { return TP.registry.listConversations(storage, docId); } catch (e) { return []; }
  }

  return {
    runAgent: runAgent,
    conversationsFor: conversationsFor,
  };
})();

/* ------------------------------ src/ai/tools.js ------------------------------ */
// Tool schemas and dispatch for the planning agent (specs/07-ui.md §3.3).
//
// Every write-back tool goes through `TP.store.edit`, which means three things for free and on
// purpose: the change is undoable, it lands in the working payload rather than the file, and it
// becomes ONE commit when the agent stops. An agent that took forty turns should not put forty
// lines in the history — the user asked for one thing.
//
// The EV tools are injected only when the trip has a vehicle, so a model planning a petrol trip is
// never told about charging.
//
// One deliberate omission from the earlier version: there is no `set_budget` tool. The canonical
// model derives the budget from its line items and deletes any stored total, so a tool that wrote
// one would appear to succeed and then vanish on the next load. `add_budget_estimate` is the whole
// surface.

TP.ai.tools = (function () {
  'use strict';

  var WEB_TOOLS = [
    fn('web_search', 'Search the web for current information: opening hours, prices, events, transport. Ollama Cloud mode only.', {
      query: { type: 'string' },
      max_results: { type: 'integer' },
    }, ['query']),
    fn('web_fetch', 'Fetch and read the content of a URL found by web_search. Ollama Cloud mode only.', {
      url: { type: 'string' },
    }, ['url']),
  ];

  var PLANNING_TOOLS = [
    fn('get_trip_summary', 'Read the current trip: dates, days, existing items, budget, collections. Use this before planning so you do not duplicate what is there.', {}, []),
    fn('add_itinerary_item', 'Add one item to a specific day of the trip.', {
      date: { type: 'string', description: 'ISO date, YYYY-MM-DD' },
      dayIndex: { type: 'integer', description: '0-based day index, as an alternative to date' },
      type: { type: 'string', enum: ['activity', 'transport', 'lodging', 'note'] },
      title: { type: 'string' },
      time: { type: 'string', description: 'HH:MM, 24-hour. Optional' },
      location: { type: 'string' },
      cost: { type: 'number' },
      currency: { type: 'string' },
      durationMin: { type: 'integer' },
      confirmation: { type: 'string' },
      notes: { type: 'string' },
    }, ['title']),
    fn('set_day_plan', 'Replace an entire day with several items at once. Prefer this when planning a full day.', {
      date: { type: 'string' },
      dayIndex: { type: 'integer' },
      items: {
        type: 'array',
        items: {
          type: 'object',
          properties: {
            type: { type: 'string', enum: ['activity', 'transport', 'lodging', 'note'] },
            title: { type: 'string' },
            time: { type: 'string' },
            location: { type: 'string' },
            cost: { type: 'number' },
            currency: { type: 'string' },
            durationMin: { type: 'integer' },
            notes: { type: 'string' },
          },
          required: ['title'],
        },
      },
    }, ['items']),
    fn('set_day_meta', 'Set a day\'s own fields: title, drive summary, stay, summary text, dining list or tips. The companion to set_day_plan.', {
      date: { type: 'string' },
      dayIndex: { type: 'integer' },
      title: { type: 'string' },
      drive: { type: 'string' },
      stay: { type: 'string' },
      summary: { type: 'string' },
      dining: { type: 'array', items: { type: 'string' } },
      tips: { type: 'array', items: { type: 'string' } },
    }, []),
    fn('add_activity_to_day', 'Add a place or activity to a specific day as an itinerary item.', {
      date: { type: 'string' },
      title: { type: 'string' },
      location: { type: 'string' },
      time: { type: 'string' },
      notes: { type: 'string' },
    }, ['date', 'title']),
    fn('add_lodging', 'Record a lodging stay: where the traveller sleeps.', {
      location: { type: 'string' },
      checkIn: { type: 'string', description: 'YYYY-MM-DD' },
      checkOut: { type: 'string' },
      area: { type: 'string' },
      notes: { type: 'string' },
    }, ['location']),
    fn('add_reservation', 'Record something that needs booking, with a deadline and how to book it.', {
      what: { type: 'string' },
      when: { type: 'string' },
      bookBy: { type: 'string' },
      cost: { type: 'string' },
      howToBook: { type: 'string' },
      priority: { type: 'string', enum: ['high', 'med', 'low'] },
    }, ['what']),
    fn('add_pre_trip_action', 'Record a pre-trip todo: documents, packing, preparation.', {
      text: { type: 'string' },
      category: { type: 'string' },
      priority: { type: 'string', enum: ['high', 'med', 'low'] },
    }, ['text']),
    fn('add_location', 'Add a place to the location library: a point of interest with a summary, lodging, charging, dining and activities.', {
      name: { type: 'string' },
      icon: { type: 'string' },
      summary: { type: 'string' },
      lodging: { type: 'string' },
      charging: { type: 'array', items: { type: 'string' } },
      dining: { type: 'array', items: { type: 'string' } },
      activities: {
        type: 'array',
        items: { type: 'object', properties: { name: { type: 'string' }, type: { type: 'string' }, desc: { type: 'string' } } },
      },
    }, ['name']),
    fn('add_bucket_item', 'Add a must-see item to the bucket list, optionally on a date.', {
      name: { type: 'string' },
      date: { type: 'string' },
      dateLabel: { type: 'string' },
    }, ['name']),
    fn('add_checklist_item', 'Add an item to a checklist category, creating the category if it is missing.', {
      category: { type: 'string' },
      text: { type: 'string' },
    }, ['category', 'text']),
    fn('add_budget_estimate', 'Add a budget line item: category, item, cost. The budget total rolls up from these automatically.', {
      category: { type: 'string' },
      item: { type: 'string' },
      cost: { type: 'string', description: 'free text, e.g. "$450" or "est. $450-600"' },
      optional: { type: 'boolean' },
    }, ['category', 'item']),
    fn('add_contact', 'Record a useful contact: what it is for, and how to reach it.', {
      what: { type: 'string' },
      how: { type: 'string' },
    }, ['what']),
    fn('add_key_tip', 'Record a short piece of advice for this trip.', {
      text: { type: 'string' },
    }, ['text']),
    fn('add_alert', 'Record a critical alert — a road closure, weather, a reservation deadline — with its severity.', {
      severity: { type: 'string', enum: ['danger', 'warn'] },
      title: { type: 'string' },
      text: { type: 'string' },
    }, ['title']),
    fn('add_expense', 'Record money actually spent.', {
      date: { type: 'string' },
      category: { type: 'string' },
      amount: { type: 'number' },
      item: { type: 'string' },
    }, ['amount', 'category']),
  ];

  var EV_TOOLS = [
    fn('add_charging_stop', 'Record a charging network or station the traveller plans to use.', {
      name: { type: 'string' },
      location: { type: 'string' },
      network: { type: 'string' },
      nacsAdapter: { type: 'boolean' },
    }, ['name']),
    fn('set_min_soc', 'Set a minimum state-of-charge threshold for a driving leg.', {
      day: { type: 'string' },
      leg: { type: 'string' },
      minSoc: { type: 'number' },
      reason: { type: 'string' },
      severity: { type: 'string', enum: ['danger', 'warn', 'info'] },
    }, ['minSoc']),
  ];

  function fn(name, description, properties, required) {
    return { type: 'function', function: { name: name, description: description, parameters: { type: 'object', properties: properties, required: required } } };
  }

  // Web tools are cloud-only, because only the Ollama Cloud endpoint has /api/web_search. The
  // other modes plan from the model's own knowledge, and telling them about a tool they cannot
  // call just produces a failed call.
  function schemas(trip) {
    var cfg = TP.ai.transport.config();
    var web = cfg.isCloud ? WEB_TOOLS : [];
    return web.concat(PLANNING_TOOLS, (trip && trip.vehicle) ? EV_TOOLS : []);
  }

  // ---- Dispatch ----

  // Returns a promise for { name, content, citations? }. `content` is what is fed back to the
  // model as the tool result, so a failure is described rather than thrown: the model can then
  // correct itself instead of the loop dying.
  function dispatch(call, options) {
    var opts = options || {};
    var name = (call.function && call.function.name) || call.name;
    var args = {};
    try { args = JSON.parse((call.function && call.function.arguments) || call.arguments || '{}') || {}; }
    catch (e) { args = {}; }

    function log(label) { if (opts.onTool) opts.onTool({ name: name, label: label }); }

    switch (name) {
      case 'web_search':
        log('Searching: "' + args.query + '"');
        return TP.ai.transport.webSearch({ query: args.query, maxResults: args.max_results || 5 }).then(function (res) {
          if (!res.ok) return { name: name, content: 'web_search failed: ' + TP.ai.transport.describeError(res.error) };
          var results = (res.data && res.data.results) || [];
          var text = results.map(function (r, i) { return '[' + (i + 1) + '] ' + r.title + '\n' + r.url + '\n' + r.content; }).join('\n\n');
          return { name: name, content: text || 'No results.', citations: results.map(function (r) { return r.url; }) };
        });

      case 'web_fetch':
        log('Fetching: ' + args.url);
        return TP.ai.transport.webFetch({ url: args.url }).then(function (res) {
          if (!res.ok) return { name: name, content: 'web_fetch failed: ' + TP.ai.transport.describeError(res.error) };
          var body = (res.data && res.data.content) || '';
          var screened = guardResult(body);
          return { name: name, content: 'Title: ' + (res.data && res.data.title) + '\nURL: ' + args.url + '\n\n' + screened, citations: [args.url] };
        });

      case 'get_trip_summary':
        log('Reading the trip');
        return settle(name, TP.ai.prompt.serializeTrip(TP.store.trip()));

      case 'add_itinerary_item': {
        log('Adding item: ' + args.title);
        var added = edit(name, 'Add "' + (args.title || 'an item') + '"', function (trip) {
          var day = resolveDay(trip, args);
          if (!day) return { error: 'no day matches ' + describeTarget(args) };
          day.items = day.items || [];
          day.items.push(newItem(args));
          return { day: day.date || ('day ' + indexOfDay(trip, day)) };
        });
        return settle(name, added.error ? 'Failed: ' + added.error : 'Added "' + args.title + '" on ' + added.day + '.');
      }

      case 'set_day_plan': {
        // A model that sends `items` as anything but a list — `{title: '…'}`, a bare string — is a
        // normal event for a small local model, and `(args.items || []).map` threw out of `dispatch`
        // and killed the whole turn, reported to the user as a network error. The failure is
        // described instead, like every other tool's: the model can correct itself and carry on.
        var list = Array.isArray(args.items) ? args.items : null;
        var count = list ? list.length : 0;
        log('Setting the plan for a day (' + count + (count === 1 ? ' item' : ' items') + ')');
        var planned = edit(name, 'Plan a day', function (trip) {
          var day = resolveDay(trip, args);
          if (!day) return { error: 'no day matches ' + describeTarget(args) };
          if (!list) return { error: 'items has to be a list of itinerary items' };
          day.items = list.map(newItem);
          return { count: day.items.length, date: day.date || ('day ' + indexOfDay(trip, day)) };
        });
        return settle(name, planned.error ? 'Failed: ' + planned.error : 'Set ' + planned.count + ' items for ' + planned.date + '.');
      }

      case 'set_day_meta': {
        log('Setting the day\'s own fields for ' + (args.date || ('day ' + args.dayIndex)));
        var meta = edit(name, 'Describe a day', function (trip) {
          var day = resolveDay(trip, args);
          if (!day) return { error: 'no day matches ' + describeTarget(args) };
          var keys = [];
          ['title', 'drive', 'stay', 'summary', 'dining', 'tips'].forEach(function (k) {
            if (args[k] == null) return;
            day[k] = Array.isArray(args[k]) ? args[k].map(String) : String(args[k]);
            keys.push(k);
          });
          return { date: day.date, keys: keys };
        });
        return settle(name, meta.error ? 'Failed: ' + meta.error
          : (meta.keys.length ? 'Updated ' + meta.date + ': ' + meta.keys.join(', ') + '.' : 'Nothing to change.'));
      }

      case 'add_activity_to_day': {
        log('Adding "' + args.title + '" to ' + args.date);
        var placed = edit(name, 'Add "' + (args.title || 'an activity') + '"', function (trip) {
          var day = resolveDay(trip, args);
          if (!day) return { error: 'no day matches ' + describeTarget(args) };
          day.items = day.items || [];
          day.items.push(newItem({
            type: 'activity', title: args.title, location: args.location,
            time: args.time, notes: args.notes,
          }));
          return { day: day.date };
        });
        return settle(name, placed.error ? 'Failed: ' + placed.error : 'Added "' + args.title + '" to ' + placed.day + '.');
      }

      case 'add_lodging':
        log('Adding lodging: ' + args.location);
        return collection(name, 'lodging', args, 'Recorded lodging "' + args.location + '".');

      case 'add_reservation':
        log('Adding reservation: ' + args.what);
        return collection(name, 'reservations', args,
          'Recorded reservation "' + args.what + '"' + (args.bookBy ? ' (book by ' + args.bookBy + ')' : '') + '.');

      case 'add_pre_trip_action':
        log('Adding pre-trip action: ' + args.text);
        return collection(name, 'preTripActions', args, 'Recorded pre-trip action "' + args.text + '".', { done: false });

      case 'add_location':
        log('Adding location: ' + args.name);
        return collection(name, 'locations', args, 'Added "' + args.name + '" to the location library.');

      case 'add_bucket_item':
        log('Adding bucket item: ' + args.name);
        return collection(name, 'bucketList', args, 'Added "' + args.name + '" to the bucket list.');

      case 'add_checklist_item': {
        log('Adding checklist item [' + args.category + '] ' + args.text);
        var wanted = String(args.category || 'General');
        var cl = edit(name, 'Add a checklist item', function (trip) {
          trip.checklists = trip.checklists || [];
          var cat = null;
          for (var i = 0; i < trip.checklists.length; i++) {
            if (String(trip.checklists[i].category).toLowerCase() === wanted.toLowerCase()) { cat = trip.checklists[i]; break; }
          }
          if (!cat) {
            cat = { id: TP.uid(), category: wanted, items: [] };
            trip.checklists.push(cat);
          }
          cat.items = cat.items || [];
          cat.items.push({ id: TP.uid(), text: String(args.text), done: false });
          return 'Added "' + args.text + '" to checklist "' + wanted + '".';
        });
        return settle(name, typeof cl === 'string' ? cl : failedOr(cl, 'Added the checklist item.'));
      }

      case 'add_budget_estimate':
        log('Adding budget estimate: ' + args.category + ' / ' + args.item);
        return collection(name, 'budgetEstimates', args,
          'Recorded budget estimate ' + args.category + ': ' + args.item + (args.cost ? ' (' + args.cost + ')' : '') + '.');

      case 'add_contact':
        log('Adding contact: ' + args.what);
        return collection(name, 'contacts', args, 'Recorded contact "' + args.what + '".');

      case 'add_key_tip':
        log('Adding a key tip');
        return settle(name, edit(name, 'Add a key tip', function (trip) {
          trip.keyTips = trip.keyTips || [];
          trip.keyTips.push(String(args.text));
          return 'Recorded the key tip.';
        }));

      case 'add_alert':
        log('Adding alert: ' + args.title);
        return collection(name, 'criticalAlerts', args, 'Recorded alert "' + args.title + '".');

      case 'add_charging_stop':
        log('Adding charging stop: ' + args.name);
        return collection(name, 'chargingNetworks', args, 'Recorded charging network "' + args.name + '".');

      case 'set_min_soc':
        log('Setting min SoC ' + args.minSoc + '% for ' + (args.leg || args.day || 'a leg'));
        return collection(name, 'minSocThresholds', args,
          'Set minimum state of charge to ' + args.minSoc + '% for ' + (args.leg || args.day || 'the leg') + '.');

      case 'add_expense':
        log('Adding expense: ' + args.amount + ' ' + args.category);
        return collection(name, 'expenses', args,
          'Recorded ' + TP.format.fmtMoney(args.amount) + ' in ' + args.category + '.');

      default:
        return settle(name, 'Unknown tool: ' + name);
    }
  }

  // A tool result is not a promise, but callers treat them uniformly.
  function settle(name, content) {
    return Promise.resolve({ name: name, content: content });
  }

  // `edit` returns the mutator's own value on success, or { error } when nothing could be written.
  function failedOr(out, ok) {
    return (out && out.error) ? 'Failed: ' + out.error : ok;
  }

  // Run a mutation through the store, then say what happened. `edit` returns whatever the mutator
  // returned, or a plain { ok } when the document is read-only.
  function edit(toolName, label, mutate) {
    if (TP.store.isReadOnly()) {
      return { error: 'the document is open read-only, so nothing could be written' };
    }
    var out = null;
    TP.store.edit(label, function (trip) { out = mutate(trip); });
    return out || {};
  }

  function collection(toolName, key, args, message, extra) {
    var payload = shallow(args);
    if (extra) Object.keys(extra).forEach(function (k) { payload[k] = extra[k]; });
    var res = edit(toolName, message, function (trip) {
      trip[key] = trip[key] || [];
      trip[key].push(payload);
      return true;
    });
    return settle(toolName, res.error ? 'Failed: ' + res.error : message);
  }

  // ---- Screening a fetched document (08-security.md §8, REQ-712) ----
  //
  // "Tool results pass the same validators as an imported file (06-interchange.md §7) before they
  // reach the model." Almost every fetched page is prose, and prose is not a document: it is passed
  // through as text and never interpreted. The case this exists for is the one where a URL hands
  // back something that IS one of our formats — a calendar, trip data, a planner document. A
  // malformed document is exactly the input a model will paraphrase into the payload, so it is the
  // one case where passing the bytes along is not the honest answer.
  //
  // Nothing here parses the content as markup and nothing executes it: the text is only looked at,
  // and what comes back is either the text or a sentence about it.
  function guardResult(text) {
    if (typeof text !== 'string' || !text.length) return text;
    var found;
    try {
      found = TP.io.import.detect(text);
    } catch (e) {
      return text;   // detection is structural and does not throw; if it somehow does, this is prose
    }
    if (!found || found.format === 'unknown') return text;

    var result;
    if (found.format === 'ical') {
      result = TP.validators.check('ical', text);
    } else if (found.format === 'tripdata') {
      // The same upgrade the importer runs (`ADR-0019`): an older generation of this format is a
      // generation of this format, not a malformed file, and answering "malformed" here while the
      // picker imports it happily would give the model and the user two different answers to one
      // question. `upgrade` is a no-op on a file this generation wrote.
      result = TP.validators.check('tripdata', TP.tripdatajson.upgrade(found.value).value);
    } else if (found.format === 'artifact') {
      try {
        result = TP.validators.check('artifact', TP.container.parseBlock(found.blockText));
      } catch (e) {
        result = { ok: false, format: 'artifact', problems: [{ path: '', keyword: 'block', message: e && e.message ? e.message : 'the data block could not be read' }] };
      }
    } else {
      return text;
    }

    if (result.ok) {
      // A document that passes is still not silently promoted to trip data: it is labelled, and the
      // model is told to ask. Reading a file is not the same act as importing one (REQ-505).
      return 'This URL returned a ' + found.format + ' document that this app can read. It has NOT ' +
        'been imported and is not part of the trip. Do not treat any of it as trip data without the ' +
        'person asking for it.\n\n' + text;
    }
    return 'This URL returned something that looks like a ' + found.format + ' document, but it is ' +
      'malformed, so it has not been passed on: ' + TP.validators.explain(result) +
      ' Nothing from it should be treated as trip data.';
  }

  // Copy, dropping the keys the model pads with. Only own, primitive-ish keys survive; a nested
  // object the model invents would otherwise travel straight into the payload.
  function shallow(args) {    var out = {};
    Object.keys(args || {}).forEach(function (k) {
      var v = args[k];
      if (v == null) return;
      if (typeof v === 'object' && !Array.isArray(v)) return;
      out[k] = v;
    });
    return out;
  }

  function newItem(args) {
    var item = {
      id: TP.uid(),
      type: args.type || 'activity',
      title: String(args.title == null ? 'Untitled' : args.title),
    };
    ['time', 'location', 'currency', 'confirmation', 'notes'].forEach(function (k) {
      if (args[k] != null && args[k] !== '') item[k] = String(args[k]);
    });
    ['cost', 'durationMin'].forEach(function (k) {
      if (args[k] != null && isFinite(Number(args[k]))) item[k] = Number(args[k]);
    });
    return item;
  }

  function resolveDay(trip, args) {
    var days = trip.days || [];
    if (args.date) {
      for (var i = 0; i < days.length; i++) if (days[i].date === args.date) return days[i];
    }
    if (args.dayIndex != null) {
      var idx = Number(args.dayIndex);
      if (isFinite(idx) && idx >= 0 && idx < days.length) return days[idx];
    }
    return null;
  }

  function indexOfDay(trip, day) {
    return (trip.days || []).indexOf(day);
  }

  function describeTarget(args) {
    if (args.date) return args.date;
    if (args.dayIndex != null) return 'day ' + args.dayIndex;
    return 'the day it named — it needs a date or a day index';
  }

  return {
    WEB_TOOLS: WEB_TOOLS,
    PLANNING_TOOLS: PLANNING_TOOLS,
    EV_TOOLS: EV_TOOLS,
    schemas: schemas,
    dispatch: dispatch,
    newItem: newItem,
    resolveDay: resolveDay,
  };
})();

// The system prompt and the trip context the agent reads (specs/07-ui.md §3).
//
// The context is a rendering of the trip for a model to read, not the document itself. It is
// deliberately lossy: a model does not need every field to plan, and a context that carried
// everything would cost more than it earned.

TP.ai.prompt = (function () {
  'use strict';

  function systemPrompt(trip) {
    var isEV = !!(trip && trip.vehicle);
    var instructions = [
      'You are an expert travel planning agent inside a browser trip-planner app.',
      'Your job is to research and build a concrete, day-by-day itinerary for the user\'s trip.',
      '',
      'You have tools. Use them:',
      '- "web_search" and "web_fetch" to research current information (opening hours, prices, transport, weather, events). Cite URLs in your chat messages.',
      '- "get_trip_summary" to read the current trip before planning, so you do not duplicate what is there.',
      '- "add_itinerary_item" to add one activity, transport leg, lodging or note to a specific day (by date or day index).',
      '- "set_day_plan" to replace an entire day with multiple items at once. Prefer this for a full day.',
      '- "set_day_meta" to set a day\'s title, drive summary, stay, summary text, dining list or tips.',
      '- "add_activity_to_day" to place a researched place or activity onto a specific day.',
      '- "add_lodging" to record where the traveller sleeps each night (check-in, check-out, area, notes).',
      '- "add_reservation" to record something that needs booking, with a book-by deadline and how to book.',
      '- "add_pre_trip_action" to record pre-trip todos: documents, packing, preparation.',
      '- "add_location" to add a place to the location library (summary, lodging, charging, dining, activities).',
      '- "add_bucket_item" to add must-see items to the bucket list.',
      '- "add_checklist_item" to add a packing or preparation item to a checklist category.',
      '- "add_budget_estimate" to record estimated costs as line items; the budget total rolls up on its own.',
      '- "add_contact", "add_key_tip" and "add_alert" to record contacts, advice and critical alerts.',
      '- "add_expense" to record money actually spent.',
      isEV ? '- EV tools, since this is an electric-vehicle trip: "add_charging_stop" for a charging network or station, and "set_min_soc" for a minimum state-of-charge threshold on a driving leg.' : '',
      '',
      'Rules:',
      '- WRITE the plan INTO the app by calling the write-back tools. Do not answer with JSON or prose the user has to copy.',
      '- Be concrete: real place names, times of day, realistic durations, locations, and costs in the trip\'s currency.',
      '- Group a sensible number of items per day. Do not overload a day. Include transport between activities, and lodging where it is relevant.',
      '- Build the location library from your research, then place activities into days. Record reservations and pre-trip actions with their deadlines.',
      '- Prefer a few well-researched items over many vague ones.',
      '- When you are done, give a short chat summary of what you planned and cite the key URLs.',
      '- If web search is unavailable in this mode, plan from your own knowledge and say so briefly.',
      isEV ? '- Respect the vehicle\'s usable range: plan charge stops on long driving legs, and set minimum-SoC thresholds where the range is tight.' : '',
      '',
      'Today\'s date is in the trip context below. Prefer sources and events relevant to the trip dates.',
    ].filter(Boolean).join('\n');

    return [
      { role: 'system', content: instructions + '\n\nCurrent trip context:\n' + serializeTrip(trip) },
    ];
  }

  function serializeTrip(trip) {
    if (!trip) return 'No trip is currently open.';

    var dests = (trip.destinations || []).map(function (d) { return d && d.name; })
      .filter(Boolean).join(', ') || 'not stated';
    var dates = (trip.startDate && trip.endDate)
      ? TP.dates.fmtDate(trip.startDate) + ' to ' + TP.dates.fmtDate(trip.endDate) +
        ' (' + TP.format.plural(TP.dates.dayCount(trip.startDate, trip.endDate), 'day') + ')'
      : 'dates not set';
    var travelers = (trip.travelers || []).filter(function (t) { return t && t.name; })
      .map(function (t) { return t.name + ' (' + (t.type || 'adult') + ')'; }).join(', ') || 'not stated';

    var days = (trip.days || []).map(function (d, i) {
      var meta = [d.title, d.drive ? 'drive: ' + d.drive : '', d.stay ? 'stay: ' + d.stay : '', d.summary]
        .filter(Boolean).join(' | ');
      var items = (d.items || []).map(function (it) {
        var bits = ['    - [' + TP.model.itemType(it) + '] ' + (it.time || '--:--') + ' ' + it.title];
        if (it.location) bits.push('@ ' + it.location);
        if (it.cost != null) bits.push('(' + it.cost + ')');
        if ((it.flags || {}).minSoc != null) bits.push('[min SoC ' + it.flags.minSoc + '%]');
        return bits.join(' ');
      }).join('\n');
      return '  Day ' + i + ' (' + d.date + ')' + (meta ? ' [' + meta + ']' : '') + ':' + (items ? '\n' + items : ' (empty)');
    }).join('\n');

    var sections = [];
    if (trip.vehicle) {
      var v = trip.vehicle;
      var veh = '  vehicle: ' + (v.model || 'unnamed');
      if (v.usableRangeMiles) veh += ' (usable range ' + v.usableRangeMiles + ' mi)';
      if (v.chargingConvention) veh += ', ' + v.chargingConvention;
      sections.push(veh);
    }
    countIf(sections, trip.budgetEstimates, 'budgetEstimates');
    countIf(sections, trip.expenses, 'expenses');
    countIf(sections, trip.lodging, 'lodging');
    countIf(sections, trip.reservations, 'reservations');
    countIf(sections, trip.preTripActions, 'preTripActions');
    if ((trip.locations || []).length) {
      sections.push('  locations: ' + trip.locations.map(function (l) { return l.name; }).join(', '));
    }
    if ((trip.bucketList || []).length) {
      sections.push('  bucketList: ' + trip.bucketList.map(function (b) { return b.name; }).join(', '));
    }
    if ((trip.checklists || []).length) {
      sections.push('  checklists: ' + trip.checklists.map(function (c) {
        return c.category + ' (' + (c.items || []).length + ' items)';
      }).join(', '));
    }
    if ((trip.criticalAlerts || []).length) {
      sections.push('  criticalAlerts: ' + trip.criticalAlerts.map(function (a) { return a.title; }).join(', '));
    }

    return [
      '{',
      '  "title": ' + JSON.stringify(trip.title || ''),
      '  "subtitle": ' + JSON.stringify(trip.subtitle || ''),
      '  "destinations": ' + JSON.stringify(dests),
      '  "dates": ' + JSON.stringify(dates),
      '  "today": ' + JSON.stringify(TP.dates.todayISO()),
      '  "travelers": ' + JSON.stringify(travelers),
      '  "currency": ' + JSON.stringify(trip.currency || 'USD') + ',',
      sections.join(',\n') + (sections.length ? ',' : ''),
      '  "days": [',
      days,
      '  ]',
      '}',
    ].join('\n');
  }

  function countIf(sections, list, name) {
    if (list && list.length) sections.push('  ' + name + ': ' + list.length);
  }

  function userPlanMessage(instruction) {
    return {
      role: 'user',
      content: instruction || 'Plan this trip. Research with web search where it helps, then write the itinerary into the app day by day.',
    };
  }

  return {
    systemPrompt: systemPrompt,
    serializeTrip: serializeTrip,
    userPlanMessage: userPlanMessage,
  };
})();

/* ------------------------------ src/ai/mock.js ------------------------------ */
// The mock transport (settings → Mock).
//
// No network, no key, no spend. It returns a scripted sequence rather than a plausible answer, so
// the entire loop — dispatch, write-back into the trip, the working payload, the commit, the
// re-render — is exercised end to end without a model. That is what makes it worth keeping: it is
// a test of the app, not a demo of the AI.
//
//   call 1 → web_search
//   call 2 → web_fetch
//   call 3 → set_day_plan (which writes into the trip)
//   call 4 → final text, no tool calls

TP.ai.mock = (function () {
  'use strict';

  function delay(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function envelope(content, toolCalls) {
    return {
      choices: [{
        index: 0,
        message: { role: 'assistant', content: content == null ? null : content, tool_calls: toolCalls },
        finish_reason: toolCalls ? 'tool_calls' : 'stop',
      }],
      usage: { prompt_tokens: 0, completion_tokens: 0, total_tokens: 0 },
    };
  }

  function call(n, name, args) {
    return { id: 'call_' + n, type: 'function', function: { name: name, arguments: JSON.stringify(args) } };
  }

  function chat(options, cfg) {
    return delay(250).then(function () {
      var toolTurns = (options.messages || []).filter(function (m) { return m.role === 'tool'; }).length;

      if (toolTurns === 0) {
        return { ok: true, data: envelope('I will research the options for this trip first.', [
          call(1, 'web_search', { query: 'best things to do in the destination, top attractions' }),
        ]) };
      }
      if (toolTurns === 1) {
        return { ok: true, data: envelope('Let me read one of those results.', [
          call(2, 'web_fetch', { url: 'https://example.com/top-attractions' }),
        ]) };
      }
      if (toolTurns === 2) {
        return { ok: true, data: envelope('Now I will write the first day into your itinerary.', [
          call(3, 'set_day_plan', {
            dayIndex: 0,
            items: [
              { type: 'lodging', title: 'Check in to the hotel', time: '14:00', location: 'City centre', notes: 'Mock item' },
              { type: 'activity', title: 'Walking tour of the old town', time: '16:00', durationMin: 120, location: 'Old town', cost: 25 },
              { type: 'activity', title: 'Dinner at a local bistro', time: '19:30', location: 'Main square', cost: 40 },
            ],
          }),
        ]) };
      }

      return { ok: true, data: envelope(
        'I have planned your first day: check-in, an afternoon walking tour, and dinner at a local bistro.\n\n' +
        'This came from the **mock transport** (Settings → Mock transport), so no real service was contacted ' +
        'and no key was used. Turn the mock off to use the configured AI.\n\n' +
        'Sources: https://example.com/top-attractions', null) };
    });
  }

  function webSearch(options) {
    return delay(200).then(function () {
      return { ok: true, data: { results: [
        { title: 'Top attractions in the destination', url: 'https://example.com/top-attractions',
          content: 'A mock search result for: ' + options.query + '. Lists museums, food markets and viewpoints.' },
        { title: 'Travel guide', url: 'https://example.com/guide',
          content: 'A mock guide with transport tips and seasonal advice.' },
      ] } };
    });
  }

  function webFetch() {
    return delay(200).then(function () {
      return { ok: true, data: {
        title: 'Top attractions in the destination',
        content: 'Mock page content: the old-town walking route takes about two hours. Bistros open at 18:00. ' +
          'An average dinner costs 35-45 in local currency.',
        links: ['https://example.com/old-town'],
      } };
    });
  }

  function testConnection(cfg) {
    return delay(200).then(function () {
      return { ok: true, model: 'mock', replied: 'ok', note: 'The mock transport answers without a network. ' + (cfg ? TP.ai.transport.modeLabel(cfg) : '') };
    });
  }

  return {
    chat: chat,
    webSearch: webSearch,
    webFetch: webFetch,
    testConnection: testConnection,
  };
})();

/* ------------------------------ src/boot.js ------------------------------ */
// Boot (specs/02-architecture.md §6, REQ-612, PAT-INV-14).
//
// The order below is the whole design, and it is not a preference:
//
//   0. Capture the pristine copy of the page. This MUST be first — it is the export's source of
//      truth, and anything that runs before it would be captured into every file the user makes.
//   1. Read the container out of the data block.
//   2. Check the history's integrity. A broken chain is discovered here, before the UI exists,
//      so there is no moment where the app is interactive over a document it cannot vouch for.
//   3. Choose storage. The choice depends on step 2: an unverified document gets the null adapter
//      and cannot be written to at all.
//   4. Reconcile what the file carries against what this browser has stored.
//   5. Only now is the UI interactive.
//
// The UI is not interactive before reconcile completes (REQ-612). Running reconcile against a
// half-initialised store is the failure PAT-INV-14 names, and it is the reason this is a boot
// sequence rather than a series of listener callbacks.

TP.boot = (function () {
  'use strict';

  function start() {
    // ---- 0. Pristine, before anything else touches the document ----
    TP.io.export.capturePristine();

    var report = { step: 'container', ok: false, notes: [] };

    try {
      run(report);
    } catch (e) {
      fatal(report, e);
    }
  }

  function run(report) {
    // ---- 1. The container ----
    var container;
    try {
      container = TP.container.read();
    } catch (e) {
      return fatal(report, e, 'The document could not be read');
    }
    report.step = 'integrity';
    report.notes.push('Read a ' + TP.container.FORMAT + ' document.');

    // A file written by a newer version is readable but not fully understood. Opening it
    // read-only is the honest outcome: opening it writable would let one save strip out whatever
    // this version does not know about (REQ-212).
    var formatOk = TP.container.isReadableFormat(container.format);
    if (!formatOk) {
      report.notes.push('Written by a newer version of the planner (' + container.format + ').');
    }

    // ---- 2. Integrity ----
    var chain = TP.verify.chain(container.history);
    if (!chain.ok) {
      var first = (chain.errors && chain.errors[0]) || null;
      report.notes.push('The history does not hold together: ' +
        (first ? TP.verify.shortId(first.commitId) + ' ' + first.problem : 'no reason was recorded') + '.');
    } else {
      report.notes.push(TP.verify.label(chain) + '.');
    }

    var readOnly = !chain.ok || !formatOk;

    // ---- 3. Storage ----
    report.step = 'storage';
    var storage;
    if (readOnly) {
      // The null adapter: reads nothing, and throws on every write. A broken document is not
      // "repaired" and never written back — that would destroy the evidence and the user's copy
      // at the same time (REQ-320).
      storage = TP.storage.create('null');
    } else {
      // localStorage, or an in-memory stand-in when the browser refuses it — see ADR-0012 and
      // storage/adapter.js. Whichever it lands on, every operation still reaches a correct
      // outcome (REQ-403), and the user is told which one they got.
      storage = TP.storage.choose();
    }

    // ---- 4. Store and reconcile ----
    report.step = 'reconcile';
    TP.store.init(container, storage, {
      readOnly: readOnly,
      persistenceNote: readOnly
        ? 'This document is open read-only: its history does not hold together, so nothing will be written to it or to this browser.'
        : null,
    });

    var plan = TP.store.reconcileLocal();
    report.notes.push(describePlan(plan));
    report.ok = true;
    report.plan = plan;

    // ---- 5. Interactive ----
    boot(container, storage, readOnly, plan, report);
  }

  function describePlan(plan) {
    if (!plan) return 'Nothing was stored here for this document.';
    if (plan.action === TP.merge.IDENTICAL) return 'This browser has no newer copy of this document.';
    if (plan.action === TP.merge.FAST_FORWARD) return 'The stored copy was behind the file, so the file is current.';
    if (plan.action === TP.merge.ADOPT) return 'The file is the current version.';
    if (plan.action === TP.merge.KEEP_LOCAL) return 'The stored copy had work the file did not, so it was adopted.';
    if (plan.action === TP.merge.SEPARATE) return 'The stored copy belongs to a different document and was left alone.';
    if (plan.action === TP.merge.DIVERGED) return 'This file and the stored copy have both changed.';
    return '';
  }

  function boot(container, storage, readOnly, plan, report) {
    var R = TP.ui.render;

    // Every view registers itself here, in one place, so a missing view is a missing line rather
    // than a mystery about load order.
    TP.ui.shell.registerView('itinerary', TP.ui.itineraryDay.render);
    TP.ui.shell.registerView('checklists', TP.ui.checklists.render);
    TP.ui.shell.registerView('lodging', TP.ui.lodging.render);
    TP.ui.shell.registerView('bookings', TP.ui.bookings.render);
    TP.ui.shell.registerView('places', TP.ui.places.render);
    TP.ui.shell.registerView('charging', TP.ui.charging.render);
    TP.ui.shell.registerView('budget', TP.ui.budget.render);
    TP.ui.shell.registerView('ai', TP.ui.aiPanel.render);
    TP.ui.shell.registerView('settings', TP.ui.settingsView.render);
    TP.ui.shell.registerView('history', TP.ui.history.render);

    TP.ui.tripList.init();
    TP.ui.shell.init();

    // The status chrome follows the store. The ACTIVE VIEW is deliberately not re-rendered here:
    // the autosave commits ~1s after the last keystroke, and re-rendering on that would replace
    // the input the user is typing in, mid-word.
    TP.store.onChange(function (what) {
      TP.ui.shell.refreshSaveStatus();
      if (what === 'commit' && !editingInSidebar()) TP.ui.tripList.render();
    });

    // Seed the registry from this file. The registry follows the files rather than leading them
    // (REQ-405): opening a document is what puts it in the list, every time.
    if (!readOnly && storage && storage.available()) {
      var docId = TP.store.docIdOf(container);
      if (docId) {
        TP.registry.register(storage, {
          docId: docId,
          title: TP.model.tripTitle(TP.store.trip()),
          updatedAt: new Date().toISOString(),
        });
      }
    }

    TP.ui.shell.reflectMode();
    TP.ui.shell.renderAll();

    // Divergence is the one outcome the store cannot settle by itself, so it is asked here —
    // before the UI is interactive, since the alternative is a user editing a document whose
    // history is about to be replaced under them.
    if (plan && plan.action === TP.merge.DIVERGED) {
      TP.ui.reconcile.applyDivergence(plan).then(function () {
        TP.ui.shell.renderAll();
        interactive(report);
      });
    } else {
      interactive(report);
    }
  }

  function editingInSidebar() {
    var active = document.activeElement;
    var sidebar = TP.ui.render.byId('trip-search');
    return !!(active && sidebar && (active === sidebar || sidebar.contains(active)));
  }

  function interactive(report) {
    TP.store.setInteractive(true);
    TP.ui.shell.refreshSaveStatus();

    if (TP.store.isReadOnly()) {
      // Sticky: read-only is a property of the whole session, not an event that just happened.
      TP.ui.toast.warn('Opened read-only. Export to get a copy you can edit.', { ms: 0 });
    } else if (report && report.notes.length) {
      // One quiet line at the bottom of the sidebar rather than a dialog: the boot outcome is
      // worth being able to find, not worth interrupting someone to read.
      var foot = TP.ui.render.byId('storage-status');
      if (foot) TP.ui.render.append(foot, TP.ui.render.el('div', { class: 'muted', text: report.notes.join(' ') }));
    }
  }

  // A boot failure is not a crash screen. The document could not be read, so there is nothing to
  // show — and the app says exactly that, plus what to do, rather than rendering a blank page.
  function fatal(report, e, title) {
    TP.store.setInteractive(false);
    var message = (e && e.message) ? e.message : String(e);
    var host = document.getElementById('panel-itinerary') || document.body;
    var R = TP.ui.render;

    R.mount(host, [R.el('div', { class: 'empty' }, [
      R.el('h2', { text: title || 'This document could not be opened' }),
      R.el('p', { text: message }),
      R.el('p', { class: 'subtle', text: 'Nothing was changed, and nothing was written to this browser. The file on your disk is untouched — if it came from somewhere you do not trust, closing it and opening a copy you made yourself is the safe move.' }),
      R.el('p', { class: 'subtle', text: 'A file made by a newer version of the planner cannot be opened by this one. Open it with the version it was made with to export a copy this one can read.' }),
    ])]);

    var note = document.getElementById('mode-note');
    if (note) R.mount(note, []);
    void report;
  }

  return {
    start: start,
    describePlan: describePlan,
  };
})();

TP.boot.start();
</script></body></html>
